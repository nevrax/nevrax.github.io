          toast(`${invalid.length} noduri au primit coordonate noi; verifică și repoziționează-le`);
        }

        /**
         * Reface zona vizibilă, dimensionează nodurile, desenează conexiunile și sincronizează selecția cu modelul.
         */
        function render(fastEdges = false) {
          if (!drag) clearSnapGuides();
          if (fastFrame) {
            cancelAnimationFrame(fastFrame);
            fastFrame = 0;
          }
          applyGridAppearance();
          calculateNodeSizes();
          const invalid = nodes.reduce(
            (count, node) => count + (!usableRect(nodeRect(node)) ? 1 : 0),
            0,
          );
          const warning = $('#geometryWarning');
          warning.hidden = invalid === 0;
          warning.replaceChildren();
          if (invalid) {
            warning.appendChild(
              document.createTextNode(
                `${invalid} noduri au coordonate invalide și nu sunt afișate. `,
              ),
            );
            const repair = document.createElement('button');
            repair.type = 'button';
            repair.textContent = 'Repară coordonatele';
            repair.onclick = repairInvalidGeometry;
            warning.appendChild(repair);
          }
          overviewActive = scale < 0.22;
          overview.style.display = overviewActive ? 'block' : 'none';
          world.style.visibility = overviewActive ? 'hidden' : 'visible';
          if (overviewActive) {
            world.querySelectorAll('.node,.internal-edges').forEach((d) => d.remove());
            innerEdgeLayers.clear();
            svg.replaceChildren();
            edgeHandles.replaceChildren();
            portsLayer.replaceChildren();
            renderResizeHandles();
            paintOverviewSoon();
            return;
          }
          const bounds = visibleBounds(),
            hasChildren = new Set(nodes.map((n) => n.parent).filter(Boolean));
          const visible = visibleNodes(bounds);
          world.querySelectorAll('.node').forEach((d) => d.remove());
          $('#empty').style.display = nodes.length ? 'none' : 'block';
          for (const n of visible) world.appendChild(createNodeElement(n, hasChildren.has(n.id)));
          let corrected = false;
          for (const n of visible) {
            const d = world.querySelector(`[data-id="${n.id}"]`),
              signature = JSON.stringify([n.label, n.manualW, n.manualH, !!n.labelPos]);
            if (!hasChildren.has(n.id) && !gridNode(n) && !isNetworkSegment(n)) {
              const measured = {
                signature,
                w: Math.max(86, d.offsetWidth),
                h: Math.max(n.labelPos ? 4 : 54, d.offsetHeight),
              };
              const old = naturalSizes.get(n.id);
              if (!old || old.w !== measured.w || old.h !== measured.h) {
                naturalSizes.set(n.id, measured);
                corrected = true;
              }
            }
          }
          if (corrected) {
            calculateNodeSizes(true);
            viewIndexVersion = -1;
            edgeIndexVersion = -1;
          }
          for (const n of visible) {
            const d = world.querySelector(`[data-id="${n.id}"]`),
              size = dimensions(n);
            d.style.maxWidth = 'none';
            d.style.width = size.w + 'px';
            d.style.height = size.h + 'px';
          }
          svg.style.zIndex = String((nodes.length + 1) * 8 + 100);
          world.appendChild(svg);
          world.appendChild(portsLayer);
          world.appendChild(edgeHandles);
          renderPorts();
          drawEdges(fastEdges);
          renderResizeHandles();
          if (fastEdges) scheduleRoutePass();
        }

        // ============================================================================
        // 09. Stiluri, palete și editarea conexiunilor
        // ============================================================================

        /**
         * Sincronizează controalele de stil și porturi cu selecția curentă.
         */
        function syncEdgeStyle() {
          const edge = edges.find((e) => e.id === selected),
            selectedNode = selectedNodes.size === 1 ? el([...selectedNodes][0]) : null;
          let node = portPositionMode ? el(selectedPortNodeId) : selectedNode;
          if (portPositionMode && (!node || !hasCardinalPorts(node))) {
            portPositionMode = false;
            selectedPorts.clear();
            selectedPortNodeId = null;
            node = selectedNode;
            document.body.classList.remove('port-position-mode');
            $('#portPositionMode').classList.remove('active');
          }
          const hasNode = !!node,
            hasSelection = !!edge || selectedNodes.size > 0;
          const edgeStyle = $('#edgeStyle'),
            nodeStyle = $('#nodeStyle'),
            portCounts = $('#portCounts'),
            editLabel = $('#editLabel');
          if (edgeStyle) edgeStyle.hidden = !edge;
          if (nodeStyle) nodeStyle.hidden = portPositionMode || !selectedNode;
          if (portCounts)
            portCounts.hidden = !hasNode || toolbarSettings.enabled.portCounts === false;
          if (editLabel) editLabel.hidden = !toolbarSettings.enabled.editLabel || !hasSelection;
          $('#resetLabelPosition').disabled = !hasNode || !node.labelPos;
          if (labelPositionMode && !node) {
            labelPositionMode = false;
            document.body.classList.remove('label-position-mode');
            $('#labelMoveMode').classList.remove('active');
            world.querySelectorAll('.node').forEach((d) => {
              d.classList.remove('label-position-mode');
              if (!el(d.dataset.id)?.labelPos) d.classList.remove('label-positioned');
            });
          }
          $('#portPositionMode').hidden = !hasNode || !hasCardinalPorts(node);
          $('#portPositionMode').classList.toggle('active', portPositionMode);
          $('#labelMoveMode').classList.toggle('active', labelPositionMode);
          for (const button of document.querySelectorAll('[data-port-side][data-delta]')) {
            const side = button.dataset.portSide,
              delta = Number(button.dataset.delta),
              count = cardinalPortCount(node, side),
              opposite = side === 'N' ? 'S' : side === 'S' ? 'N' : null,
              blocked =
                delta > 0 &&
                opposite &&
                hasNode &&
                !isNetworkSegment(node) &&
                dimensions(node).h < 42 &&
                cardinalPortCount(node, opposite) > 0;
            button.disabled = !hasNode || (delta < 0 ? count === 0 : !!blocked);
            button.title = blocked
              ? `${side} dezactivat: nodul are sub 42 px și porturi ${opposite}`
              : delta < 0
                ? `Elimină port ${side}`
                : `Adaugă port ${side}`;
          }
          const setGlyph =
              /**
               * Actualizează culoarea simbolului butonului pentru stilul selectat.
               */
              (id, color) => {
                const button = $('#' + id);
                if (!button) return;
                button.style.setProperty(
                  '--glyph-color',
                  color === 'transparent' ? '#94a3b8' : color,
                );
                button.classList.toggle('no-color', color === 'transparent');
              },
            edgeLineStyle = $('#edgeLineStyle'),
            nodeBorderStyle = $('#nodeBorderStyle');
          if (edge) {
            setGlyph('edgeColorBtn', edge.color || '#52617a');
            setGlyph('edgeLabelColorBtn', edge.labelColor || '#29354d');
            if (edgeLineStyle)
              edgeLineStyle.value = edge.lineStyle || (edge.dashed ? 'dashed' : 'solid');
          }
          if (node) {
            setGlyph('nodeFillBtn', node.fill || '#ffffff');
            setGlyph('nodeStrokeBtn', node.stroke || '#42536f');
            setGlyph('nodeTextBtn', node.textColor || '#29354d');
            if (nodeBorderStyle) nodeBorderStyle.value = node.borderStyle || 'solid';
          }
          if (edgeLineStyle) edgeLineStyle.dataset.style = edgeLineStyle.value;
          if (nodeBorderStyle) nodeBorderStyle.dataset.style = nodeBorderStyle.value;
          renderProperties();
          updateToolbarLabels();
          if (colorKind && (colorKind === 'edge' || colorKind === 'edgeText' ? !edge : !node))
            $('#colorPopover').hidden = true;
        }

        /**
         * Returnează culoarea implicită pentru categoria de stil cerută.
         */
        function defaultColor(kind) {
          if (kind === 'edge') return '#52617a';
          if (kind === 'stroke') return '#42536f';
          if (kind === 'text' || kind === 'edgeText') return '#29354d';
          const node = el([...selectedNodes][0]);
          return node?.parent ? '#fbfcff' : '#ffffff';
        }

        /**
         * Citește culoarea selecției sau revine la valoarea implicită a categoriei.
         */
        function currentColor(kind) {
          if (kind === 'edge' || kind === 'edgeText') {
            const edge = edges.find((e) => e.id === selected);
            return edge?.[kind === 'edge' ? 'color' : 'labelColor'] || defaultColor(kind);
          }
          const node = el([...selectedNodes][0]),
            value = node?.[kind === 'fill' ? 'fill' : kind === 'stroke' ? 'stroke' : 'textColor'];
          return value && value !== 'transparent' ? value : defaultColor(kind);
        }

        /**
         * Aplică o culoare selecției și înregistrează modificarea în istoricul local.
         */
        function applyColor(kind, value) {
          if (kind === 'edge' || kind === 'edgeText') {
            const edge = edges.find((e) => e.id === selected);
            if (!edge) return;
            const key = kind === 'edge' ? 'color' : 'labelColor';
            if (value) edge[key] = value;
            else delete edge[key];
          } else {
            if (!selectedNodes.size) return;
            for (const id of selectedNodes) {
              const node = el(id);
              if (!node) continue;
              const key = kind === 'fill' ? 'fill' : kind === 'stroke' ? 'stroke' : 'textColor';
              if (value) node[key] = value;
              else delete node[key];
            }
          }
          remember();
          render();
          $('#colorPopover').hidden = true;
        }

        /**
         * Deschide sau închide paleta potrivită, o poziționează lângă buton și sincronizează culoarea curentă.
         */
        function openColorPalette(kind, button) {
          const pop = $('#colorPopover');
          if (colorKind === kind && !pop.hidden) {
            pop.hidden = true;
            return;
          }
          colorKind = kind;
          const remove = $('#removeColor');
          remove.hidden = kind !== 'fill' && kind !== 'stroke';
          remove.textContent = kind === 'fill' ? 'Fără umplere (transparent)' : 'Fără contur';
          remove.setAttribute(
            'aria-pressed',
            String(
              el([...selectedNodes][0])?.[kind === 'fill' ? 'fill' : 'stroke'] === 'transparent',
            ),
          );
          $('#colorTitle').textContent =
            kind === 'fill'
              ? 'Fundal nod'
              : kind === 'stroke'
                ? 'Contur nod'
                : kind === 'text'
                  ? 'Text nod'
                  : kind === 'edgeText'
                    ? 'Text legătură'
                    : 'Culoarea liniei';
          const color = currentColor(kind);
          $('#customColor').value = color;
          $('#colorHex').value = color;
          pop.hidden = false;
          const r = button.getBoundingClientRect(),
            left = Math.max(8, Math.min(window.innerWidth - pop.offsetWidth - 8, r.left));
          pop.style.left = left + 'px';
          pop.style.top =
            Math.max(8, Math.min(window.innerHeight - pop.offsetHeight - 8, r.bottom + 6)) + 'px';
        }

        /**
         * Selectează o conexiune și elimină selecția de noduri pentru a afișa comenzile ei.
         */
        function selectEdge(id) {
          if (selected !== id) {
            selectedEdgePoint = null;
            selectedEdgeEnd = null;
          }
          selected = id;
          selectedNodes.clear();
          // Păstrează ținta DOM între cele două clicuri; reconstruirea ei ar pierde dublul clic.
          world
            .querySelectorAll('.node.selected')
            .forEach((node) => node.classList.remove('selected'));
          world
            .querySelectorAll('path.edge')
            .forEach((path) => path.classList.toggle('selected', path.dataset.id === id));
          world
            .querySelectorAll('.edge-label')
            .forEach((text) => text.classList.toggle('selected', text.dataset.edge === id));
          syncEdgeStyle();
          renderResizeHandles();
          const active = collectEdgePaths(false).find((item) => item.e.id === id);
          edgeHandles.replaceChildren();
          if (active) drawEdgeHandles(active.e, active.points);
          renderedSelectedEdge = id;
        }

        /**
         * Inițiază mutarea punctului intermediar al unei conexiuni și capturează pointerul.
         */
        function beginEdgeBend(ev, edge, point, index) {
          if (ev.pointerType === 'mouse' && ev.button !== 0) return;
          ev.preventDefault();
          ev.stopPropagation();
          const route = collectEdgePaths(false).find((item) => item.e.id === edge.id);
          if (!route || route.points.length - 2 > 64) {
            toast('Traseul are prea multe coturi pentru editare manuală.');
            return;
          }
          selected = edge.id;
          selectedEdgePoint = index;
          selectedEdgeEnd = null;
          selectedNodes.clear();
          drag = {
            kind: 'edge-bend',
            id: edge.id,
            index,
            start: { ...point },
            original: route.points.slice(1, -1).map((p) => ({ ...p })),
            hadWaypoints: Array.isArray(edge.waypoints),
            originalWaypoint: edge.waypoint ? { ...edge.waypoint } : null,
            startClientX: ev.clientX,
            startClientY: ev.clientY,
            moved: false,
          };
          refreshSelectedEdgePoint();
          renderProperties();
        }

        /**
         * Actualizează punctul intermediar și traseul în timpul tragerii, cu snap dacă este activ.
         */
        function moveEdgeBend(ev) {
          const dx = (ev.clientX - drag.startClientX) / scale,
            dy = (ev.clientY - drag.startClientY) / scale;
          if (!drag.moved && Math.hypot(dx, dy) < 3 / scale) return;
          if (!drag.moved) canvas.setPointerCapture(ev.pointerId);
          drag.moved = true;
          const edge = edges.find((item) => item.id === drag.id);
          if (!edge) return;
          const round = gridSettings.snap ? snapGrid : Math.round;
          edge.waypoints = drag.original.map((p) => ({ ...p }));
          edge.waypoints[drag.index] = { x: round(drag.start.x + dx), y: round(drag.start.y + dy) };
          delete edge.waypoint;
          routeCache.delete(edge.id);
          drawEdges(true);
        }

        /**
         * Inițiază mutarea unuia dintre capetele conexiunii și păstrează informația necesară anulării.
         */
        function beginEdgeEnd(ev, edge, end, fixed, point) {
          if (ev.pointerType === 'mouse' && ev.button !== 0) return;
          ev.preventDefault();
          ev.stopPropagation();
          selectEdgeEnd(end, edge.id);
          const route = collectEdgePaths(false).find((item) => item.e.id === edge.id);
          drag = {
            kind: 'edge-end',
            id: edge.id,
            end,
            fixed,
            pointer: { ...point },
            to: null,
            toPort: null,
            startClientX: ev.clientX,
            startClientY: ev.clientY,
            moved: false,
            originalPoints: route?.points.map((p) => ({ ...p })) || [point, fixed],
          };
          ev.target.setPointerCapture?.(ev.pointerId);
        }

        /**
         * Actualizează previzualizarea capătului tras și evidențiază ținta posibilă.
         */
        function moveEdgeEnd(ev) {
          const edge = edges.find((item) => item.id === drag.id);
          if (!edge) return;
          if (
            !drag.moved &&
            Math.hypot(ev.clientX - drag.startClientX, ev.clientY - drag.startClientY) <= 4
          )
            return;
          if (!drag.moved) {
            drag.moved = true;
            canvas.setPointerCapture(ev.pointerId);
            renderPorts();
          }
          const p = local(ev),
            opposite = drag.end === 'from' ? edge.to : edge.from,
            target = edgeTargetAt(ev, opposite);
          drag.pointer = { x: (p.x - pan.x) / scale, y: (p.y - pan.y) / scale };
          drag.to = target?.dataset.node || null;
          drag.toPort = target?.dataset.port || null;
          portsLayer
            .querySelectorAll('.port.target')
            .forEach((dot) => dot.classList.remove('target'));
          if (target) target.classList.add('target');
          drawEdges(true);
        }

        /**
         * Reconectează capătul la ținta validă sau restaurează starea inițială a conexiunii.
         */
        function finishEdgeEnd(ev) {
          if (!drag.moved) {
            drag = null;
            return;
          }
          const held = drag,
            edge = edges.find((item) => item.id === held.id),
            oppositeEnd = held.end === 'from' ? 'to' : 'from',
            opposite = edge?.[oppositeEnd],
            target = edge ? edgeTargetAt(ev, opposite) : null,
            moved = Math.hypot(ev.clientX - held.startClientX, ev.clientY - held.startClientY) > 4;
          drag = null;
          routeCache.delete(held.id);
          if (edge && moved) {
            if (target) {
              if (opposite && el(opposite) && !edge[oppositeEnd + 'Port'])
                edge[oppositeEnd + 'Port'] = nearestPortName(el(opposite), held.fixed);
              edge[held.end] = target.dataset.node;
              edge[held.end + 'Port'] = target.dataset.port;
              delete edge[held.end + 'Point'];
            } else {
              const p = local(ev);
              edge[held.end] = null;
              delete edge[held.end + 'Port'];
              const round = gridSettings.snap ? snapGrid : Math.round;
              edge[held.end + 'Point'] = {
                x: round((p.x - pan.x) / scale),
                y: round((p.y - pan.y) / scale),
              };
            }
            remember();
            toast(target ? 'Capăt reconectat' : 'Capăt mutat pe pânză');
          }
          render();
        }

        /**
         * Creează mânerele de mutare pentru capete și pentru punctul intermediar al conexiunii selectate.
         */
        function drawEdgeHandles(edge, points) {
          const manual = Array.isArray(edge.waypoints) || !!edge.waypoint;
          if (selectedEdgePoint !== null && selectedEdgePoint >= points.length - 2)
            selectedEdgePoint = null;
          const entries = [
            { kind: 'from', point: points[0] },
            { kind: 'to', point: points.at(-1) },
            ...points.slice(1, -1).map((point, index) => ({ kind: 'point', point, index })),
          ];
          for (const { kind, point, index } of entries) {
            const active =
              kind === 'point' ? index === selectedEdgePoint : kind === selectedEdgeEnd;
            const dot = document.createElement('div');
            dot.className =
              'edge-handle' +
              (kind === 'point' ? ' mid' : '') +
              (kind === 'point' && !manual ? ' automatic' : '') +
              (active ? ' active' : '');
            dot.dataset.edge = edge.id;
            if (kind === 'point') dot.dataset.point = String(index);
            else dot.dataset.end = kind;
            Object.assign(dot.style, {
              left: point.x + 'px',
              top: point.y + 'px',
              width: 24 / scale + 'px',
              height: 24 / scale + 'px',
            });
            dot.title =
              kind === 'point'
                ? 'Trage punctul; Delete elimină numai punctul'
                : 'Trage capătul pentru reconectare';
            dot.setAttribute(
              'aria-label',
              kind === 'point'
                ? 'Punct intermediar ' + (index + 1)
                : 'Capăt ' + (kind === 'from' ? 'început' : 'sfârșit'),
            );
            dot.setAttribute('role', 'button');
            dot.tabIndex = 0;
            dot.setAttribute('aria-pressed', String(active));
            dot.addEventListener('pointerdown', (ev) =>
              kind === 'point'
                ? beginEdgeBend(ev, edge, point, index)
                : beginEdgeEnd(ev, edge, kind, kind === 'from' ? points.at(-1) : points[0], point),
            );
            dot.addEventListener('click', (ev) => {
              ev.stopPropagation();
              if (kind === 'point') {
                selectEdgePoint(index, edge.id);
              } else selectEdgeEnd(kind, edge.id);
            });
            dot.addEventListener('keydown', (event) => {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                event.stopPropagation();
                if (kind === 'point') selectEdgePoint(index, edge.id);
                else selectEdgeEnd(kind, edge.id);
              }
            });
            edgeHandles.append(dot);
          }
        }

        /**
         * Desenează conexiunea temporară dintre portul sursă și pointer.
         */
        function drawPortPreview() {
          if (drag?.kind !== 'port') return;
          const from = el(drag.from);
          if (!from) return;
          const p = portPointForNode(from, drag.fromPort),
            to = drag.to && el(drag.to),
            q = to ? portPointForNode(to, drag.toPort) : drag.pointer;
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', `M ${p.x} ${p.y} L ${q.x} ${q.y}`);
          path.setAttribute('class', 'edge preview');
          svg.appendChild(path);
        }
        // --- Desenarea conexiunilor ---------------------------------------------------------
        // Panoramarea și mărirea transformă numai vederea. Geometria conexiunilor și evitarea obstacolelor
        // se recalculează și în timpul tragerii, pentru a urmări imediat nodurile mutate.

        /**
         * Adună traseele vizibile care trebuie desenate, folosind cache-ul când geometria permite.
         */
        function collectEdgePaths(fast = false) {
          const view = visibleBounds(160);
          const drawn = visibleEdges(view);
          const paths = [];
          const liveMoving = new Set(
            ['node', 'group', 'resize', 'rotate', 'port-position'].includes(drag?.kind)
              ? [...(drag.affected || [drag.id]), ...(drag.previewParents || [])]
              : [],
          );
          let routeBudget = fast ? 0 : 8,
            pendingRoutes = false;
          for (const e of drawn) {
            const a = el(e.from),
              b = el(e.to),
              held = drag?.kind === 'edge-end' && drag.id === e.id && drag.moved ? drag : null;
            if ((!a && !e.fromPoint) || (!b && !e.toPoint)) continue;
            const manual = edgeWaypoints(e);
            const range = edgeBounds(e);
            if (!range) continue;
            if (!overlaps(range, view) && selected !== e.id) continue;
            const cached = routeCache.get(e.id),
              movingEdge = liveMoving.has(e.from) || liveMoving.has(e.to),
              cachePossible = cached?.version === geometryVersion && !movingEdge;
            const validWaypoint = Array.isArray(e.waypoints) || !!e.waypoint;
            let nearby =
              !fast && !cachePossible && !validWaypoint && a && b && routeBudget > 0
                ? routeObstacles(a, b, range)
                : [];
            const [autoA, autoB] =
              a && b
                ? cachePossible
                  ? [cached.fromPort, cached.toPort]
                  : autoPorts(a, b, nearby)
                : ['e', 'w'];
            const fromPort = hasPort(a, e.fromPort) ? e.fromPort : autoA,
              toPort = hasPort(b, e.toPort) ? e.toPort : autoB;
            let p = a ? portPointForNode(a, fromPort) : e.fromPoint,
              q = b ? portPointForNode(b, toPort) : e.toPoint;
            if (held) {
              const target = held.to && el(held.to),
                moving = target ? portPointForNode(target, held.toPort) : held.pointer;
              if (held.end === 'from') p = moving;
              else q = moving;
            }
            if (!p || !q) continue;
            let points,
              deferred = false;
            const cacheValid =
              cached?.version === geometryVersion &&
              cached.p.x === p.x &&
              cached.p.y === p.y &&
              cached.q.x === q.x &&
              cached.q.y === q.y;
            const calculateRoute =
              !fast && !cacheValid && !validWaypoint && a && b && !held && routeBudget > 0;
            if (calculateRoute && cachePossible) nearby = routeObstacles(a, b, range);
            if (validWaypoint) points = [p, ...manual, q];
            else if (held) points = [p, ...held.originalPoints.slice(1, -1), q];
            else if (directRoute(e, p, q)) points = [p, q];
            else if (fast && cacheValid) points = cached.points;
            else if (fast) points = gridSettings.snap ? simpleOrthogonal(p, q, []) : [p, q];
            else if (cacheValid) points = cached.points;
            else if (a && b && calculateRoute) {
              routeBudget--;
              const sideA = portSide(fromPort, nodeCenter(a), nodeCenter(b), a),
                sideB = portSide(toPort, nodeCenter(b), nodeCenter(a), b);
              points = routePath(p, q, sideA, sideB, a.id, b.id, nearby);
            } else if (a && b) {
              points = gridSettings.snap ? simpleOrthogonal(p, q, []) : [p, q];
              deferred = true;
              pendingRoutes = true;
            } else points = [p, q];
            if (!fast && !e.preview && !deferred && !held)
              routeCache.set(e.id, {
                version: geometryVersion,
                p: { ...p },
                q: { ...q },
                fromPort,
                toPort,
                points,
              });
            // Traseele amânate se desenează la actualizarea următoare, fără diagonale provizorii inventate.
            if (deferred && !fast) continue;
            paths.push({ e, points, bridges: [], fromPort, toPort, heldEnd: held?.end });
          }
          if (!fast && paths.length < 120) {
            for (let i = 0; i < paths.length; i++)
              for (let j = i + 1; j < paths.length; j++)
                if (!paths[i].e.direct && !paths[j].e.direct)
                  paths[j].bridges.push(...routeCrossings(paths[j].points, paths[i].points));
          }
          if (pendingRoutes && !fast) scheduleRoutePass();
          return paths;
        }

        /**
         * Reface straturile SVG, traseele, zonele de selecție și etichetele conexiunilor vizibile.
         */
        function drawEdges(fast = false) {
          syncEdgeStyle();
          portsLayer.classList.toggle(
            'active',
            connectMode ||
              drag?.kind === 'port' ||
              drag?.kind === 'edge-end' ||
              nodes.some(hasCardinalPorts),
          );
          svg.replaceChildren();
          edgeHandles.replaceChildren();
          for (const [id, layer] of innerEdgeLayers) {
            if (!el(id)) {
              layer.remove();
              innerEdgeLayers.delete(id);
            } else {
              layer.replaceChildren();
              layer.style.display = 'none';
            }
          }
          updatePortPositions();
          const paths = collectEdgePaths(fast);
          for (const { e, points, bridges, fromPort, toPort, heldEnd } of paths) {
            const container = edgeContainer(el(e.from), el(e.to));
            const targetSvg = container ? innerEdgeLayer(container) : svg;
            const source = heldEnd === 'from' ? null : el(e.from),
              target = heldEnd === 'to' ? null : el(e.to);
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute(
              'd',
              routeSvg(paintedLinkPoints(points, source, target, fromPort, toPort), bridges),
            );
            path.setAttribute(
              'class',
              'edge' + (e.preview ? ' preview' : '') + (selected === e.id ? ' selected' : ''),
            );
            path.dataset.id = e.id;
            if (!e.preview) {
              path.style.stroke = e.color || '#52617a';
              const style = e.lineStyle || (e.dashed ? 'dashed' : 'solid');
              if (style === 'dashed') path.style.strokeDasharray = '8 6';
              if (style === 'dotted') path.style.strokeDasharray = '2 6';
            }
            targetSvg.append(path);
            if (e.preview) continue;
            // Suprafața invizibilă permite selectarea liniilor subțiri fără a le îngroșa vizual.
            const hit = path.cloneNode(false);
            hit.setAttribute('class', 'edge-hit');
            Object.assign(hit.style, {
              fill: 'none',
              stroke: 'transparent',
              strokeDasharray: 'none',
              strokeWidth: '18px',
              pointerEvents: 'stroke',
              cursor: 'grab',
            });
            hit.addEventListener('pointerdown', (ev) => {
              if (!connectMode && !multiMode && !ev.shiftKey && !ev.ctrlKey && !ev.metaKey)
                beginPan(ev, { edgeId: e.id });
            });
            hit.addEventListener('click', (ev) => {
              ev.stopPropagation();
              selectEdge(e.id);
            });
            hit.addEventListener('dblclick', (ev) => {
              ev.preventDefault();
              ev.stopPropagation();
              addEdgePoint(e.id, pointerWorld(ev));
            });
            targetSvg.append(hit);
            for (const d of edgeArrowPaths(e, points)) {
              const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
              arrow.setAttribute('d', d);
              arrow.setAttribute('class', 'edge-arrow');
              arrow.setAttribute('fill', e.color || '#52617a');
              targetSvg.append(arrow);
            }
            if (e.label) {
              const text = document.createElementNS('http://www.w3.org/2000/svg', 'text'),
                anchor = edgeLabelPoint(e, points);
              text.setAttribute('x', anchor.x);
              text.setAttribute('y', anchor.y);
              text.setAttribute('class', 'edge-label' + (selected === e.id ? ' selected' : ''));
              text.dataset.edge = e.id;
              text.setAttribute('text-anchor', 'middle');
              text.style.fill = e.labelColor || '#29354d';
              text.textContent = e.label;
              text.addEventListener('pointerdown', (ev) => beginEdgeLabel(ev, e, points));
              text.addEventListener('dblclick', (ev) => {
                ev.preventDefault();
                ev.stopPropagation();
                selected = e.id;
                selectedNodes.clear();
                runAction('editSelectedText');
              });
              targetSvg.append(text);
            }
          }
          const active = paths.find((item) => item.e.id === selected);
          if (active && active.points.length > 1) drawEdgeHandles(active.e, active.points);
          drawPortPreview();
          renderedSelectedEdge = selected;
          renderTextMoveHandles();
        }

        /**
         * Șterge conexiunea indicată și actualizează istoricul și randarea.
         */
        function removeEdge(id) {
          edges = edges.filter((e) => e.id !== id);
          selected = null;
          selectedNodes.clear();
          remember();
          render();
          toast('Legătură ștearsă');
        }
        // --- Interacțiuni cu pointerul ----------------------------------------------------
        // Mutarea, redimensionarea și selecția dreptunghiulară modifică modelul; eliberarea înregistrează
        // o singură stare pentru anulare. Celelalte obiecte rămân supuse virtualizării vederii.

        // ============================================================================
        // 10. Editarea nodurilor și gesturile de mutare
        // ============================================================================

        /**
         * Activează editarea textului unui nod și tratează confirmarea sau anularea etichetei.
         */
        function editNode(d, n) {
          if (
            n.sync?.settings.mode === 'numbered' &&
            n.sync.settings.properties.includes('label')
          ) {
            toast('Modifică prefixul și sufixul în panoul Noduri sincronizate.');
            return;
          }
          const s = d.querySelector('.label');
          s.textContent = n.label || '';
          d.classList.add('editing');
          renderTextMoveHandles();
          s.contentEditable = 'plaintext-only';
          s.focus();
          const r = document.createRange();
          r.selectNodeContents(s);
          r.collapse(false);
          getSelection().removeAllRanges();
          getSelection().addRange(r);
          /**
           * Încheie editarea nodului, normalizează textul și salvează modificarea confirmată.
           */
          function done() {
            s.contentEditable = 'false';
            d.classList.remove('editing');
            n.label = s.innerText.trim().slice(0, 10000);
            remember();
            render();
          }
          s.addEventListener('blur', done, { once: true });
          s.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              s.blur();
            }
            if (e.key === 'Escape') {
              s.textContent = n.label;
              s.blur();
            }
          });
        }

        /**
         * Reține punctele intermediare ale conexiunilor interne înaintea mutării unei selecții.
         */
        function captureInternalWaypoints(ids) {
          const moved = new Set(ids);
          return new Map(
            edges
              .filter((e) => edgeWaypoints(e).length && moved.has(e.from) && moved.has(e.to))
              .map((e) => [e.id, edgeWaypoints(e).map((p) => ({ ...p }))]),
          );
        }

        /**
         * Deplasează punctele intermediare interne împreună cu nodurile mutate.
         */
        function moveInternalWaypoints(state, dx, dy) {
          for (const e of edges) {
            const start = state.waypointStarts?.get(e.id);
            if (start) {
              e.waypoints = start.map((p) => ({ x: p.x + dx, y: p.y + dy }));
              delete e.waypoint;
            }
          }
        }

        /** Pornește deplasarea vederii; intenția de selectare se aplică numai dacă gestul rămâne un clic. */
        function beginPan(event, intent = null) {
          if (event.pointerType === 'mouse' && event.button !== 0 && event.button !== 1) return;
          event.preventDefault();
          event.stopPropagation();
          event.target.setPointerCapture?.(event.pointerId);
          drag = {
            kind: 'pan',
            x: event.clientX - pan.x,
            y: event.clientY - pan.y,
            startClientX: event.clientX,
            startClientY: event.clientY,
            moved: false,
            intent,
          };
        }

        /** Aplică pragul de mișcare și mută numai vederea, cu selecția și geometria păstrate. */
        function movePan(event) {
          if (
            !drag.moved &&
            Math.hypot(event.clientX - drag.startClientX, event.clientY - drag.startClientY) < 3
          )
            return;
          if (!drag.moved) canvas.setPointerCapture(event.pointerId);
          drag.moved = true;
          document.body.classList.add('panning');
          pan = { x: event.clientX - drag.x, y: event.clientY - drag.y };
          applyView();
        }

        /** Încheie pan-ul fără selectare accidentală; un clic simplu selectează ținta sau golește selecția pe fundal. */
        function finishPan() {
          const ended = drag;
          drag = null;
          document.body.classList.remove('panning');
          suppressNodeSelectionClick = true;
          if (ended.moved || !ended.intent) return;
          if (ended.intent.edgeId) {
            selectEdge(ended.intent.edgeId);
            return;
          }
          if (ended.intent.nodeId && el(ended.intent.nodeId)) {
            selected = null;
            selectedEdgePoint = null;
            selectedEdgeEnd = null;
            selectedNodes = new Set([ended.intent.nodeId]);
            refreshNodeSelection();
            if (overviewActive) paintOverviewSoon();
            return;
          }
          if (ended.intent.background) {
            selected = null;
            selectedEdgePoint = null;
            selectedEdgeEnd = null;
            selectedNodes.clear();
            refreshNodeSelection();
            if (overviewActive) paintOverviewSoon();
          }
        }

        /** Inițiază mutarea numai pentru un nod deja selectat; peste celelalte noduri pornește pan-ul cu selectare amânată. */
        function nodeDown(ev, n) {
          if ((ev.pointerType === 'mouse' && ev.button !== 0) || connectMode) return;
          ev.stopPropagation();
          if (ev.target.isContentEditable || ev.shiftKey || ev.ctrlKey || ev.metaKey || multiMode)
            return;
          if (ev.pointerType !== 'mouse') ev.preventDefault();
          if (!selectedNodes.has(n.id)) {
            beginPan(ev, { nodeId: n.id });
            return;
          }
          selected = null;
          refreshNodeSelection();
          const point = local(ev);
          if (selectedNodes.size > 1) {
            const roots = selectedRoots();
            const affected = nodes
              .filter((item) => roots.some((id) => item.id === id || isDescendant(item.id, id)))
              .map((item) => item.id);
            const starts = new Map(
              affected.map((id) => {
                const item = el(id);
                return [id, { x: item.x, y: item.y }];
              }),
            );
            drag = {
              kind: 'group',
              roots,
              affected,
              starts,
              waypointStarts: captureInternalWaypoints(affected),
              startClientX: ev.clientX,
              startClientY: ev.clientY,
              moved: false,
            };
            raiseDraggedNodes(affected);
            ev.currentTarget.setPointerCapture(ev.pointerId);
            return;
          }
          const affected = nodes
            .filter((item) => item.id === n.id || isDescendant(item.id, n.id))
            .map((item) => item.id);
          const starts = new Map(
            affected.map((id) => {
              const item = el(id);
              return [id, { x: item.x, y: item.y, parent: item.parent }];
            }),
          );
          const containerIds = new Set(
            nodes
              .filter((item) => item.id !== n.id && !isDescendant(item.id, n.id))
              .map((item) => item.id),
          );
          drag = {
            kind: 'node',
            id: n.id,
            affected,
            starts,
            waypointStarts: captureInternalWaypoints(affected),
            dx: (point.x - pan.x) / scale - n.x,
            dy: (point.y - pan.y) / scale - n.y,
            start: { x: n.x, y: n.y },
            originalParent: n.parent,
            previewParent: n.parent,
            containerIds,
            geometrySnapshot: captureContainerGeometry(),
            previewParents: new Set(),
            moved: false,
          };
          raiseDraggedNodes(affected);
          ev.currentTarget.setPointerCapture(ev.pointerId);
        }

        /**
         * Începe mutarea poziției unui port pe latura nodului și memorează starea pentru anulare.
         */
        function beginPortPosition(ev, n, name) {
          drag = {
            kind: 'port-position',
            id: n.id,
            port: name,
            previous: n.portPositions?.[name],
            previousSlot: n.portSlots?.[name],
            startValue: currentPortPositionValue(n, name),
            startClientX: ev.clientX,
            startClientY: ev.clientY,
            changed: false,
          };
          canvas.setPointerCapture(ev.pointerId);
        }

        /**
         * Deplasează portul pe latura permisă și aplică grila sau ghidajele active.
         */
        function movePortPosition(ev) {
          const n = el(drag.id);
          if (!n) return;
          const screen = local(ev),
            point = { x: (screen.x - pan.x) / scale, y: (screen.y - pan.y) / scale },
            localPoint = nodeWorldToLocal(n, point),
            length = portLength(n, drag.port),
            axis = 'NS'.includes(drag.port[0]) ? 'x' : 'y';
          let offset = localPoint[axis];
          if (gridNode(n) || gridSettings.snap) offset = snapGrid(offset);
          const value = Math.max(0, Math.min(1, offset / length));
          setPortPosition(n, drag.port, value);
          drag.changed = Math.abs(currentPortPositionValue(n, drag.port) - drag.startValue) > 0.001;
          updatePortPositions();
          routeCache.clear();
          drawEdges(true);
        }

        /**
         * Restaurează pozițiile porturilor dacă gestul curent este anulat.
         */
        function restorePortDrag(state) {
          const n = el(state.id);
          if (!n) return;
          if (gridNode(n)) {
            if (state.previousSlot === undefined) delete n.portSlots?.[state.port];
            else n.portSlots = { ...(n.portSlots || {}), [state.port]: state.previousSlot };
          } else if (state.previous === undefined) delete n.portPositions?.[state.port];
          else n.portPositions = { ...(n.portPositions || {}), [state.port]: state.previous };
        }

        /**
         * Finalizează mutarea porturilor, actualizează istoricul și închide starea de tragere.
         */
        function finishPortPosition(ev) {
          movePortPosition(ev);
          const ended = drag;
          drag = null;
          if (!ended.changed) restorePortDrag(ended);
          else {
            routeCache.clear();
            edgeIndexVersion = -1;
            remember();
          }
          render();
        }

        /**
         * Activează sau dezactivează modul de mutare a porturilor și sincronizează comenzile vizibile.
         */
        function setPortPositionMode(active) {
          const node = selectedNodes.size === 1 ? el([...selectedNodes][0]) : null;
          portPositionMode = !!active && !!node && hasCardinalPorts(node);
          selectedPorts.clear();
          selectedPortNodeId = portPositionMode ? node.id : null;
          labelPositionMode = false;
          $('#portPositionMode').classList.toggle('active', portPositionMode);
          $('#labelMoveMode').classList.remove('active');
          document.body.classList.toggle('port-position-mode', portPositionMode);
          document.body.classList.toggle('label-position-mode', false);
          if (portPositionMode) toast('Selectează porturi; Shift-clic pe nod pentru aliniere');
          else toast('Repoziționarea porturilor oprită');
          render();
        }
        defineAction('setPortPositionMode', setPortPositionMode);
        $('#portPositionMode').addEventListener('click', () =>
          runAction('setPortPositionMode', !portPositionMode),
        );

        /**
         * Activează sau dezactivează modul de poziționare a etichetei în interiorul nodului.
         */
        function setLabelPositionMode(active) {
          const node = selectedNodes.size === 1 ? el([...selectedNodes][0]) : null;
          labelPositionMode = !!active && !!node;
          portPositionMode = false;
          $('#labelMoveMode').classList.toggle('active', labelPositionMode);
          $('#portPositionMode').classList.remove('active');
          document.body.classList.toggle('port-position-mode', false);
          document.body.classList.toggle('label-position-mode', labelPositionMode);
          if (labelPositionMode) toast('Trage eticheta în poziția dorită');
          else toast('Repoziționarea etichetei oprită');
          render();
        }
        defineAction('setLabelPositionMode', setLabelPositionMode);
        $('#labelMoveMode').addEventListener('click', () =>
          runAction('setLabelPositionMode', !labelPositionMode),
        );

        /**
         * Inițiază tragerea etichetei unui nod, păstrând poziția inițială.
         */
        function beginLabelMove(ev, n, fromHandle = false) {
          if (
            (ev.pointerType === 'mouse' && ev.button !== 0) ||
            (!labelPositionMode && !fromHandle) ||
            !selectedNodes.has(n.id)
          )
            return;
          ev.preventDefault();
          ev.stopPropagation();
          const label = world.querySelector(`[data-id="${n.id}"] .label`),
            canvasRect = canvas.getBoundingClientRect(),
            labelRect = label?.getBoundingClientRect(),
            screen = local(ev),
            point = nodeWorldToLocal(n, {
              x: (screen.x - pan.x) / scale,
              y: (screen.y - pan.y) / scale,
            }),
            labelCenter = labelRect
              ? nodeWorldToLocal(n, {
                  x: (labelRect.left + labelRect.width / 2 - canvasRect.left - pan.x) / scale,
                  y: (labelRect.top + labelRect.height / 2 - canvasRect.top - pan.y) / scale,
                })
              : n.labelPos
                ? { x: n.labelPos.x * dimensions(n).w, y: n.labelPos.y * dimensions(n).h }
                : { x: dimensions(n).w / 2, y: dimensions(n).h / 2 };
          drag = {
            kind: 'label-position',
            id: n.id,
            previous: n.labelPos ? { ...n.labelPos } : null,
            startClientX: ev.clientX,
            startClientY: ev.clientY,
            offset: { x: labelCenter.x - point.x, y: labelCenter.y - point.y },
            changed: false,
            size: { ...dimensions(n) },
            originalW: n.manualW,
            originalH: n.manualH,
          };
          ev.target.setPointerCapture?.(ev.pointerId);
          renderTextMoveHandles();
        }

        /**
         * Convertește deplasarea pointerului în poziția relativă a etichetei, inclusiv pentru noduri rotite.
         */
        function moveLabelPosition(ev) {
          const n = el(drag.id);
          if (!n) return;
          if (
            !drag.changed &&
            Math.hypot(ev.clientX - drag.startClientX, ev.clientY - drag.startClientY) < 3
          )
            return;
          if (!drag.changed) {
            canvas.setPointerCapture(ev.pointerId);
            n.manualW = drag.size.w;
            n.manualH = drag.size.h;
          }
          drag.changed = true;
          const screen = local(ev),
            point = { x: (screen.x - pan.x) / scale, y: (screen.y - pan.y) / scale },
            localPoint = nodeWorldToLocal(n, point),
            size = dimensions(n),
            label = world.querySelector(`[data-id="${n.id}"] .label`),
            halfW = label ? label.offsetWidth / 2 : 0,
            halfH = label ? label.offsetHeight / 2 : 0,
            limitX = (halfW + TEXT_MOVE_GAP) / size.w,
            limitY = (halfH + TEXT_MOVE_GAP) / size.h,
            labelPos = {
              x: Math.max(-limitX, Math.min(1 + limitX, (localPoint.x + drag.offset.x) / size.w)),
              y: Math.max(-limitY, Math.min(1 + limitY, (localPoint.y + drag.offset.y) / size.h)),
            };
          n.labelPos = labelPos;
          const d = world.querySelector(`[data-id="${n.id}"]`);
          if (label && d) {
            d.classList.add('label-positioned');
            label.style.setProperty('--label-x', `${labelPos.x * 100}%`);
            label.style.setProperty('--label-y', `${labelPos.y * 100}%`);
          }
          renderTextMoveHandles();
        }

        /**
         * Încheie mutarea etichetei și salvează noua poziție.
         */
        function finishLabelPosition(ev) {
          moveLabelPosition(ev);
          const { id, previous, changed } = drag,
            n = el(id);
          drag = null;
          if (n && !changed) {
            if (previous) n.labelPos = previous;
            else delete n.labelPos;
          }
          if (changed) remember();
          if (changed) render();
          else renderTextMoveHandles();
        }

        /**
         * Rotește nodurile selectate cu incrementul cerut și actualizează geometria și conexiunile.
         */
        function rotateSelectedNode(step = 15) {
          const n = selectedNodes.size === 1 ? el([...selectedNodes][0]) : null,
            delta = Number(step);
          if (!n || ![-15, 15].includes(delta)) return;
          n.rotation =
            (((Math.round((Number(n.rotation) || 0) / 15) * 15 + delta) % 360) + 360) % 360;
          viewIndexVersion = -1;
          edgeIndexVersion = -1;
          routeCache.clear();
          remember();
          render();
        }

        /**
         * Readuce rotația și proporțiile nodurilor selectate la starea implicită permisă.
         */
        function resetSelectedNodePose() {
          const n = selectedNodes.size === 1 ? el([...selectedNodes][0]) : null;
          if (!n) return;
          delete n.rotation;
          delete n.labelPos;
          delete n.portPositions;
          delete n.portSlots;
          portPositionMode = false;
          labelPositionMode = false;
          document.body.classList.remove('port-position-mode', 'label-position-mode');
          $('#portPositionMode').classList.remove('active');
          $('#labelMoveMode').classList.remove('active');
          viewIndexVersion = -1;
          edgeIndexVersion = -1;
          routeCache.clear();
          remember();
          render();
          toast('Poziția etichetei și porturilor a fost resetată');
        }

        /**
         * Elimină poziționarea manuală a etichetelor pentru a reveni la plasarea implicită.
         */
        function resetSelectedLabelPosition() {
          const n = selectedNodes.size === 1 ? el([...selectedNodes][0]) : null;
          if (!n || !n.labelPos) return;
          delete n.labelPos;
          labelPositionMode = false;
          document.body.classList.remove('label-position-mode');
          $('#labelMoveMode').classList.remove('active');
          remember();
          render();
          toast('Poziția etichetei a fost resetată');
        }
        defineAction('rotateSelectedNode', rotateSelectedNode);
        defineAction('resetSelectedNodePose', resetSelectedNodePose);
        defineAction('resetSelectedLabelPosition', resetSelectedLabelPosition);
        $('#rotateNodeBack').addEventListener('click', () => runAction('rotateSelectedNode', -15));
        $('#rotateNode').addEventListener('click', () => runAction('rotateSelectedNode', 15));
        $('#resetNodePose').addEventListener('click', () => runAction('resetSelectedNodePose'));
        $('#resetLabelPosition').addEventListener('click', () =>
          runAction('resetSelectedLabelPosition'),
        );

        // Mânerele de redimensionare au dimensiuni în pixeli de ecran și rămân deasupra porturilor.
        const resizeHandles = document.createElement('div');
        resizeHandles.className = 'resize-handles';
        resizeHandles.id = 'resizeHandles';
        canvas.appendChild(resizeHandles);

        /**
         * Alege cursorul de redimensionare corespunzător mânerului și rotației nodului.
         */
        function resizeCursor(corner, rotation = 0) {
          const angle =
            { e: 0, se: 45, s: 90, sw: 135, w: 180, nw: 225, n: 270, ne: 315 }[corner] +
            (Number(rotation) || 0);
          return ['ew-resize', 'nwse-resize', 'ns-resize', 'nesw-resize'][
            ((Math.round(angle / 45) % 4) + 4) % 4
          ];
        }

        /**
         * Desenează mânerele selecției în coordonate de ecran, cu mărime constantă indiferent de zoom.
         */
        function renderResizeHandles() {
          renderTextMoveHandles();
          world.style.setProperty('--selection-ring-width', 2 / scale + 'px');
          world.style.setProperty('--selection-ring-offset', 2 / scale + 'px');
          resizeHandles.replaceChildren();
          if (
            selectedNodes.size !== 1 ||
            connectMode ||
            portPositionMode ||
            labelPositionMode ||
            multiMode
          )
            return;
          const n = el([...selectedNodes][0]);
          if (!n) return;
          const size = dimensions(n),
            center = nodeCenter(n),
            gap = 0;
          const portPoints = [...portsLayer.querySelectorAll('.port')]
            .filter((dot) => dot.dataset.node === n.id)
            .map((dot) => portPointForNode(n, dot.dataset.port));
          for (const corner of ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w']) {
            const vx = corner.includes('w') ? -1 : corner.includes('e') ? 1 : 0,
              vy = corner.includes('n') ? -1 : corner.includes('s') ? 1 : 0;
            let p = rotatePoint(
              { x: center.x + vx * (size.w / 2 + gap), y: center.y + vy * (size.h / 2 + gap) },
              center,
              n.rotation,
            );
            // Evită suprapunerea mânerelor de redimensionare cu porturile de conexiune.
            if (corner.length === 1) {
              const alongX = vy !== 0,
                half = (alongX ? size.w : size.h) / 2,
                limit = Math.max(0, half - 20 / scale);
              let free = false;
              for (let step = 0; step <= Math.ceil((limit * scale) / 24); step++) {
                for (const sign of step ? [1, -1] : [1]) {
                  const offset = Math.min(limit, (step * 24) / scale) * sign;
                  const candidate = rotatePoint(
                    {
                      x: center.x + (vx * size.w) / 2 + (alongX ? offset : 0),
                      y: center.y + (vy * size.h) / 2 + (alongX ? 0 : offset),
                    },
                    center,
                    n.rotation,
                  );
                  if (
                    portPoints.every(
                      (port) => Math.hypot(candidate.x - port.x, candidate.y - port.y) * scale > 16,
                    )
                  ) {
                    p = candidate;
                    free = true;
                    break;
                  }
                }
                if (free) break;
              }
              if (!free) continue;
            }
            const handle = document.createElement('span');
            handle.className = 'node-resize-handle';
            handle.dataset.node = n.id;
            handle.dataset.corner = corner;
            handle.style.left = pan.x + p.x * scale + 'px';
            handle.style.top = pan.y + p.y * scale + 'px';
            handle.style.cursor = resizeCursor(corner, n.rotation);
            handle.style.transform =
              'translate(-50%,-50%) rotate(' + (Number(n.rotation) || 0) + 'deg)';
            handle.title = 'Redimensionează nodul';
            handle.setAttribute(
              'aria-label',
              'Redimensionează ' + (n.label || 'nod') + ' (' + corner + ')',
            );
            handle.addEventListener('pointerdown', (ev) => resizeDown(ev, n, corner));
            handle.addEventListener('click', (ev) => ev.stopPropagation());
            resizeHandles.appendChild(handle);
          }
        }

        /**
         * Identifică nodul aflat sub pointer după ordinea vizuală DOM sau după geometria vederii de ansamblu.
         */
        function overviewNodeAt(event) {
          // În modul DOM se respectă ordinea reală de desenare, inclusiv nodurile ridicate temporar.
          if (!overviewActive) {
            for (const element of document.elementsFromPoint(event.clientX, event.clientY)) {
              const rendered = element.closest?.('.node');
              if (rendered && world.contains(rendered)) {
                const node = el(rendered.dataset.id);
                if (node) return node;
              }
            }
            return null;
          }
          const point = local(event),
            worldPoint = { x: (point.x - pan.x) / scale, y: (point.y - pan.y) / scale },
            ranks = nodePaintRanks();
          return nodes
            .slice()
            .sort((a, b) => (ranks.get(b.id) || 0) - (ranks.get(a.id) || 0))
            .find((n) => {
              const p = nodeWorldToLocal(n, worldPoint),
                s = dimensions(n);
              return p.x >= 0 && p.y >= 0 && p.x <= s.w && p.y <= s.h;
            });
        }
        // Clicurile cu taste modificatoare selectează nodul de sub porturi sau linii înaintea controalelor acestora.
        let suppressNodeSelectionClick = false;
        canvas.addEventListener(
          'pointerdown',
          (event) => {
            suppressNodeSelectionClick = false;
            if (
              event.button !== 0 ||
              drag ||
              connectMode ||
              portPositionMode ||
              event.target.isContentEditable ||
              !(event.shiftKey || event.ctrlKey || event.metaKey || multiMode)
            )
              return;
            const owner = event.target.closest?.('.node-resize-handle,.port')?.dataset.node;
            const node = owner ? el(owner) : overviewNodeAt(event);
            if (!node) return;
            event.preventDefault();
            event.stopImmediatePropagation();
            suppressNodeSelectionClick = true;
            selectedNodes.has(node.id) ? selectedNodes.delete(node.id) : selectedNodes.add(node.id);
            selected = null;
            refreshNodeSelection();
            if (multiMode) setMultiMode(false);
            if (overviewActive) paintOverviewSoon();
          },
          true,
        );
        canvas.addEventListener(
          'click',
          (event) => {
            if (suppressNodeSelectionClick) {
              suppressNodeSelectionClick = false;
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true,
        );
        canvas.addEventListener(
          'pointercancel',
          () => {
            suppressNodeSelectionClick = false;
          },
          true,
        );
        canvas.addEventListener(
          'pointerdown',
          (event) => {
            if (
              !overviewActive ||
              drag ||
              event.button !== 0 ||
              event.target.closest?.('.node-resize-handle') ||
              connectMode ||
              portPositionMode ||
              multiMode
            )
              return;
            const n = overviewNodeAt(event);
            if (!n) return;
            event.stopImmediatePropagation();
            if (event.shiftKey || event.ctrlKey || event.metaKey) {
              selectedNodes.has(n.id) ? selectedNodes.delete(n.id) : selectedNodes.add(n.id);
              selected = null;
              refreshNodeSelection();
              paintOverviewSoon();
              return;
            }
            nodeDown(event, n);
            paintOverviewSoon();
          },
          true,
        );

        /**
         * Inițiază redimensionarea unui nod și memorează poziția, dimensiunile și mânerul folosit.
         */
        function resizeDown(ev, n, corner) {
          if (ev.pointerType === 'mouse' && ev.button !== 0) return;
          ev.preventDefault();
          ev.stopPropagation();
          const size = dimensions(n);
          selected = null;
          selectedNodes = new Set([n.id]);
          refreshNodeSelection();
          drag = {
            kind: 'resize',
            id: n.id,
            corner,
            startX: n.x,
            startY: n.y,
            startW: size.w,
            startH: size.h,
            startClientX: ev.clientX,
            startClientY: ev.clientY,
          };
          canvas.style.cursor = resizeCursor(corner, n.rotation);
          canvas.setPointerCapture(ev.pointerId);
        }

        // ============================================================================
        // 11. Grilă discretă și conversia formatelor ELS
        // ============================================================================

        /**
         * Rotunjește o coordonată la cel mai apropiat multiplu al pasului de grilă.
         */
        function snapGrid(value) {
          return Math.round(value / gridSettings.step) * gridSettings.step;
        }

        /**
         * Rotunjește o dimensiune în sus la un număr par de celule, pentru a păstra centrele pe grilă.
         */
        function gridExtent(value) {
          return Math.ceil(value / (2 * gridSettings.step)) * 2 * gridSettings.step;
        }

        /**
         * Rotunjește o coordonată în jos la un multiplu al pasului de grilă.
         */
        function gridFloor(value) {
          return Math.floor(value / gridSettings.step) * gridSettings.step;
        }

        /**
         * Rotunjește o coordonată în sus la un multiplu al pasului de grilă.
         */
        function gridCeil(value) {
          return Math.ceil(value / gridSettings.step) * gridSettings.step;
        }

        /**
         * Verifică dacă nodul participă la geometria discretă și are o rotație compatibilă cu axele grilei.
         */
        function gridNode(n) {
          return !!n?.grid && !(Number(n.rotation) % 90);
        }

        /**
         * Returnează lungimea laturii pe care este amplasat portul.
         */
        function portLength(n, name, size = dimensions(n)) {
          return 'NS'.includes(name[0]) ? size.w : size.h;
        }

        /**
         * Calculează dimensiunea minimă discretă necesară porturilor și sloturilor existente pe laturile indicate.
         */
        function gridPortMinimum(n, sides) {
          let need = 0;
          for (const side of sides) {
            need = Math.max(need, cardinalPortCount(n, side) * 2 * gridSettings.step);
            for (const [name, slot] of Object.entries(n.portSlots || {}))
              if (name[0] === side && hasPort(n, name) && Number.isFinite(slot))
                need = Math.max(need, slot * gridSettings.step);
          }
          return gridExtent(need);
        }

        /**
         * Inițializează sau migrează pozițiile porturilor în sloturi întregi și le limitează la dimensiunea laturii.
         */
        function ensurePortSlots(n, size) {
          if (!gridNode(n)) return;
          n.portSlots = { ...(n.portSlots || {}) };
          for (const side of cardinalSides) {
            const count = cardinalPortCount(n, side),
              length = 'NS'.includes(side) ? size.w : size.h;
            for (let i = 0; i < count; i++) {
              const name = side + (i + 1);
              if (!Number.isFinite(n.portSlots[name])) {
                const legacy = n.portPositions?.[name];
                n.portSlots[name] = Math.round(
                  Number.isFinite(legacy)
                    ? (legacy * length) / gridSettings.step
                    : length / (2 * gridSettings.step) + 2 * i - (count - 1),
                );
              }
              n.portSlots[name] = Math.max(
                0,
                Math.min(length / gridSettings.step, Math.round(n.portSlots[name])),
              );
            }
          }
          delete n.portPositions;
        }

        /**
         * Salvează poziția portului ca slot discret pentru nodurile pe grilă sau ca proporție pentru celelalte noduri.
         */
        function setPortPosition(n, name, value) {
          const length = portLength(n, name);
          if (gridNode(n)) {
            n.portSlots = {
              ...(n.portSlots || {}),
              [name]: Math.max(
                0,
                Math.min(
                  length / gridSettings.step,
                  Math.round((value * length) / gridSettings.step),
                ),
              ),
            };
            delete n.portPositions?.[name];
          } else n.portPositions = { ...(n.portPositions || {}), [name]: value };
        }

        /**
         * Aduce nodurile și punctele conexiunilor asociate la coordonate compatibile cu grila curentă.
         */
        function normalizeGridGeometry() {
          for (const e of edges)
            if (e.waypoints)
              e.waypoints = e.waypoints.map((p) => ({ x: snapGrid(p.x), y: snapGrid(p.y) }));
          for (const n of nodes)
            if (gridNode(n)) {
              n.x = snapGrid(n.x);
              n.y = snapGrid(n.y);
              if (n.manualW) n.manualW = gridExtent(n.manualW);
              if (n.manualH) n.manualH = gridExtent(n.manualH);
            }
          for (const e of edges)
            if (gridNode(el(e.from)) || gridNode(el(e.to)))
              for (const key of ['waypoint', 'fromPoint', 'toPoint'])
                if (e[key]) e[key] = { ...e[key], x: snapGrid(e[key].x), y: snapGrid(e[key].y) };
        }

        /**
         * Construiește metadatele de versiune și pas ale grilei pentru fișierele ELS.
         */
        function gridMetadata() {
          return { version: 1, cell: gridSettings.step };
        }

        /**
         * Copiază datele primite, convertește coordonatele în celule în coordonate de planșă și validează rezultatul înainte de folosire.
         */
        function decodeCellDiagram(data) {
          const copy = structuredClone(data),
            cell = copy.geometry ? Number(copy.geometry.cell) : gridSettings.step;
          if (
            copy.geometry &&
            (copy.geometry.version !== 1 ||
              !Number.isFinite(cell) ||
              cell < 10 ||
              cell > 80 ||
              cell % 2)
          )
            throw Error('Pas de grilă invalid');
          if (copy.geometry) copy.geometry.cell = cell;
          if (
            !Array.isArray(copy.nodes) ||
            !Array.isArray(copy.edges) ||
            copy.nodes.length > IMPORT_LIMITS.nodes ||
            copy.edges.length > IMPORT_LIMITS.edges
          )
            throw Error('Diagramă invalidă sau prea mare');
          for (const n of copy.nodes) {
            if (!n || typeof n !== 'object') throw Error('Nod invalid');
            if (n.position || n.size) {
              const p = n.position,
                z = n.size;
              if (
                !p ||
                !z ||
                ![p.column, p.row, z.columns, z.rows].every(Number.isFinite) ||
                z.columns <= 0 ||
                z.rows <= 0
              )
                throw Error('Coordonate în celule invalide');
              n.x = Math.round(p.column) * cell;
              n.y = Math.round(p.row) * cell;
              n.manualW = Math.ceil(z.columns / 2) * 2 * cell;
              n.manualH = Math.ceil(z.rows / 2) * 2 * cell;
              n.grid = true;
              delete n.position;
              delete n.size;
              if (Array.isArray(n.ports)) {
                const list = n.ports;
                n.ports = {};
                n.portSlots = {};
                for (const port of list) {
                  const match = /^([NESW])([1-9]\d*)$/.exec(port.id);
                  if (
                    !match ||
                    port.side !== match[1] ||
                    !Number.isInteger(port.slot) ||
                    port.slot < 0
                  )
                    throw Error('Port invalid');
                  n.ports[port.side] = Math.max(n.ports[port.side] || 0, Number(match[2]));
                  n.portSlots[port.id] = port.slot;
                }
              }
            }
            if (
              !Number.isFinite(n.x) ||
              !Number.isFinite(n.y) ||
              Math.abs(n.x) >= MAX_WORLD_COORD ||
              Math.abs(n.y) >= MAX_WORLD_COORD
            )
              throw Error('Coordonate invalide');
          }
          return validateDiagramData(copy);
        }

        /**
         * Construiește forma JSON alternativă în celule pentru automatizări; nu modifică geometria afișată.
         */
        function cellDiagramData() {
          calculateNodeSizes(true);
          return {
            format: 'els',
            version: 1,
            geometry: gridMetadata(),
            nodes: nodes.map((n) => {
              if (!gridNode(n) || n.x !== snapGrid(n.x) || n.y !== snapGrid(n.y)) return { ...n };
              const size = dimensions(n),
                copy = {
                  ...n,
                  position: { column: n.x / gridSettings.step, row: n.y / gridSettings.step },
                  size: { columns: size.w / gridSettings.step, rows: size.h / gridSettings.step },
                  ports: cardinalPortNames(n).map((id) => ({
                    id,
                    side: id[0],
                    slot: n.portSlots[id],
                  })),
                };
              for (const key of ['x', 'y', 'manualW', 'manualH', 'portSlots', 'portPositions'])
                delete copy[key];
              return copy;
            }),
            edges: structuredClone(edges),
          };
        }

        /**
         * Transformă coordonatele pointerului din fereastră în coordonate relative la suprafața planșei.
         */
        function local(e) {
          const r = canvas.getBoundingClientRect();
          return { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        /**
         * Actualizează dreptunghiul de selecție și include nodurile complet încadrate de acesta.
         */
        function moveMarquee(e) {
          const point = local(e),
            start = drag.start;
          if (!drag.moved && Math.hypot(point.x - start.x, point.y - start.y) < 4) return;
          drag.moved = true;
          const left = Math.min(start.x, point.x),
            top = Math.min(start.y, point.y),
            right = Math.max(start.x, point.x),
            bottom = Math.max(start.y, point.y);
          marquee.style.display = 'block';
          marquee.style.left = left + 'px';
          marquee.style.top = top + 'px';
          marquee.style.width = right - left + 'px';
          marquee.style.height = bottom - top + 'px';
          const worldBox = {
            x: (left - pan.x) / scale,
            y: (top - pan.y) / scale,
            right: (right - pan.x) / scale,
            bottom: (bottom - pan.y) / scale,
          };
          const chosen = new Set(drag.base);
          for (const node of visibleNodes(worldBox)) {
            const rect = nodeVisualRect(node);
            if (
              rect.x >= worldBox.x &&
              rect.y >= worldBox.y &&
              rect.right <= worldBox.right &&
              rect.bottom <= worldBox.bottom
            )
              chosen.add(node.id);
          }
          selectedNodes = chosen;
          selected = null;
          refreshNodeSelection();
        }

        /**
         * Redimensionează nodul în axele sale locale, respectând minimele, porturile, descendenții și snappingul.
         */
        function resizeMove(e) {
          const n = el(drag.id),
            screenDx = (e.clientX - drag.startClientX) / scale,
            screenDy = (e.clientY - drag.startClientY) / scale,
            radians = (-(Number(n.rotation) || 0) * Math.PI) / 180,
            dx = screenDx * Math.cos(radians) - screenDy * Math.sin(radians),
            dy = screenDx * Math.sin(radians) + screenDy * Math.cos(radians),
            west = drag.corner.includes('w'),
            east = drag.corner.includes('e'),
            north = drag.corner.includes('n'),
            south = drag.corner.includes('s');
          const lattice = gridNode(n) && gridSettings.snap,
            quantize = lattice
              ? (v) => Math.round(v / (2 * gridSettings.step)) * 2 * gridSettings.step
              : Math.round;
          let w = quantize(drag.startW + (west ? -dx : east ? dx : 0)),
            h = quantize(drag.startH + (north ? -dy : south ? dy : 0));
          const minW = gridNode(n)
            ? gridExtent(
                Math.max(
                  isNetworkSegment(n) ? networkSegmentTextWidth(n) : 160,
                  gridPortMinimum(n, ['N', 'S']),
                ),
              )
            : isNetworkSegment(n)
              ? networkSegmentTextWidth(n)
              : 86;
          w = Math.max(minW, w);
          const minH = gridNode(n)
            ? gridExtent(
                Math.max(
                  isNetworkSegment(n) ? 2 * gridSettings.step : 80,
                  minimumNodeHeight(n, w),
                  gridPortMinimum(n, ['E', 'W']),
                ),
              )
            : minimumNodeHeight(n, w);
          h = Math.max(minH, h);
          // Un părinte nu se poate micșora peste copiii săi.
          for (const child of nodes.filter((c) => c.parent === n.id)) {
            const size = dimensions(child),
              pad = gridNode(n) ? gridSettings.step : 18;
            if (east) w = Math.max(w, child.x + size.w + pad - drag.startX);
            if (south) h = Math.max(h, child.y + size.h + pad - drag.startY);
          }
          if (gridNode(n)) {
            w = gridExtent(w);
            h = gridExtent(h);
          }
          const center = { x: drag.startX + drag.startW / 2, y: drag.startY + drag.startH / 2 },
            shift = {
              x: ((east ? 1 : west ? -1 : 0) * (w - drag.startW)) / 2,
              y: ((south ? 1 : north ? -1 : 0) * (h - drag.startH)) / 2,
            },
            nextCenter = rotatePoint(
              { x: center.x + shift.x, y: center.y + shift.y },
              center,
              n.rotation,
            );
          n.x = nextCenter.x - w / 2;
          n.y = nextCenter.y - h / 2;
          n.manualW = w;
          n.manualH = h;
          if (lattice) {
            n.x = snapGrid(n.x);
            n.y = snapGrid(n.y);
          }
          naturalSizes.delete(n.id);
          calculateNodeSizes(true);
          containChildren();
          refreshDraggedNodeGeometry();
          redrawMovingEdges();
        }

        /**
         * Memorează geometria și părinții nodurilor înainte de un gest care poate modifica containerele.
         */
        function captureContainerGeometry() {
          return new Map(
            nodes.map((node) => [
              node.id,
              {
                x: node.x,
                y: node.y,
                parent: node.parent,
                manualW: node.manualW,
                manualH: node.manualH,
                w: dimensions(node).w,
                h: dimensions(node).h,
              },
            ]),
          );
        }

        /**
         * Restaurează geometria nodurilor neafectate direct de gest din instantaneul capturat.
         */
        function restoreContainerGeometry(state) {
          for (const [id, saved] of state.geometrySnapshot || []) {
            if (state.affected.includes(id)) continue;
            const node = el(id);
            if (!node) continue;
            node.x = saved.x;
            node.y = saved.y;
            if (saved.parent === undefined) delete node.parent;
            else node.parent = saved.parent;
            if (saved.manualW === undefined) delete node.manualW;
            else node.manualW = saved.manualW;
            if (saved.manualH === undefined) delete node.manualH;
            else node.manualH = saved.manualH;
          }
        }

        /**
         * Actualizează rapid elementele DOM ale nodurilor mutate fără a reconstrui întreaga planșă.
         */
        function refreshDraggedNodeGeometry() {
          calculateNodeSizes(true);
          for (const d of world.querySelectorAll('.node')) {
            const node = el(d.dataset.id);
            if (!node) continue;
            const size = dimensions(node);
            d.style.left = node.x + 'px';
            d.style.top = node.y + 'px';
            d.style.width = size.w + 'px';
            d.style.height = size.h + 'px';
            d.classList.toggle('child', !!node.parent);
            d.classList.toggle(
              'container',
              nodes.some((item) => item.parent === node.id),
            );
          }
          updatePortPositions();
          renderResizeHandles();
        }

        /**
         * Previzualizează containerul candidat în care ar putea intra nodul tras.
         */
        function previewNodeContainer(state, node) {
          restoreContainerGeometry(state);
          if (state.originalParent === undefined) delete node.parent;
          else node.parent = state.originalParent;
          calculateNodeSizes(true);
          const size = dimensions(node),
            cx = node.x + size.w / 2,
            cy = node.y + size.h / 2;
          const target = [...nodes]
            .reverse()
            .find(
              (item) =>
                state.containerIds.has(item.id) &&
                item.id !== node.id &&
                !isDescendant(item.id, node.id) &&
                cx > item.x &&
                cy > item.y &&
                cx < item.x + dimensions(item).w &&
                cy < item.y + dimensions(item).h,
            );
          if (target) node.parent = target.id;
          else delete node.parent;
          state.previewParent = target?.id || null;
          calculateNodeSizes(true);
          if (target) containContainerChain(target.id);
          refreshDraggedNodeGeometry();
          state.previewParents = new Set();
          for (const [id, saved] of state.geometrySnapshot) {
            if (state.affected.includes(id)) continue;
            const item = el(id);
            if (
              item &&
              (item.x !== saved.x ||
                item.y !== saved.y ||
                dimensions(item).w !== saved.w ||
                dimensions(item).h !== saved.h)
            )
              state.previewParents.add(id);
          }
          if (target) state.previewParents.add(target.id);
        }

        /**
         * Șterge ghidajele vizuale temporare de aliniere.
         */
        function clearSnapGuides() {
          document.querySelectorAll('.snap-guide').forEach((item) => item.remove());
        }

        /**
         * Desenează ghidajele corespunzătoare alinierilor detectate în timpul mutării.
         */
        function drawSnapGuides(guides) {
          clearSnapGuides();
          for (const [axis, value] of Object.entries(guides)) {
            if (!Number.isFinite(value)) continue;
            const line = document.createElement('div');
            line.className = 'snap-guide';
            line.style.cssText =
              'position:absolute;pointer-events:none;z-index:99999;background:#0f9688;opacity:.7;';
            if (axis === 'x') {
              line.style.left = pan.x + value * scale + 'px';
              line.style.top = '0';
