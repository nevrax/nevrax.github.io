              line.style.bottom = '0';
              line.style.width = '1px';
            } else {
              line.style.top = pan.y + value * scale + 'px';
              line.style.left = '0';
              line.style.right = '0';
              line.style.height = '1px';
            }
            canvas.appendChild(line);
          }
        }

        /**
         * Calculează ajustarea poziției nodului către grilă și către reperele geometrice apropiate.
         */
        function smartSnapNode(n, x, y, excluded = new Set([n.id])) {
          const size = dimensions(n),
            moving = { x: [0, size.w / 2, size.w], y: [0, size.h / 2, size.h] },
            refs = { x: [], y: [] },
            guides = {},
            threshold = Math.min(gridSettings.step * 0.6, 10 / scale);
          const add =
            /**
             * Adaugă elementul calculat în colecția locală de rezultate.
             */
            (axis, value, priority = 1) => {
              if (Math.abs(value - snapGrid(value)) < 0.001) refs[axis].push({ value, priority });
            };
          const linked = new Set(
            edges
              .filter((e) => e.from === n.id || e.to === n.id)
              .map((e) => (e.from === n.id ? e.to : e.from)),
          );
          const others = nodes
            .filter(
              (r) =>
                !excluded.has(r.id) &&
                !isDescendant(n.id, r.id) &&
                Math.abs(r.x - x) < 1400 &&
                Math.abs(r.y - y) < 1400,
            )
            .slice(0, 100);
          for (const name of portNamesForNode(n)) {
            const p = portPointForNode(n, name);
            moving.x.push(p.x - n.x);
            moving.y.push(p.y - n.y);
          }
          for (const r of others) {
            const z = dimensions(r);
            for (const value of [r.x, r.x + z.w / 2, r.x + z.w]) add('x', value);
            for (const value of [r.y, r.y + z.h / 2, r.y + z.h]) add('y', value);
            for (const name of portNamesForNode(r)) {
              const p = portPointForNode(r, name);
              add('x', p.x, linked.has(r.id) ? 0 : 1);
              add('y', p.y, linked.has(r.id) ? 0 : 1);
            }
          }
          for (const edge of edges) {
            if (excluded.has(edge.from) || excluded.has(edge.to)) continue;
            for (const p of routeCache.get(edge.id)?.points || []) {
              add('x', p.x, 2);
              add('y', p.y, 2);
            }
          }
          const result = { x: snapGrid(x), y: snapGrid(y) };
          for (const axis of ['x', 'y']) {
            const desired = axis === 'x' ? x : y;
            let best = null;
            for (const offset of new Set(moving[axis]))
              for (const ref of refs[axis]) {
                const candidate = ref.value - offset,
                  distance = Math.abs(candidate - desired);
                if (
                  distance <= threshold &&
                  Math.abs(candidate - snapGrid(candidate)) < 0.001 &&
                  (!best ||
                    ref.priority < best.priority ||
                    (ref.priority === best.priority && distance < best.distance))
                )
                  best = { candidate, distance, priority: ref.priority, line: ref.value };
              }
            if (best) {
              result[axis] = snapGrid(best.candidate);
              guides[axis] = best.line;
            }
          }
          // Distanțe egale între nodurile vecine de pe același rând sau coloană, exprimate în celule întregi.
          for (const axis of ['x', 'y']) {
            if (guides[axis] !== undefined) continue;
            const cross = axis === 'x' ? 'y' : 'x',
              extent = axis === 'x' ? 'w' : 'h',
              crossExtent = axis === 'x' ? 'h' : 'w',
              desired = axis === 'x' ? x : y,
              crossPos = axis === 'x' ? y : x;
            const row = others
              .filter((r) => Math.abs(r[cross] - crossPos) < gridSettings.step)
              .sort((a, b) => a[axis] - b[axis]);
            for (let i = 1; i < row.length; i++) {
              const left = row[i - 1],
                right = row[i],
                gap = right[axis] - left[axis] - dimensions(left)[extent];
              if (gap < 0) continue;
              for (const candidate of [
                right[axis] + dimensions(right)[extent] + gap,
                left[axis] - gap - size[extent],
              ])
                if (
                  Math.abs(candidate - desired) <= threshold &&
                  Math.abs(candidate - snapGrid(candidate)) < 0.001
                ) {
                  result[axis] = candidate;
                  guides[axis] = candidate;
                }
            }
          }
          drawSnapGuides(guides);
          return result;
        }

        /**
         * Mută nodul activ, descendenții și punctele interne de traseu, apoi actualizează ghidajele și conexiunile.
         */
        function moveNode(e) {
          const p = local(e),
            n = el(drag.id);
          let x = (p.x - pan.x) / scale - drag.dx,
            y = (p.y - pan.y) / scale - drag.dy;
          if (!drag.moved && Math.hypot(x - drag.start.x, y - drag.start.y) < 3 / scale) return;
          drag.moved = true;
          if (gridSettings.snap) {
            const snapped = smartSnapNode(n, x, y, new Set(drag.affected));
            x = snapped.x;
            y = snapped.y;
          }
          x = Math.round(x);
          y = Math.round(y);
          const dx = x - n.x,
            dy = y - n.y;
          n.x = x;
          n.y = y;
          shiftDescendants(n.id, dx, dy);
          moveInternalWaypoints(drag, x - drag.start.x, y - drag.start.y);
          previewNodeContainer(drag, n);
          redrawMovingEdges();
        }

        /**
         * Mută împreună rădăcinile selecției și descendenții lor, păstrând distanțele relative.
         */
        function moveGroup(e) {
          let dx = Math.round((e.clientX - drag.startClientX) / scale),
            dy = Math.round((e.clientY - drag.startClientY) / scale);
          if (!drag.moved && Math.hypot(dx, dy) < 3 / scale) return;
          drag.moved = true;
          if (gridSettings.snap) {
            const starts = [...drag.starts.values()];
            dx =
              snapGrid(Math.min(...starts.map((p) => p.x)) + dx) -
              Math.min(...starts.map((p) => p.x));
            dy =
              snapGrid(Math.min(...starts.map((p) => p.y)) + dy) -
              Math.min(...starts.map((p) => p.y));
          }
          if (gridSettings.snap) {
            const anchor = el(drag.roots[0]),
              start = drag.starts.get(anchor.id),
              snapped = smartSnapNode(anchor, start.x + dx, start.y + dy, new Set(drag.affected));
            dx = snapped.x - start.x;
            dy = snapped.y - start.y;
          }
          for (const id of drag.affected) {
            const n = el(id),
              start = drag.starts.get(id);
            n.x = start.x + dx;
            n.y = start.y + dy;
          }
          for (const d of world.querySelectorAll('.node')) {
            const n = el(d.dataset.id);
            if (drag.starts.has(n.id)) {
              d.style.left = n.x + 'px';
              d.style.top = n.y + 'px';
            }
          }
          moveInternalWaypoints(drag, dx, dy);
          redrawMovingEdges();
        }

        /**
         * Finalizează mutarea unei selecții, normalizează containerele și salvează rezultatul.
         */
        function finishGroup(e) {
          const ended = drag;
          drag = null;
          if (!ended.moved) return;
          const point = local(e),
            x = (point.x - pan.x) / scale,
            y = (point.y - pan.y) / scale;
          const affected = new Set(ended.affected),
            members = ended.affected.map(el);
          const group = zoneBounds(members);
          const candidates = nodes.filter(
            (n) =>
              !affected.has(n.id) &&
              x > n.x &&
              y > n.y &&
              x < n.x + dimensions(n).w &&
              y < n.y + dimensions(n).h,
          );
          const overlap =
            /**
             * Calculează suprapunerea intervalelor pe axa de aliniere.
             */
            (n) => {
              const r = nodeRect(n);
              return (
                Math.max(0, Math.min(group.right, r.right) - Math.max(group.x, r.x)) *
                Math.max(0, Math.min(group.bottom, r.bottom) - Math.max(group.y, r.y))
              );
            };
          const target = candidates.sort(
            (a, b) => overlap(b) - overlap(a) || nodeDepth(b) - nodeDepth(a),
          )[0];
          if (target) {
            for (const id of ended.roots) el(id).parent = target.id;
            toast('Grup înglobat');
          } else for (const id of ended.roots) delete el(id).parent;
          normalizeHierarchy();
          bringNodesToFront(ended.affected);
          calculateNodeSizes(true);
          containChildren();
          remember();
          render();
        }

        /**
         * Calculează limitele utile ale unei zone container, inclusiv spațiul rezervat etichetei.
         */
        function zoneBounds(zone) {
          let left = Infinity,
            top = Infinity,
            right = -Infinity,
            bottom = -Infinity;
          for (const n of zone) {
            const size = dimensions(n);
            left = Math.min(left, n.x);
            top = Math.min(top, n.y);
            right = Math.max(right, n.x + size.w);
            bottom = Math.max(bottom, n.y + size.h);
          }
          return { x: left, y: top, right, bottom, cx: (left + right) / 2, cy: (top + bottom) / 2 };
        }
        // Containerul trebuie să cuprindă copiii pe toate cele patru laturi. Mutarea colțului
        // din stânga sus îi extinde conturul; copiii își păstrează coordonatele absolute.

        /**
         * Ajustează containerele pentru a include nodurile copil cu marginile necesare.
         */
        function containChildren() {
          const byParent = new Map();
          for (const node of nodes)
            if (node.parent) {
              if (!byParent.has(node.parent)) byParent.set(node.parent, []);
              byParent.get(node.parent).push(node);
            }
          const ordered = [...nodes].sort((a, b) => nodeDepth(b) - nodeDepth(a));
          for (const parent of ordered) {
            if (!usableRect(nodeRect(parent))) continue;
            const children = byParent.get(parent.id) || [];
            if (!children.length) continue;
            let left = Infinity,
              top = Infinity;
            for (const child of children) {
              const bounds = nodeVisualRect(child);
              if (usableRect(bounds)) {
                left = Math.min(left, bounds.x - (gridNode(parent) ? gridSettings.step : 16));
                top = Math.min(top, bounds.y - (gridNode(parent) ? 3 * gridSettings.step : 44));
              }
            }
            if (!Number.isFinite(left) || !Number.isFinite(top)) continue;
            if (gridNode(parent)) {
              left = gridFloor(left);
              top = gridFloor(top);
            }
            if (left < parent.x) {
              if (parent.manualW) parent.manualW += parent.x - left;
              parent.x = left;
            }
            if (top < parent.y) {
              if (parent.manualH) parent.manualH += parent.y - top;
              parent.y = top;
            }
          }
          calculateNodeSizes(true);
        }

        /**
         * Propagă ajustările de încadrare către strămoșii unui container modificat.
         */
        function containContainerChain(id) {
          let parent = el(id);
          const seen = new Set();
          while (parent && !seen.has(parent.id)) {
            seen.add(parent.id);
            calculateNodeSizes(true);
            const children = nodes.filter((node) => node.parent === parent.id);
            let left = Infinity,
              top = Infinity;
            for (const child of children)
              if (usableRect(nodeRect(child))) {
                left = Math.min(left, child.x - (gridNode(parent) ? gridSettings.step : 16));
                top = Math.min(top, child.y - (gridNode(parent) ? 3 * gridSettings.step : 44));
              }
            if (gridNode(parent)) {
              left = gridFloor(left);
              top = gridFloor(top);
            }
            if (Number.isFinite(left) && left < parent.x) {
              if (parent.manualW) parent.manualW += parent.x - left;
              parent.x = left;
            }
            if (Number.isFinite(top) && top < parent.y) {
              if (parent.manualH) parent.manualH += parent.y - top;
              parent.y = top;
            }
            parent = parent.parent ? el(parent.parent) : null;
          }
          calculateNodeSizes(true);
        }

        // ============================================================================
        // 12. Aliniere și distribuire geometrică
        // ============================================================================

        /**
         * Convertește selecția sau întreaga diagramă la geometria discretă, păstrând posibilitatea de Undo.
         */
        function alignNodesToGrid() {
          const roots = selectedNodes.size
              ? selectedRoots()
              : nodes.filter((n) => !n.parent).map((n) => n.id),
            targets = nodes.filter((n) =>
              roots.some((id) => n.id === id || isDescendant(n.id, id)),
            );
          calculateNodeSizes(true);
          let changed = 0;
          for (const n of targets) {
            if (!usableRect(nodeRect(n)) || Number(n.rotation) % 90) continue;
            const size = dimensions(n);
            n.grid = true;
            n.x = snapGrid(n.x);
            n.y = snapGrid(n.y);
            n.manualW = gridExtent(size.w);
            n.manualH = gridExtent(size.h);
            ensurePortSlots(n, { w: n.manualW, h: n.manualH });
            changed++;
          }
          if (!changed) {
            toast('Selectează noduri fără rotație liberă');
            return;
          }
          naturalSizes.clear();
          calculateNodeSizes(true);
          containChildren();
          normalizeGridGeometry();
          remember();
          render();
          toast('Nodurile, dimensiunile și porturile au fost adaptate la grilă');
        }

        /**
         * Normalizează dimensiunile și sloturile rădăcinilor selectate și ale descendenților lor înainte de aranjare.
         */
        function prepareGridRoots(roots) {
          if (!gridSettings.snap) return false;
          const before = snapshot();
          calculateNodeSizes(true);
          for (const n of nodes.filter((n) =>
            roots.some((id) => n.id === id || isDescendant(n.id, id)),
          )) {
            if (Number(n.rotation) % 90) continue;
            const size = dimensions(n);
            n.grid = true;
            n.x = snapGrid(n.x);
            n.y = snapGrid(n.y);
            n.manualW = gridExtent(size.w);
            n.manualH = gridExtent(size.h);
            ensurePortSlots(n, { w: n.manualW, h: n.manualH });
          }
          naturalSizes.clear();
          calculateNodeSizes(true);
          return snapshot() !== before;
        }

        /**
         * Aliniază nodurile selectate după marginea sau centrul cerut și păstrează deplasarea copiilor lor.
         */
        function alignSelectedNodes(mode) {
          const roots = selectedRoots();
          if (roots.length < 2) {
            toast('Selectează cel puțin două noduri');
            return;
          }
          const prepared = prepareGridRoots(roots);
          calculateNodeSizes(true);
          const boxes = roots
            .map((id) => {
              const node = el(id),
                rect = nodeRect(node);
              return { node, ...rect };
            })
            .filter((item) => usableRect(item));
          if (boxes.length < 2) {
            toast('Selectează cel puțin două noduri vizibile');
            return;
          }
          const left = Math.min(...boxes.map((box) => box.x)),
            right = Math.max(...boxes.map((box) => box.right)),
            top = Math.min(...boxes.map((box) => box.y)),
            bottom = Math.max(...boxes.map((box) => box.bottom));
          const centerX = (left + right) / 2,
            centerY = (top + bottom) / 2;
          let moved = 0;
          for (const box of boxes) {
            let x = box.node.x,
              y = box.node.y;
            if (mode === 'left') x = left;
            else if (mode === 'centerX') x = centerX - box.w / 2;
            else if (mode === 'right') x = right - box.w;
            else if (mode === 'top') y = top;
            else if (mode === 'centerY') y = centerY - box.h / 2;
            else if (mode === 'bottom') y = bottom - box.h;
            if (gridSettings.snap) {
              x = snapGrid(x);
              y = snapGrid(y);
            }
            const dx = x - box.node.x,
              dy = y - box.node.y;
            if (dx || dy) {
              box.node.x = x;
              box.node.y = y;
              shiftDescendants(box.node.id, dx, dy);
              moved++;
            }
          }
          if (!moved) {
            if (prepared) {
              remember();
              render();
            }
            toast('Nodurile sunt deja aliniate');
            return;
          }
          calculateNodeSizes(true);
          remember();
          render(true);
          toast('Noduri aliniate');
        }

        /**
         * Distribuie uniform nodurile selectate pe axa cerută, ținând cont de dimensiuni și grilă.
         */
        function distributeSelectedNodes(axis) {
          const roots = selectedRoots();
          if (roots.length < 3) {
            toast('Selectează cel puțin trei noduri');
            return;
          }
          const prepared = prepareGridRoots(roots);
          calculateNodeSizes(true);
          const horizontal = axis === 'horizontal',
            boxes = roots
              .map((id) => {
                const node = el(id);
                return { node, ...nodeRect(node) };
              })
              .filter(usableRect)
              .sort((a, b) => (horizontal ? a.x - b.x : a.y - b.y));
          if (boxes.length < 3) {
            toast('Selectează cel puțin trei noduri vizibile');
            return;
          }
          const start = horizontal ? boxes[0].x : boxes[0].y,
            end = horizontal ? boxes.at(-1).right : boxes.at(-1).bottom,
            total = boxes.reduce((sum, box) => sum + (horizontal ? box.w : box.h), 0),
            rawGap = (end - start - total) / (boxes.length - 1),
            gap = gridSettings.snap ? snapGrid(rawGap) : rawGap;
          let cursor = gridSettings.snap ? snapGrid(start) : start,
            moved = 0;
          for (const box of boxes) {
            const x = horizontal ? cursor : box.node.x,
              y = horizontal ? box.node.y : cursor,
              dx = x - box.node.x,
              dy = y - box.node.y;
            if (dx || dy) {
              box.node.x = x;
              box.node.y = y;
              shiftDescendants(box.node.id, dx, dy);
              moved++;
            }
            cursor += (horizontal ? box.w : box.h) + gap;
          }
          if (!moved) {
            if (prepared) {
              remember();
              render();
            }
            toast('Nodurile sunt deja distribuite egal');
            return;
          }
          calculateNodeSizes(true);
          remember();
          render(true);
          toast('Spațiere egală aplicată');
        }

        /**
         * Uniformizează lățimile sau înălțimile selecției fără a încălca dimensiunile minime ale nodurilor.
         */
        function equalizeSelectedNodes(mode) {
          const roots = selectedRoots();
          if (roots.length < 2) {
            toast('Selectează cel puțin două noduri');
            return;
          }
          const prepared = prepareGridRoots(roots);
          calculateNodeSizes(true);
          const boxes = roots
            .map((id) => ({ node: el(id), ...nodeRect(el(id)) }))
            .filter(usableRect);
          if (boxes.length < 2) {
            toast('Selectează cel puțin două noduri vizibile');
            return;
          }
          const round = gridSettings.snap ? gridExtent : Math.ceil,
            width = round(Math.max(...boxes.map((box) => box.w))),
            height = round(Math.max(...boxes.map((box) => box.h)));
          let changed = 0;
          for (const { node } of boxes) {
            let didChange = false;
            if ((mode === 'width' || mode === 'both') && node.manualW !== width) {
              node.manualW = width;
              didChange = true;
            }
            if ((mode === 'height' || mode === 'both') && node.manualH !== height) {
              node.manualH = height;
              didChange = true;
            }
            if (didChange) {
              naturalSizes.delete(node.id);
              changed++;
            }
          }
          if (!changed) {
            if (prepared) {
              remember();
              render();
            }
            toast('Nodurile au deja aceleași dimensiuni');
            return;
          }
          calculateNodeSizes(true);
          remember();
          render(true);
          toast('Dimensiuni egalizate');

        /**
         * Alege porturile selectate care pot fi deplasate pe axa cerută.
         */
        function selectedPortAxisNames(n, axis) {
          return n
            ? [...selectedPorts].filter((name) => Math.abs(portTangent(n, name, axis)) > 0.0001)
            : [];
        }

        /**
         * Calculează poziția unui port cardinal la o proporție dată pe latura nodului.
         */
        function cardinalPortPointAt(n, name, t) {
          const rect = nodeRect(n),
            side = name[0],
            size = dimensions(n),
            point =
              side === 'N'
                ? { x: rect.x + size.w * t, y: rect.y }
                : side === 'E'
                  ? { x: rect.right, y: rect.y + size.h * t }
                  : side === 'S'
                    ? { x: rect.x + size.w * t, y: rect.bottom }
                    : { x: rect.x, y: rect.y + size.h * t };
          return rotatePoint(point, nodeCenter(n), n.rotation);
        }

        /**
         * Returnează direcția de deplasare pe latura portului, în coordonatele planșei.
         */
        function portTangent(n, name, axis) {
          const first = cardinalPortPointAt(n, name, 0),
            last = cardinalPortPointAt(n, name, 1);
          return axis === 'x' ? last.x - first.x : last.y - first.y;
        }

        /**
         * Transformă o coordonată de aliniere în proporția corespunzătoare pe latura portului.
         */
        function portTForCoordinate(n, name, axis, target) {
          const first = cardinalPortPointAt(n, name, 0),
            delta = portTangent(n, name, axis);
          if (Math.abs(delta) < 0.0001) return null;
          const t = (target - first[axis]) / delta;
          return t >= -0.0001 && t <= 1.0001 ? Math.max(0, Math.min(1, t)) : null;
        }

        /**
         * Adună nodurile și porturile care pot servi drept repere pentru alinierea selecției de porturi.
         */
        function portAlignmentReferences() {
          const references = [...selectedNodes]
            .filter((id) => id !== selectedPortNodeId)
            .map(el)
            .filter(Boolean);
          return references;
        }

        /**
         * Calculează limitele relevante ale reperelor folosite la alinierea porturilor.
         */
        function portAlignmentBounds(references) {
          const boxes = references.map(nodeRect);
          return {
            x: Math.min(...boxes.map((box) => box.x)),
            y: Math.min(...boxes.map((box) => box.y)),
            right: Math.max(...boxes.map((box) => box.right)),
            bottom: Math.max(...boxes.map((box) => box.bottom)),
          };
        }

        /**
         * Alege coordonata țintă a alinierii din marginea sau centrul reperelor.
         */
        function portAlignmentTarget(references, mode) {
          const bounds = portAlignmentBounds(references);
          if (mode === 'left') return bounds.x;
          if (mode === 'centerX') return (bounds.x + bounds.right) / 2;
          if (mode === 'right') return bounds.right;
          if (mode === 'top') return bounds.y;
          if (mode === 'centerY') return (bounds.y + bounds.bottom) / 2;
          return bounds.bottom;
        }

        /**
         * Aplică simultan pozițiile calculate pentru porturi și actualizează istoricul și desenul.
         */
        function applyPortPositions(n, entries, message) {
          let changed = false;
          for (const [name, value] of entries) {
            const before = currentPortPositionValue(n, name);
            setPortPosition(n, name, Math.max(0, Math.min(1, value)));
            if (Math.abs(currentPortPositionValue(n, name) - before) > 0.001) changed = true;
          }
          if (!changed) {
            toast('Porturile selectate sunt deja aliniate');
            return;
          }
          routeCache.clear();
          edgeIndexVersion = -1;
          remember();
          render();
          toast(message);
        }

        /**
         * Aliniază porturile selectate la reperele permise, pe axa de deplasare a laturii lor.
         */
        function alignSelectedPorts(mode) {
          const n = el(selectedPortNodeId);
          if (!portPositionMode || !n) return;
          const axis = ['left', 'centerX', 'right'].includes(mode) ? 'x' : 'y',
            references = portAlignmentReferences(),
            names = selectedPortAxisNames(n, axis);
          if (!names.length) {
            toast('Porturile selectate nu se pot deplasa pe această axă');
            return;
          }
          if (references.length) {
            const target = portAlignmentTarget(references, mode),
              entries = names
                .map((name) => [name, portTForCoordinate(n, name, axis, target)])
                .filter(([, value]) => value !== null);
            if (!entries.length) {
              toast('Porturile nu pot ajunge la alinierea nodului pe această axă');
              return;
            }
            const referenceLabel =
              references.length === 1
                ? references[0].label || 'nod'
                : references.length + ' noduri';
            applyPortPositions(
              n,
              entries,
              `Porturile de pe ${n.label || 'nod'} aliniate la ${referenceLabel}`,
            );
            return;
          }
          if (names.length < 2) {
            toast('Selectează două porturi mobile pe aceeași axă');
            return;
          }
          names.sort((a, b) => currentPortPositionValue(n, a) - currentPortPositionValue(n, b));
          const first = currentPortPositionValue(n, names[0]),
            last = currentPortPositionValue(n, names.at(-1)),
            target =
              mode === 'left' || mode === 'top'
                ? first
                : mode === 'right' || mode === 'bottom'
                  ? last
                  : (first + last) / 2;
          applyPortPositions(
            n,
            names.map((name) => [name, target]),
            `Porturi aliniate ${axis === 'x' ? 'pe orizontală' : 'pe verticală'}`,
          );
        }

        /**
         * Distribuie uniform porturile selectate între limitele disponibile ale laturii.
         */
        function distributeSelectedPorts(axis) {
          const n = el(selectedPortNodeId);
          if (!portPositionMode || !n) return;
          const references = portAlignmentReferences(),
            names = selectedPortAxisNames(n, axis).sort(
              (a, b) => currentPortPositionValue(n, a) - currentPortPositionValue(n, b),
            );
          if (names.length < 3) {
            toast('Selectează cel puțin trei porturi mobile pe aceeași axă');
            return;
          }
          let start, end;
          if (references.length) {
            const bounds = portAlignmentBounds(references);
            start = axis === 'x' ? bounds.x : bounds.y;
            end = axis === 'x' ? bounds.right : bounds.bottom;
          } else {
            start = cardinalPortPointAt(n, names[0], currentPortPositionValue(n, names[0]))[axis];
            end = cardinalPortPointAt(n, names.at(-1), currentPortPositionValue(n, names.at(-1)))[
              axis
            ];
          }
          const gap = (end - start) / (names.length - 1),
            step = gridNode(n) ? Math.max(gridSettings.step, snapGrid(gap)) : gap,
            targets = names.map((name, index) => [
              name,
              portTForCoordinate(n, name, axis, start + step * index),
            ]);
          if (targets.some(([, value]) => value === null)) {
            toast('Porturile nu pot fi distribuite uniform pe latura nodului');
            return;

        }
        defineAction('alignSelectedNodes', alignSelectedNodes);

            runAction('distributeSelectedNodes', target.dataset.distribute);
          else if (target.dataset.size) runAction('equalizeSelectedNodes', target.dataset.size);
          else if (target.dataset.align === 'grid') runAction('alignNodesToGrid');
          else runAction('alignSelectedNodes', target.dataset.align);
        });
        document.addEventListener('pointerdown', (event) => {

        /**
         * Extrage perechea de atingeri și calculează centrul și distanța folosite pentru zoom tactil.
         */
        function pinchPair() {

        }

        /**

            points = ids.map((id) => activeTouchPointers.get(id));

          const rect = canvas.getBoundingClientRect(),
            mid = { x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2 };
          pinchGesture = {
            ids,
            distance: Math.max(1, Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y)),
            scale,
            anchor: {
              x: (mid.x - rect.left - pan.x) / scale,
              y: (mid.y - rect.top - pan.y) / scale,
            },
          };

          document.body.classList.remove('panning');
          for (const id of ids)
            try {
              canvas.setPointerCapture(id);

         * Actualizează zoomul și translația păstrând punctul diagramei aflat sub centrul atingerilor.
         */
        function updatePinchGesture() {
          const points = pinchPair();
          if (points.length !== 2) return;
          const rect = canvas.getBoundingClientRect(),
            mid = { x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2 },
            distance = Math.max(
              1,
              Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y),

            next = Math.min(
              MAX_ZOOM,

            x: mid.x - rect.left - pinchGesture.anchor.x * scale,
            y: mid.y - rect.top - pinchGesture.anchor.y * scale,

          'pointerdown',

          'pointerdown',

        );

          }
          if (drag.kind === 'group') {

            return;
          }
          if (drag.kind === 'resize') {

            render();
            return;
          }
          if (drag.kind === 'node') {
            const ended = drag,
              n = el(ended.id);
            if (!ended.moved) {

              return;

         * Alege portul implicit potrivit unui capăt de conexiune după poziția celuilalt capăt.
         */
        function automaticPortForEnd(edge, end, node) {
          const other = el(edge[end === 'from' ? 'to' : 'from']);
          if (!other) return null;
          const pair = end === 'from' ? autoPorts(node, other, []) : autoPorts(other, node, []);

        /**
         * Actualizează conexiunile când porturile unui nod au fost adăugate, eliminate sau renumerotate.
         */
        function normalizeCardinalLinks(node, activatedSide = null, previousAuto = new Map()) {
          for (const edge of edges)
            for (const end of ['from', 'to'])
              if (edge[end] === node.id) {
                const key = end + 'Port',
                  value = edge[key],
                  cardinal = /^([NESW])(\d+)$/.exec(value || '');
                if (cardinal) {
                  const count = cardinalPortCount(node, cardinal[1]);
                  if (!count) delete edge[key];
                  else if (Number(cardinal[2]) > count) edge[key] = `${cardinal[1]}${count}`;
                  continue;
                }
                if (activatedSide && cardinalPortCount(node, activatedSide) > 0) {
                  const contact = value || previousAuto.get(`${edge.id}:${end}`);
                  if ((genericPortSides[contact] || []).includes(activatedSide)) {
                    edge[key] = `${activatedSide}1`;
                    continue;
                  }
                }
                if (value && !hasPort(node, value)) delete edge[key];
              }
        }

        /**
         * Modifică numărul de porturi pe o latură, redistribuie sloturile și adaptează dimensiunile necesare.
         */
        function changeCardinalPortCount(side, delta) {
          const node = portPositionMode
            ? el(selectedPortNodeId)
            : selectedNodes.size === 1
              ? el([...selectedNodes][0])
              : null;
          if (!node) return;
          const current = cardinalPortCount(node, side),
            next = Math.max(0, current + delta);
          if (next === current) return;
          if (
            delta > 0 &&
            !isNetworkSegment(node) &&
            dimensions(node).h < 42 &&
            ((side === 'N' && cardinalPortCount(node, 'S')) ||
              (side === 'S' && cardinalPortCount(node, 'N')))
          )
            return;
          const previousAuto = new Map();
          for (const edge of edges)
            for (const end of ['from', 'to'])
              if (edge[end] === node.id && !edge[end + 'Port'])
                previousAuto.set(`${edge.id}:${end}`, automaticPortForEnd(edge, end, node));
          node.ports = { ...(node.ports || {}), [side]: next };
          if (gridNode(node) && node.portSlots)
            for (const key of Object.keys(node.portSlots))
              if (key[0] === side) delete node.portSlots[key];
          if (delta < 0 && node.portPositions) {
            delete node.portPositions[`${side}${current}`];
            if (!Object.keys(node.portPositions).length) delete node.portPositions;
          }
          if (!cardinalSides.some((direction) => cardinalPortCount(node, direction) > 0)) {
            delete node.ports;
            delete node.portPositions;
            portPositionMode = false;
            selectedPortNodeId = null;
            selectedPorts.clear();
            document.body.classList.remove('port-position-mode');
          }
          normalizeCardinalLinks(node, delta > 0 && current === 0 ? side : null, previousAuto);
          naturalSizes.delete(node.id);
          nodeSizes.delete(node.id);
          remember();
          render();
        }

        /**
         * Calculează o nuanță derivată a unei culori din paletă prin amestecare cu alb sau negru.
         */
        function mixOfficeColor(hex, amount) {
          const n = parseInt(hex.slice(1), 16),
            r = ((n >> 16) & 255) / 255,
            g = ((n >> 8) & 255) / 255,
            b = (n & 255) / 255,
            max = Math.max(r, g, b),
            min = Math.min(r, g, b),
            delta = max - min;
          let h = 0;
          if (delta) {
            if (max === r) h = 60 * (((g - b) / delta) % 6);
            else if (max === g) h = 60 * ((b - r) / delta + 2);
            else h = 60 * ((r - g) / delta + 4);
          }
          if (h < 0) h += 360;
          let l = (max + min) / 2,
            s = delta ? delta / (1 - Math.abs(2 * l - 1)) : 0;
          l = amount >= 0 ? l + (1 - l) * amount : l * (1 + amount);
          const c = (1 - Math.abs(2 * l - 1)) * s,
            x = c * (1 - Math.abs(((h / 60) % 2) - 1)),
            m = l - c / 2,
            parts =
              h < 60
                ? [c, x, 0]
                : h < 120
                  ? [x, c, 0]
                  : h < 180
                    ? [0, c, x]
                    : h < 240
                      ? [0, x, c]
                      : h < 300
                        ? [x, 0, c]
                        : [c, 0, x];
          return (
            '#' +
            parts
              .map((v) =>
                Math.round((v + m) * 255)
                  .toString(16)
                  .padStart(2, '0'),
              )
              .join('')
              .toUpperCase()
          );
        }

         */
        function zoomAt(f, point) {
          const next = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, scale * f)),
            ratio = next / scale;
          pan = { x: point.x - (point.x - pan.x) * ratio, y: point.y - (point.y - pan.y) * ratio };
          scale = next;
          applyView();
        }
        canvas.addEventListener(
          'wheel',
          (e) => {
            e.preventDefault();
            zoomAt(e.deltaY < 0 ? 1.1 : 1 / 1.1, local(e));
          },
          { passive: false },
        );
        defineAction(
          'exportNativeDiagram',
          /**
           * Descarcă modelul curent ca JSON ELS, fără datele altor diagrame din bibliotecă.
           */
          () =>
            download(
              JSON.stringify(
                { format: 'els', version: 1, geometry: gridMetadata(), nodes, edges },
                null,
                2,
              ),
              `${diagramExportStem()}.els.json`,
              'application/json',
            ),
        );
        bindAction('native', 'exportNativeDiagram');
        defineAction(
          'exportCellDiagram',
          /**
           * Oferă exportul alternativ în coordonate de grilă prin API; nu adaugă un buton în interfață.
           */
          () =>
            download(
              JSON.stringify(cellDiagramData(), null, 2),
              `${diagramExportStem()}-cells.els.json`,
              'application/json',
            ),
        );

        // ============================================================================
        // 15. Export JSON, SVG, PNG, JPG și Mermaid
        // ============================================================================

        /**
         * Citește rezoluția cerută pentru export sau folosește zoomul curent al planșei.
         */
        function exportZoomFactor() {
          const value = $('#imageExportZoom')?.value || 'current';
          return value === 'current' ? scale : Number(value);
        }

        /**
         * Escapează caracterele speciale pentru texte și atribute SVG delimitate cu ghilimele duble.
         */
        function exportEsc(value) {
          return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;');
        }

        /**
         * Împarte textul în linii care încap în lățimea disponibilă la export, folosind măsurarea fontului.
         */
        function exportTextLines(value, width) {
          const result = [];
          for (const para of String(value || '').split('\n')) {
            const words = para.split(/\s+/).filter(Boolean);
            if (!words.length) {
              result.push('');
              continue;
            }
            let line = '';
            for (const word of words) {
              const next = line ? `${line} ${word}` : word;
              if (line && textMeter.measureText(next).width > width) {
                result.push(line);
                line = word;
              } else line = next;
            }
            result.push(line);
          }
          return result;
        }

        /**
         * Construiește documentul SVG autonom din modelul curent, cu forme, texte, porturi și conexiuni.
         */
        function exportSvgDocument(factor) {
          if (!nodes.length) {
            toast('Diagrama goală');
            return null;
          }
          calculateNodeSizes();
          const rects = nodes.filter((n) => usableRect(nodeVisualRect(n))).map(nodeVisualRect);
          if (!rects.length) return null;
          const bounds = [...rects, ...edges.map(edgeBounds).filter(Boolean)];
          const left = Math.min(...bounds.map((r) => r.x)) - 20,
            top = Math.min(...bounds.map((r) => r.y)) - 20,
            right = Math.max(...bounds.map((r) => r.right)) + 20,
            bottom = Math.max(...bounds.map((r) => r.bottom)) + 20,
            w = right - left,
            h = bottom - top;
          const shapes = [],
            labels = [],
            ports = [],
            edgeShapes = [];
          for (const n of nodes) {
            if (!usableRect(nodeVisualRect(n))) continue;
            const r = nodeRect(n),
              size = dimensions(n),
              center = nodeCenter(n),
              rotation = Number(n.rotation) || 0,
              transform = rotation
                ? ` transform="rotate(${rotation} ${center.x} ${center.y})"`
                : '';
            shapes.push(
              `<g${transform}><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${isNetworkSegment(n) ? 2 : 9}" fill="${exportEsc(n.fill || '#ffffff')}" stroke="${exportEsc(n.stroke || '#42536f')}" stroke-width="2"${n.borderStyle === 'dashed' ? ' stroke-dasharray="8 6"' : n.borderStyle === 'dotted' ? ' stroke-dasharray="2 5"' : ''}/></g>`,
            );
            if (['firewall', 'vm'].includes(n.kind))
              shapes.push(
                `<g${transform}><path d="${nodeRolePath(n.kind, r.x + 9, center.y - 12)}" fill="none" stroke="${exportEsc(n.stroke || '#42536f')}" stroke-width="2"/>${n.kind === 'firewall' ? `<rect x="${r.x + 4}" y="${r.y + 4}" width="${r.w - 8}" height="${r.h - 8}" rx="5" fill="none" stroke="${exportEsc(n.stroke || '#42536f')}"/>` : ''}</g>`,
              );
            if (n.kind === 'container')
              shapes.push(
                `<g${transform}><path d="M ${r.x} ${r.y + 32} h ${r.w}" stroke="${exportEsc(n.stroke || '#42536f')}"/></g>`,
              );
            const container =
                n.kind === 'container' || nodes.some((child) => child.parent === n.id),
              font = '15px system-ui';
            textMeter.font = font;
            const lines = n.labelWrap
              ? nodeLabelLines(
                  n,
                  Math.max(20, size.w - (['firewall', 'vm'].includes(n.kind) ? 60 : 34)),
                )
              : exportTextLines(n.label || '', Math.max(20, size.w - 34));
            let tx,
              ty,
              anchor = 'middle';
            if (n.labelPos) {
              tx = r.x + (Number.isFinite(n.labelPos.x) ? n.labelPos.x : 0.5) * r.w;
              ty =
                r.y +
                (Number.isFinite(n.labelPos.y) ? n.labelPos.y : 0.5) * r.h -
                (lines.length - 1) * 9;
              anchor = 'middle';
            } else if (container) {
              tx = r.x + 17;
              ty = r.y + 27;
              anchor = 'start';
            } else {
              tx = center.x + (['firewall', 'vm'].includes(n.kind) ? 14 : 0);
              ty = center.y - (lines.length - 1) * 9 + 5;
            }
            const tspans = lines
              .map(
                (line, i) => `<tspan x="${tx}" dy="${i === 0 ? 0 : 18}">${exportEsc(line)}</tspan>`,
              )
              .join('');
            const clipId = `label-clip-${labels.length}`;
            // Textul mutat lângă nod trebuie exportat în poziția lui, fără decuparea la corpul nodului.
            const clip =
              n.labelWrap && !n.labelPos
                ? `<defs><clipPath id="${clipId}"><rect x="${r.x + 8}" y="${r.y + 4}" width="${Math.max(1, r.w - 16)}" height="${Math.max(1, r.h - 8)}"/></clipPath></defs>`
                : '';
            labels.push(
              `<g${transform}>${clip}<text${clip ? ` clip-path="url(#${clipId})"` : ''} x="${tx}" y="${ty}" text-anchor="${anchor}" font-family="system-ui,sans-serif" font-size="15" fill="${exportEsc(n.textColor || '#29354d')}">${tspans}</text></g>`,
            );
            for (const name of cardinalPortNames(n)) {
              const p = portPointForNode(n, name);
              ports.push(
                `<rect x="${p.x - 4}" y="${p.y - 4}" width="8" height="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>`,
              );
            }
          }
          for (const e of edges) {
            const a = el(e.from),
              b = el(e.to);
            if ((!a && !e.fromPoint) || (!b && !e.toPoint)) continue;
            let fromPort = e.fromPort,
              toPort = e.toPort;
            if ((a && !hasPort(a, fromPort)) || (b && !hasPort(b, toPort))) {
              const auto = a && b ? autoPorts(a, b, rects) : ['e', 'w'];
              if (a && !hasPort(a, fromPort)) fromPort = auto[0];
              if (b && !hasPort(b, toPort)) toPort = auto[1];
            }
            const p = a ? portPointForNode(a, fromPort) : e.fromPoint,
              q = b ? portPointForNode(b, toPort) : e.toPoint;
            if (!p || !q) continue;
            let points;
            if (Array.isArray(e.waypoints) || e.waypoint) points = [p, ...edgeWaypoints(e), q];
            else if (directRoute(e, p, q)) points = [p, q];
            else if (e.waypoint) points = waypointRoute(p, e.waypoint, q);
            else if (a && b) {
              const sideA = portSide(fromPort, nodeCenter(a), nodeCenter(b), a),
                sideB = portSide(toPort, nodeCenter(b), nodeCenter(a), b);
              points = routePath(p, q, sideA, sideB, a.id, b.id, rects);
            } else points = [p, q];
            const path = routeSvg(points, []),
              dash =
                (e.lineStyle || (e.dashed ? 'dashed' : 'solid')) === 'dotted'
                  ? '2 6'
                  : (e.lineStyle || (e.dashed ? 'dashed' : 'solid')) === 'dashed'
                    ? '8 6'
                    : '';
            edgeShapes.push(
              `<path d="${path}" fill="none" stroke="${exportEsc(e.color || '#52617a')}" stroke-width="2.4" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`,
            );
            for (const d of edgeArrowPaths(e, points))
              edgeShapes.push(`<path d="${d}" fill="${exportEsc(e.color || '#52617a')}"/>`);
            if (e.label) {
              const mid = edgeLabelPoint(e, points);
              edgeShapes.push(
                `<text x="${mid.x}" y="${mid.y}" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="${exportEsc(e.labelColor || '#29354d')}" paint-order="stroke" stroke="#fff" stroke-width="6" stroke-linejoin="round">${exportEsc(e.label)}</text>`,
              );
            }
          }
          const outputW = Math.ceil(w * factor),
            outputH = Math.ceil(h * factor);
          return {
            svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${outputW}" height="${outputH}" viewBox="${left} ${top} ${w} ${h}"><rect x="${left}" y="${top}" width="${w}" height="${h}" fill="#fff"/>${shapes.join('')}${edgeShapes.join('')}${labels.join('')}${ports.join('')}</svg>`,
            width: outputW,
            height: outputH,
            factor,
          };
        }

        /**
         * Generează și descarcă SVG-ul la factorul de export ales de utilizator.
         */
        function exportDiagramSvg() {
          const data = exportSvgDocument(exportZoomFactor());
          if (data)
            download(
              data.svg,
              `${diagramExportStem()}-${Math.round(data.factor * 100)}pct.svg`,
              'image/svg+xml;charset=utf-8',
            );
        }

        /**
         * Rasterizează SVG-ul într-un PNG sau JPG, limitează dimensiunea imaginii și eliberează URL-urile temporare.
         */
        async function exportDiagramRaster(format) {
          const exportName = diagramExportStem(),
            data = exportSvgDocument(exportZoomFactor());
          if (!data) return;
          if (data.width > 16384 || data.height > 16384 || data.width * data.height > 100000000) {
            toast('Rezoluția este prea mare; alege un zoom mai mic');
            return;
          }
          const url = URL.createObjectURL(
            new Blob([data.svg], { type: 'image/svg+xml;charset=utf-8' }),
          );
          try {
            const image = new Image();
            image.src = url;
            await image.decode();
            const canvasOut = document.createElement('canvas');
            canvasOut.width = data.width;
            canvasOut.height = data.height;
            const ctx = canvasOut.getContext('2d');
            if (format === 'jpg') {
              ctx.fillStyle = '#fff';
              ctx.fillRect(0, 0, data.width, data.height);
            }
            ctx.drawImage(image, 0, 0, data.width, data.height);
            const blob = await new Promise(
              /**
               * Leagă evenimentele și rezolvarea rezultatului asincron pentru exportDiagramRaster.
               */
              (resolve) =>
                canvasOut.toBlob(resolve, format === 'jpg' ? 'image/jpeg' : 'image/png', 0.94),
            );
            if (!blob) throw new Error('Nu s-a putut crea imaginea');
            const linkUrl = URL.createObjectURL(blob),
              a = document.createElement('a');
            a.href = linkUrl;
            a.download = `${exportName}-${Math.round(data.factor * 100)}pct.${format}`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(linkUrl), 1000);
          } catch (error) {
            toast(`Exportul ${format.toUpperCase()} a eșuat`);
          } finally {
            URL.revokeObjectURL(url);
          }
        }
        defineAction('exportDiagramSvg', exportDiagramSvg);
        defineAction('exportDiagramPng', () => exportDiagramRaster('png'));
        defineAction('exportDiagramJpg', () => exportDiagramRaster('jpg'));

        /**
         * Înlocuiește ID-urile modelului cu identificatori generați local și deleagă serializarea Mermaid fără a modifica diagrama.
         */
        function mermaid() {
          const identifiers = new Map(nodes.map((node, index) => [node.id, 'node' + index]));
          const safeNodes = nodes.map((node) => ({ ...node, id: identifiers.get(node.id) }));
          const safeEdges = edges.map((edge, index) => ({
            ...edge,
            id: 'edge' + index,
            from: identifiers.get(edge.from),
            to: identifiers.get(edge.to),
          }));
          return renderMermaid(safeNodes, safeEdges);
        }

        /**
         * Serializează nodurile și conexiunile în sintaxa Mermaid folosind texte escapate și stiluri acceptate explicit.
         */
        function renderMermaid(nodes, edges) {
          const lines = ['flowchart TB'];
          nodes.forEach((n) => lines.push(`  ${n.id}["${esc(n.label || ' ')}"]`));
          edges.forEach((e) => {
            const from = e.from || `${e.id}_start`,
              to = e.to || `${e.id}_end`;
            if (!e.from) lines.push(`  ${from}[" "]`);
            if (!e.to) lines.push(`  ${to}[" "]`);
            lines.push(`  ${from} ---${e.label ? `|"${esc(e.label)}"|` : ''} ${to}`);
          });
          nodes.forEach((n) => {
            const styles = [];
            if (n.fill === 'transparent' || /^#[0-9a-f]{6}$/i.test(n.fill || ''))
              styles.push(`fill:${n.fill}`);
            if (n.stroke === 'transparent' || /^#[0-9a-f]{6}$/i.test(n.stroke || ''))
              styles.push(`stroke:${n.stroke}`);
            if (/^#[0-9a-f]{6}$/i.test(n.textColor || '')) styles.push(`color:${n.textColor}`);
            if (n.borderStyle === 'dashed') styles.push('stroke-dasharray:8 6');
            else if (n.borderStyle === 'dotted') styles.push('stroke-dasharray:2 5');
            if (styles.length) lines.push(`  style ${n.id} ${styles.join(',')}`);
          });
          edges.forEach((e, i) => {
            const styles = [];
            if (/^#[0-9a-f]{6}$/i.test(e.color || '')) styles.push(`stroke:${e.color}`);
            if (/^#[0-9a-f]{6}$/i.test(e.labelColor || '')) styles.push(`color:${e.labelColor}`);
            const kind = e.lineStyle || (e.dashed ? 'dashed' : 'solid');
            if (kind === 'dashed') styles.push('stroke-dasharray:8 6');
            else if (kind === 'dotted') styles.push('stroke-dasharray:2 6');
            if (styles.length) lines.push(`  linkStyle ${i} ${styles.join(',')}`);
          });
          return lines.join('\n') + '\n';
        }

        /**
         * Escapează textul destinat etichetelor Mermaid pentru a evita ieșirea din etichetă și injectarea de instrucțiuni.
         */
        function esc(value) {
          return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll('|', '&#124;')
            .replaceAll('\\', '&#92;')
            .replace(/\r\n?|\n/g, '<br/>');
        }

        defineAction('exportMermaid', () =>
          download(mermaid(), `${diagramExportStem()}.mmd`, 'text/plain'),
        );
        bindAction('mermaid', 'exportMermaid');
        /**
         * Creează un Blob local, declanșează descărcarea prin browser și revocă URL-ul temporar; nu trimite date unui server.
         */
        function download(data, name, type) {
          const a = document.createElement('a'),
            u = URL.createObjectURL(new Blob([data], { type }));
          a.href = u;
          a.download = name;
          a.click();
          setTimeout(() => URL.revokeObjectURL(u), 1000);
        }
        defineAction('openImportPicker', () => $('#import')?.click());

        /**
         * Verifică dimensiunea și tipul fișierului ales, încarcă JSON-ul valid și păstrează diagrama curentă dacă validarea eșuează.
         */
        async function importDiagramFile(file, input) {
          if (!file) return false;
          try {
            if (file.size > IMPORT_LIMITS.bytes) {
              toast('Fișierul depășește limita de 10 MiB');
              return false;
            }
            if (file.name.endsWith('.mmd')) {
              toast('Importul Mermaid nu este disponibil; folosește fișierul nativ.');
              return false;
            }
            const ok = loadState(await file.text());
            if (ok) {
              history = [snapshot()];
              future = [];
              toast('Diagramă importată');
            } else toast('Fișier invalid sau limite de import depășite');
            return ok;
          } catch {
            toast('Fișierul nu a putut fi citit');
            return false;
          } finally {
            if (input) input.value = '';
          }
        }
        defineAction('importDiagramFile', importDiagramFile);
        $('#import')?.addEventListener('change', (e) =>
          runAction('importDiagramFile', e.target.files[0], e.target),
        );
        window.addEventListener('copy', (event) => {
          if (
            !selectedNodes.size ||
            event.target?.isContentEditable ||
            /^(INPUT|TEXTAREA|SELECT)$/.test(event.target?.tagName || '')
          )
            return;
          const data = selectedDiagramData();
          if (!data) return;
          clipboard = { nodes: data.nodes, edges: data.edges, geometry: data.geometry };
          pasteCount = 0;
          if (event.clipboardData) {
            event.clipboardData.setData('text/plain', JSON.stringify(data, null, 2));
            event.preventDefault();
          }
        });
        window.addEventListener('paste', (event) => {
          if (
            event.target?.isContentEditable ||
            /^(INPUT|TEXTAREA|SELECT)$/.test(event.target?.tagName || '')
          )
            return;
          const text = event.clipboardData?.getData('text/plain');
          if (!text) return;
          let data;
          try {
            if (text.length <= IMPORT_LIMITS.bytes) data = JSON.parse(text);
          } catch {}
          if (pasteDiagramData(data)) {
            event.preventDefault();
            return;
          }
          if (clipboard?.nodes.length) {
            event.preventDefault();
            pasteInternalSelection();
          }
        });
        defineAction(
          'togglePresentation',
          /**
           * Comută modul de prezentare și ascunde sau restaurează comenzile editorului.
           */
          () => {
            document.body.classList.toggle('presentation');
            const active = document.body.classList.contains('presentation'),
              button = $('#present');
            if (button) {
              button.textContent = active ? 'Ieși' : 'Prez.';
              button.title = active ? 'Ieși din modul prezentare' : 'Mod prezentare';
            }
          },
        );
        bindAction('present', 'togglePresentation');
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            $('#colorPopover').hidden = true;
            if (menuPanel) menuPanel.hidden = true;
            const hadSelection = selected !== null || selectedNodes.size > 0;
            selected = null;
            selectedNodes.clear();
            connectMode = false;
            $('#connect')?.classList.remove('active');
            document.body.classList.remove('presentation');
            if (hadSelection) {
              refreshNodeSelection();
              drawEdges();
            }
            renderPorts();
          }
          if (e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))
            return;
          const directions = {
            ArrowLeft: [1, 0],
            ArrowRight: [-1, 0],
            ArrowUp: [0, 1],
            ArrowDown: [0, -1],
          };
          if (directions[e.key] && selectedNodes.size === 0) {
            e.preventDefault();
            const [dx, dy] = directions[e.key],
              step = e.shiftKey ? 100 : 40;
            pan = { x: pan.x + dx * step, y: pan.y + dy * step };
            applyView();
            return;
          }
          const key = e.key.toLowerCase();
          if ((e.ctrlKey || e.metaKey) && key === 'a') {
            e.preventDefault();
            runAction('selectAllNodes');
          } else if ((e.ctrlKey || e.metaKey) && key === 'z') {
            e.preventDefault();
            runAction(e.shiftKey ? 'redo' : 'undo');
          } else if ((e.ctrlKey || e.metaKey) && key === 'y') {
            e.preventDefault();
            runAction('redo');
          } else if (e.key === 'F2') runAction('editSelectedText');
          else if (e.key === 'Delete' || e.key === 'Backspace') {
            if (selected && selectedEdgeEnd !== null) return;
            if (selected && selectedEdgePoint !== null) runAction('removeEdgePoint');
            else runAction('deleteSelection');
          }
        });
        window.addEventListener('resize', () => render());

        // --- Biblioteca locală ----------------------------------------------------------
        // Fiecare diagramă are o cheie independentă; catalogul reține numele, ID-urile și datele.
        const CATALOG_KEY = 'els:catalog',
          ACTIVE_KEY = 'els:active',
          DIAGRAM_PREFIX = 'els:diagram:';

        // ============================================================================
        // 16. Biblioteca locală și persistența în browser
        // ============================================================================

        /**
         * Citește o valoare din localStorage; întoarce null dacă browserul refuză accesul.
         */
        function storageGet(key) {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        }

        /**
         * Scrie în localStorage și semnalează imposibilitatea salvării, inclusiv depășirea cotei browserului.
         */
        function storageSet(key, value) {
          try {
            localStorage.setItem(key, value);
            return true;
          } catch {
            toast('Stocarea locală nu este disponibilă; folosește Export');
            return false;
          }
        }

        /**
         * Șterge cheia indicată din localStorage și tolerează refuzul accesului la stocare.
         */
        function storageRemove(key) {
          try {
            localStorage.removeItem(key);
          } catch {}
        }

        /**
         * Citește catalogul local, elimină intrările invalide sau duplicate și normalizează data; revine la o listă goală dacă JSON-ul este corupt.
         */
        function readCatalog() {
          try {
            const value = JSON.parse(storageGet(CATALOG_KEY) || '[]');
            if (!Array.isArray(value)) return [];
            const result = [],
              seen = new Set();
            for (const item of value) {
              if (
                !item ||
                typeof item !== 'object' ||
                Array.isArray(item) ||
                typeof item.id !== 'string' ||
                !/^[A-Za-z0-9_.:-]{1,160}$/.test(item.id) ||
                seen.has(item.id) ||
                typeof item.name !== 'string' ||
                item.name.length > IMPORT_LIMITS.text
              )
                continue;
              seen.add(item.id);
              result.push({
                id: item.id,
                name: item.name,
                updated: Number.isFinite(item.updated) ? item.updated : 0,
              });
            }
            return result;
          } catch {
            return [];
          }
        }

        /**
         * Serializează lista diagramelor și o salvează în cheia catalogului local.
         */
        function writeCatalog(items) {
          storageSet(CATALOG_KEY, JSON.stringify(items));
        }

        /**
         * Generează un identificator local de diagramă din timp și un sufix aleator; nu este un token de autentificare.
         */
        function newDiagramId() {
          return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        /**
         * Formatează data locală ca YYYY-MM-DD_HHmmss, potrivită și pentru numele fișierelor.
         */
        function diagramTimestamp(date = new Date()) {
          const pad =
            /**
             * Completează o componentă numerică a datei cu zero la stânga.
             */
            (value) => String(value).padStart(2, '0');
          return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
        }

        /**
         * Generează un nume dată-oră disponibil în bibliotecă și adaugă un sufix dacă numele există deja.
         */
        function defaultDiagramName() {
          const base = diagramTimestamp(),
            names = new Set(readCatalog().map((item) => item.name));
          let name = base,
            index = 2;
          while (names.has(name)) name = `${base}_${String(index++).padStart(2, '0')}`;
          return name;
        }

        /**
         * Transformă numele diagramei într-un nume de fișier fără caractere interzise sau nume rezervate Windows.
         */
        function diagramExportStem() {
          const name =
            readCatalog().find((item) => item.id === activeDiagramId)?.name || diagramTimestamp();
          let safe = String(name)
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^\x20-\x7e]|[<>:"/\\|?*+]/g, '_')
            .replace(/\s+/g, '_')
            .replace(/^[. ]+|[. ]+$/g, '')
            .slice(0, 120)
            .replace(/[. ]+$/g, '');
          if (!safe || /^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(safe))
            safe = diagramTimestamp();
          return safe;
        }

        /**
         * Salvează modelul și vederea diagramei active, actualizează data catalogului și reface lista locală.
         */
        function saveActiveDiagram() {
          if (!activeDiagramId) return;
          const data = JSON.stringify({
            nodes,
            edges,
            serial,
            pan,
            scale,
            geometry: gridMetadata(),
          });
          if (!storageSet(DIAGRAM_PREFIX + activeDiagramId, data)) return;
          const items = readCatalog(),
            entry = items.find((item) => item.id === activeDiagramId);
          if (entry) entry.updated = Date.now();
          else items.push({ id: activeDiagramId, name: defaultDiagramName(), updated: Date.now() });
          writeCatalog(items);
          renderSavedList();
        }

        /**
         * Golește modelul și selecția și readuce vederea la starea inițială înainte de crearea unei diagrame.
         */
        function resetBoard() {
          nodes = [];
          edges = [];
          serial = 1;
          selected = null;
          selectedNodes.clear();
          drag = null;
          pan = { x: 0, y: 0 };
          scale = 1;
          updateZoomReadout();
          geometryVersion++;
          nodeSizes.clear();
          naturalSizes.clear();
          routeCache.clear();
          history = [snapshot()];
          future = [];
          world.style.transform = `translate(${pan.x}px,${pan.y}px) scale(${scale})`;
          clearTimeout(viewportTimer);
          render();
        }

        /**
         * Salvează diagrama precedentă și creează o nouă intrare locală cu o planșă goală.
         */
        function createDiagram(name) {
          name = String(name ?? '').trim() || defaultDiagramName();
          clearTimeout(saveTimer);
          saveActiveDiagram();
          activeDiagramId = newDiagramId();
          const items = readCatalog();
          items.push({ id: activeDiagramId, name, updated: Date.now() });
          writeCatalog(items);
          storageSet(ACTIVE_KEY, activeDiagramId);
          resetBoard();
          saveActiveDiagram();
          renderSavedList();
        }
        defineAction('createDiagram', createDiagram);

        /**
         * Creează o diagramă nouă cu o copie a modelului și vederii curente, păstrând originalul.
         */
        function saveDiagramCopy(name) {
          saveActiveDiagram();
          const data = JSON.stringify({
            nodes,
            edges,
            serial,
            pan,
            scale,
            geometry: gridMetadata(),
          });
          createDiagram(String(name ?? '').trim() || defaultDiagramName());
          loadState(data);
          history = [snapshot()];
          saveActiveDiagram();
        }

        /**
         * Salvează diagrama activă și încarcă intrarea locală indicată, dacă datele ei sunt disponibile.
         */
        function switchDiagram(id) {
          if (id === activeDiagramId) return;
          const data = storageGet(DIAGRAM_PREFIX + id);
          if (!data) {
            toast('Diagrama nu mai există în stocarea locală');
            return;
          }
          clearTimeout(saveTimer);
          saveActiveDiagram();
          let valid = false;
          try {
            const parsed = JSON.parse(data);
            valid = Array.isArray(parsed.nodes) && Array.isArray(parsed.edges);
          } catch {}
          if (!valid) {
            toast('Diagrama salvată este invalidă');
            return;
          }
          // Păstrează identitatea diagramei active până la acceptarea integrală a noului model.
          if (!loadState(data)) {
            toast('Diagrama salvată este invalidă');
            return;
          }
          activeDiagramId = id;
          storageSet(ACTIVE_KEY, id);
          history = [snapshot()];
          future = [];
          renderSavedList();
        }
        defineAction('switchDiagram', switchDiagram);

        /**
         * Cere un nume nou prin dialog și actualizează numai intrarea din catalogul local.
         */
        async function renameDiagram(id) {
          const items = readCatalog(),
            entry = items.find((item) => item.id === id);
          if (!entry) return;
          const name = (
            await appDialog({
              title: 'Redenumește diagrama',
              message: 'Alege numele afișat în lista diagramelor.',
              value: entry.name,
              confirmLabel: 'Salvează',
            })
          )?.trim();
          if (!name) return;
          entry.name = name;
          writeCatalog(items);
          renderSavedList();
        }
        defineAction('renameDiagram', renameDiagram);

        /**
         * Cere confirmare, șterge diagrama și deschide o altă intrare sau creează o planșă goală.
         */
        async function deleteDiagram(id) {
          const items = readCatalog(),
            entry = items.find((item) => item.id === id);
          if (!entry) return;
          if (
            !(await appDialog({
              title: 'Șterge diagrama?',
              message: `Diagrama „${entry.name}” și conținutul ei vor fi șterse.`,
              confirmLabel: 'Șterge',
              danger: true,
            }))
          )
            return;
          clearTimeout(saveTimer);
          storageRemove(DIAGRAM_PREFIX + id);
          const remaining = items.filter((item) => item.id !== id);
          writeCatalog(remaining);
          if (id === activeDiagramId) {
            activeDiagramId = null;
            if (remaining.length) {
              const next = remaining[0];
              activeDiagramId = next.id;
              storageSet(ACTIVE_KEY, next.id);
              loadState(storageGet(DIAGRAM_PREFIX + next.id));
              history = [snapshot()];
              future = [];
            } else createDiagram();
          }
          renderSavedList();
        }
        defineAction('deleteDiagram', deleteDiagram);

          const previousStep = gridSettings.step;
          gridSettings.snap = menuPanel.querySelector('#gridSnap').checked;
          gridSettings.visible = menuPanel.querySelector('#gridVisible').checked;
          gridSettings.step = Math.max(

          menuPanel.querySelector('#gridOpacityValue').textContent = `${gridSettings.opacity}%`;
          if (previousStep !== gridSettings.step) {
            normalizeGridGeometry();
            naturalSizes.clear();
            routeCache.clear();
            remember();
            render();
          }
          applyGridAppearance();
          if (save) storageSet(GRID_SETTINGS_KEY, JSON.stringify(gridSettings));

              }[key],

            else input.value = String(value);

        const TOOLBAR_PREFS_KEY = 'els:toolbar-settings-v1';

        /**
         * Citește preferințele barei de unelte, migrează structurile vechi și completează valorile implicite necesare.
         */
        function readToolbarSettings() {
          let saved = {};
          try {
            saved = JSON.parse(storageGet(TOOLBAR_PREFS_KEY) || '{}');
          } catch {}
          const validIds = new Set(TOOLBAR_ITEMS.map((item) => item.id)),
            used = new Set(),
            groups = [];
          const oldDefaultLayout =
            Array.isArray(saved.groups) &&
            saved.groups.length === 3 &&
            saved.groups.some((group) => group.id === 'main') &&
            saved.groups.some((group) => group.id === 'files') &&
            saved.groups.some((group) => group.id === 'zoom');
          if (Array.isArray(saved.groups) && !oldDefaultLayout)
            for (const source of saved.groups) {
              if (!source || typeof source !== 'object') continue;
              const id = String(source.id || '').slice(0, 40);
              if (!id || groups.some((group) => group.id === id)) continue;
              const items = Array.isArray(source.items)
                ? source.items.filter((itemId) => validIds.has(itemId) && !used.has(itemId))
                : [];
              items.forEach((itemId) => used.add(itemId));
              groups.push({
                id,
                name: String(source.name || 'Grup').slice(0, 32),
                gapAfter: Math.max(0, Math.min(56, Number(source.gapAfter) || 0)),
                side: source.side === 'right' ? 'right' : 'left',
                items,
              });
            }
          if (!groups.length) {
            const oldOrder = Array.isArray(saved.order) ? saved.order : [];
            for (const template of DEFAULT_TOOLBAR_GROUPS) {
              const items = template.items.filter((id) => validIds.has(id) && !used.has(id));
              items.forEach((id) => used.add(id));
              groups.push({ ...template, items });
            }
            for (const id of oldOrder)
              if (validIds.has(id) && !used.has(id)) {
                groups[0].items.push(id);
                used.add(id);
              }
          }
          if (!groups.length)
            groups.push({ id: 'main', name: 'Instrumente', gapAfter: 0, items: [] });
          if (!groups.some((group) => group.id === 'history'))
            groups.unshift({ id: 'history', name: 'Istoric', gapAfter: 14, items: [] });
          if (!used.has('portCounts')) {
            groups.push({
              id: 'ports',
              name: 'Porturi cardinale',
              gapAfter: 0,
              side: 'right',
              items: ['portCounts'],
            });
            used.add('portCounts');
          }
          const historyGroup = groups.find((group) => group.id === 'history');
          for (const item of TOOLBAR_ITEMS)
            if (!used.has(item.id)) {
              const preferredGroup = ['add', 'addFrame', 'multiSelect', 'selectAll'].includes(
                item.id,
              )
                ? 'nodes'
                : item.id === 'nodeStyle'
                  ? 'editing'
                  : item.id === 'edgeStyle'
                    ? 'linkStyle'
                    : null;
              const target =
                (preferredGroup && groups.find((group) => group.id === preferredGroup)) ||
                (item.id === 'edgeStyle' && groups.find((group) => group.id === 'links')) ||
                (item.id === 'undo' || item.id === 'redo' ? historyGroup : groups[0]);
              target.items.push(item.id);
            }
          const enabled = {};
          for (const item of TOOLBAR_ITEMS)
            enabled[item.id] =
              typeof saved.enabled?.[item.id] === 'boolean' ? saved.enabled[item.id] : item.enabled;
          if (!saved.zoomControlsDefaulted) {
            let zoomGroup =
              groups.find((group) => group.id === 'zoom') ||
              groups.find((group) =>
                group.items.some((id) => ['zoomOut', 'zoomReset', 'zoomIn'].includes(id)),
              );
            if (!zoomGroup) {
              zoomGroup = { id: 'zoom', name: 'Zoom', gapAfter: 0, side: 'right', items: [] };
              groups.push(zoomGroup);
            }
            for (const group of groups)
              if (group !== zoomGroup)
                group.items = group.items.filter(
                  (id) => !['zoomOut', 'zoomReset', 'zoomIn'].includes(id),
                );
            zoomGroup.items = [
              ...zoomGroup.items.filter((id) => id === 'fit'),
              'zoomOut',
              'zoomReset',
              'zoomIn',
            ];
            zoomGroup.side = 'right';
            groups.splice(groups.indexOf(zoomGroup), 1);
            groups.push(zoomGroup);
            for (const id of ['zoomOut', 'zoomReset', 'zoomIn']) enabled[id] = true;
          }
          if (!saved.styleItemsDefaulted) {
            enabled.nodeStyle = true;
            enabled.edgeStyle = true;
          }
          if (!saved.editLabelDefaulted) enabled.editLabel = true;
          if (!saved.portsBeforeZoomDefaulted) {
            let portsGroup =
              groups.find((group) => group.id === 'ports') ||
              groups.find((group) => group.items.includes('portCounts'));
            let zoomGroup = groups.find((group) => group.id === 'zoom');
            if (!portsGroup) {
              portsGroup = {
                id: 'ports',
                name: 'Porturi cardinale',
                gapAfter: 0,
                side: 'right',
                items: [],
              };
              groups.push(portsGroup);
            }
            if (!zoomGroup) {
              zoomGroup = { id: 'zoom', name: 'Zoom', gapAfter: 0, side: 'right', items: [] };
              groups.push(zoomGroup);
            }
            for (const group of groups) {
              if (group !== portsGroup)
                group.items = group.items.filter((id) => id !== 'portCounts');
              if (group !== zoomGroup)
                group.items = group.items.filter(
                  (id) => !['zoomOut', 'zoomReset', 'zoomIn', 'fit'].includes(id),
                );
            }
            if (!portsGroup.items.includes('portCounts')) portsGroup.items.unshift('portCounts');
            zoomGroup.items = ['zoomOut', 'zoomReset', 'zoomIn', 'fit'].filter((id) =>
              validIds.has(id),
            );
            portsGroup.side = 'right';
            zoomGroup.side = 'right';
            groups.splice(groups.indexOf(portsGroup), 1);
            groups.splice(groups.indexOf(zoomGroup), 0, portsGroup);
          }
          return {
            groups,
            enabled,
            styleItemsDefaulted: true,
            editLabelDefaulted: true,
            portsBeforeZoomDefaulted: true,
            zoomControlsDefaulted: true,
            brandGap: Math.max(0, Math.min(56, Number(saved.brandGap ?? 22) || 0)),
            versionGap: Math.max(0, Math.min(32, Number(saved.versionGap ?? 5) || 0)),
          };
        }
        let toolbarSettings = readToolbarSettings();

        /**
         * Persistă preferințele barei de unelte în stocarea locală a browserului.

        function saveToolbarSettings() {
          storageSet(TOOLBAR_PREFS_KEY, JSON.stringify(toolbarSettings));
