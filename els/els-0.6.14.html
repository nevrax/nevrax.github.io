                /**
                 * Continuă operația după rezolvarea promisiunii în copySelection.
                 */
                () =>
                  toast(
                    data.nodes.length === 1 ? 'Nod copiat ca JSON ELS' : 'Grup copiat ca JSON ELS',
                  ),
              )
              .catch(
                /**
                 * Tratează eșecul operației asincrone în copySelection.
                 */
                () => toast('Selecția este copiată intern; Ctrl+C copiază JSON-ul în clipboard'),
              );
          else toast(data.nodes.length === 1 ? 'Nod copiat' : 'Grup copiat');
        }

        /**
         * Validează datele lipite, adaptează sloturile la grila curentă, alocă ID-uri noi și inserează o copie deplasată a selecției.
         */
        function pasteDiagramData(data) {
          try {
            data = decodeCellDiagram(data);
          } catch {
            return false;
          }
          if (data.geometry && data.geometry.cell !== gridSettings.step) {
            const ratio = data.geometry.cell / gridSettings.step;
            for (const n of data.nodes)
              if (n.portSlots)
                for (const key of Object.keys(n.portSlots))
                  n.portSlots[key] = Math.round(n.portSlots[key] * ratio);
          }
          if (
            !data ||
            data.format !== 'els' ||
            !Array.isArray(data.nodes) ||
            !Array.isArray(data.edges) ||
            !data.nodes.length ||
            nodes.length + data.nodes.length > IMPORT_LIMITS.nodes ||
            edges.length + data.edges.length > IMPORT_LIMITS.edges
          )
            return false;
          const sourceIds = new Set(data.nodes.map((n) => n?.id).filter((id) => id != null));
          if (
            sourceIds.size !== data.nodes.length ||
            data.nodes.some(
              (n) => !n || typeof n !== 'object' || !Number.isFinite(n.x) || !Number.isFinite(n.y),
            )
          )
            return false;
          const idMap = new Map(data.nodes.map((n) => [n.id, uid()]));
          pasteCount++;
          const offset = (gridSettings.snap ? 2 * gridSettings.step : 28) * pasteCount,
            copies = data.nodes.map((n) => {
              const copy = { ...n, id: idMap.get(n.id), x: n.x + offset, y: n.y + offset };
              if (n.parent) {
                if (idMap.has(n.parent)) copy.parent = idMap.get(n.parent);
                else delete copy.parent;
              }
              return copy;
            }),
            links = data.edges
              .filter((e) => e && sourceIds.has(e.from) && sourceIds.has(e.to))
              .map((e) => ({
                ...e,
                id: 'e' + Date.now() + Math.random().toString(16).slice(2, 8),
                from: idMap.get(e.from),
                to: idMap.get(e.to),
                ...(e.waypoint
                  ? {
                      waypoint: {
                        ...e.waypoint,
                        x: e.waypoint.x + offset,
                        y: e.waypoint.y + offset,
                      },
                    }
                  : {}),
              }));
          const syncIds = new Map();
          for (const n of copies)
            if (n.sync) {
              if (!syncIds.has(n.sync.id)) syncIds.set(n.sync.id, 'sync-' + crypto.randomUUID());
              n.sync = structuredClone(n.sync);
              n.sync.id = syncIds.get(n.sync.id);
            }
          for (const e of links)
            if (e.waypoints)
              e.waypoints = e.waypoints.map((p) => ({ x: p.x + offset, y: p.y + offset }));
          nodes.push(...copies);
          edges.push(...links);
          selected = null;
          selectedNodes = new Set(copies.map((n) => n.id));
          geometryVersion++;
          normalizeHierarchy();
          remember();
          render();
          toast(copies.length === 1 ? 'Nod ELS lipit' : 'Diagramă ELS lipită');
          return true;
        }

        /**
         * Inserează copia păstrată în memoria editorului dacă există o selecție copiată anterior.
         */
        function pasteInternalSelection() {
          if (!clipboard?.nodes.length) {
            toast('Clipboard-ul nu conține JSON ELS sau o selecție copiată');
            return false;
          }
          return pasteDiagramData({ format: 'els', version: 1, ...clipboard });
        }

        /**
         * Încearcă să citească JSON ELS din clipboard-ul sistemului și revine la copia internă când citirea sau importul nu reușesc.
         */
        async function pasteSelection() {
          try {
            const text = await navigator.clipboard?.readText();
            if (text && text.length <= IMPORT_LIMITS.bytes) {
              let data;
              try {
                data = JSON.parse(text);
              } catch {}
              if (pasteDiagramData(data)) return;
            }
          } catch {}
          pasteInternalSelection();
        }

        // ============================================================================
        // 04. Geometrie, coordonate și indexare spațială
        // ============================================================================

        /**
         * Calculează centrul geometric al nodului din poziția și dimensiunile sale curente.
         */
        function nodeCenter(n) {
          const size = dimensions(n);
          return { x: n.x + size.w / 2, y: n.y + size.h / 2 };
        }

        /**
         * Returnează dimensiunile măsurate ale nodului sau valorile explicite/implicite dacă măsurarea nu este încă disponibilă.
         */
        function dimensions(n) {
          return nodeSizes.get(n.id) || { w: n.manualW || 110, h: n.manualH || 60 };
        }

        /**
         * Construiește dreptunghiul nerotit al nodului în coordonatele diagramei.
         */
        function nodeRect(n) {
          const { w, h } = dimensions(n);
          return { id: n.id, x: n.x, y: n.y, w, h, right: n.x + w, bottom: n.y + h };
        }

        /**
         * Rotește un punct în jurul unui centru cu un unghi exprimat în grade.
         */
        function rotatePoint(point, center, degrees) {
          const radians = ((Number(degrees) || 0) * Math.PI) / 180,
            cos = Math.cos(radians),
            sin = Math.sin(radians),
            x = point.x - center.x,
            y = point.y - center.y;
          return { x: center.x + x * cos - y * sin, y: center.y + x * sin + y * cos };
        }

        /**
         * Calculează dreptunghiul care încadrează vizual un nod rotit la dimensiunile date.
         */
        function nodeVisualRectForSize(n, size) {
          const rect = { x: n.x, y: n.y, right: n.x + size.w, bottom: n.y + size.h },
            center = { x: n.x + size.w / 2, y: n.y + size.h / 2 },
            corners = [
              { x: rect.x, y: rect.y },
              { x: rect.right, y: rect.y },
              { x: rect.right, y: rect.bottom },
              { x: rect.x, y: rect.bottom },
            ].map((point) => rotatePoint(point, center, n.rotation)),
            xs = corners.map((point) => point.x),
            ys = corners.map((point) => point.y),
            x = Math.min(...xs),
            y = Math.min(...ys),
            right = Math.max(...xs),
            bottom = Math.max(...ys);
          return { id: n.id, x, y, w: right - x, h: bottom - y, right, bottom };
        }

        /**
         * Returnează încadrarea vizuală a nodului folosind dimensiunile sale curente.
         */
        function nodeVisualRect(n) {
          return nodeVisualRectForSize(n, dimensions(n));
        }

        /**
         * Transformă un punct al planșei în coordonatele locale ale nodului, compensând rotația.
         */
        function nodeWorldToLocal(n, point) {
          const rect = nodeRect(n),
            center = nodeCenter(n),
            unrotated = rotatePoint(point, center, -(Number(n.rotation) || 0));
          return { x: unrotated.x - rect.x, y: unrotated.y - rect.y };
        }

        /**
         * Verifică dacă un dreptunghi are coordonate finite și dimensiuni utilizabile pentru randare.
         */
        function usableRect(rect) {
          return [rect.x, rect.y, rect.w, rect.h, rect.right, rect.bottom].every(
            (value) => Number.isFinite(value) && Math.abs(value) < MAX_WORLD_COORD,
          );
        }

        /**
         * Transformă fereastra vizibilă a planșei într-un dreptunghi în coordonatele diagramei, cu marginea suplimentară cerută.
         */
        function visibleBounds(extra = VIEW_MARGIN) {
          return {
            x: (-pan.x - extra) / scale,
            y: (-pan.y - extra) / scale,
            right: (canvas.clientWidth - pan.x + extra) / scale,
            bottom: (canvas.clientHeight - pan.y + extra) / scale,
          };
        }

        /**
         * Verifică dacă două dreptunghiuri se intersectează pentru selecție sau limitarea randării la zona vizibilă.
         */
        function overlaps(a, b) {
          return a.right >= b.x && a.x <= b.right && a.bottom >= b.y && a.y <= b.bottom;
        }
        // Parcurgerea grilei are o limită: diagramele importate pot conține valori enorme pentru
        // containere, coordonate sau puncte de traseu. Aceste obiecte folosesc o căutare limitată.

        /**
         * Determină celulele indexului spațial acoperite de un dreptunghi.
         */
        function gridRange(rect, step, maxCells) {
          const cells = [
            Math.floor(rect.x / step),
            Math.floor(rect.right / step),
            Math.floor(rect.y / step),
            Math.floor(rect.bottom / step),
          ];
          if (!cells.every(Number.isSafeInteger)) return null;
          const [x0, x1, y0, y1] = cells,
            width = x1 - x0 + 1,
            height = y1 - y0 + 1;
          if (
            width < 1 ||
            height < 1 ||
            width > maxCells ||
            height > maxCells ||
            width * height > maxCells
          )
            return null;
          return { x0, x1, y0, y1 };
        }

        /**
         * Returnează nodurile care intersectează zona vizibilă, folosind un index spațial și o listă separată pentru containere mari.
         */
        function visibleNodes(bounds) {
          const step = 500;
          if (viewIndexVersion !== geometryVersion) {
            viewCells.clear();
            viewWide = [];
            for (const node of nodes) {
              const rect = nodeVisualRect(node);
              if (!usableRect(rect)) continue;
              const range = gridRange(rect, step, 16);
              if (!range) {
                viewWide.push(node);
                continue;
              }
              for (let x = range.x0; x <= range.x1; x++)
                for (let y = range.y0; y <= range.y1; y++) {
                  const key = `${x}:${y}`;
                  if (!viewCells.has(key)) viewCells.set(key, []);
                  viewCells.get(key).push(node);
                }
            }
            viewIndexVersion = geometryVersion;
          }
          const range = gridRange(bounds, step, 2000);
          const candidates = new Map(
            (range ? viewWide : nodes.filter((n) => usableRect(nodeVisualRect(n)))).map((n) => [
              n.id,
              n,
            ]),
          );
          if (range)
            for (let x = range.x0; x <= range.x1; x++)
              for (let y = range.y0; y <= range.y1; y++) {
                for (const node of viewCells.get(`${x}:${y}`) || []) candidates.set(node.id, node);
              }
          const movingIds = new Set(drag?.affected || []);
          if (drag?.id && ['node', 'resize', 'rotate'].includes(drag.kind)) movingIds.add(drag.id);
          for (const id of movingIds) {
            const moving = el(id);
            if (moving && usableRect(nodeVisualRect(moving))) candidates.set(moving.id, moving);
          }
          return [...candidates.values()].filter(
            (n) =>
              usableRect(nodeVisualRect(n)) &&
              (overlaps(nodeVisualRect(n), bounds) || movingIds.has(n.id)),
          );
        }

        /**
         * Calculează încadrarea geometrică aproximativă a unei conexiuni pentru indexarea spațială.
         */
        function edgeBounds(edge) {
          const a = el(edge.from),
            b = el(edge.to),
            p = a ? nodeCenter(a) : edge.fromPoint,
            q = b ? nodeCenter(b) : edge.toPoint;
          if (!p || !q) return null;
          const points = [p, ...edgeWaypoints(edge), q];
          if (edge.label) {
            // Limita include și textul deplasat departe de traseu, inclusiv în export.
            textMeter.font = '14px system-ui';
            const half = textMeter.measureText(edge.label).width / 2;
            const dx = edge.labelAnchor?.dx || 0,
              dy = edge.labelAnchor?.dy || 0;
            for (const point of [...points])
              points.push(
                { x: point.x + dx - half, y: point.y + dy - 18 },
                { x: point.x + dx + half, y: point.y + dy + 18 },
              );
          }
          if (
            points.some(
              (p) =>
                !Number.isFinite(p.x) ||
                !Number.isFinite(p.y) ||
                Math.abs(p.x) >= MAX_WORLD_COORD ||
                Math.abs(p.y) >= MAX_WORLD_COORD,
            )
          )
            return null;
          return {
            x: Math.min(...points.map((p) => p.x)) - 180,
            y: Math.min(...points.map((p) => p.y)) - 180,
            right: Math.max(...points.map((p) => p.x)) + 180,
            bottom: Math.max(...points.map((p) => p.y)) + 180,
          };
        }

        /**
         * Alege dreptunghiurile care trebuie tratate ca obstacole în calculul traseelor.
         */
        function routeObstacles(a, b, range) {
          const found = visibleNodes(range);
          if (found.length <= 32) return found.map(nodeVisualRect);
          const p = nodeCenter(a),
            q = nodeCenter(b),
            dx = q.x - p.x,
            dy = q.y - p.y,
            length2 = dx * dx + dy * dy || 1;
          const best = [];
          for (const node of found) {
            if (node.id === a.id || node.id === b.id) continue;
            const c = nodeCenter(node),
              t = Math.max(0, Math.min(1, ((c.x - p.x) * dx + (c.y - p.y) * dy) / length2));
            const score = segmentHitsRect(p, q, nodeVisualRect(node))
              ? -1
              : (c.x - p.x - t * dx) ** 2 + (c.y - p.y - t * dy) ** 2;
            if (best.length < 30 || score < best[0].score) {
              best.push({ node, score });
              best.sort((left, right) => right.score - left.score);
              if (best.length > 30) best.shift();
            }
          }
          return [a, b, ...best.map((item) => item.node)].map(nodeVisualRect);
        }

        /**
         * Selectează conexiunile care pot apărea în zona vizibilă fără a desena întreaga diagramă.
         */
        function visibleEdges(bounds) {
          const step = 500;
          if (edgeIndexVersion !== geometryVersion) {
            edgeCells.clear();
            edgeWide = [];
            for (const edge of edges) {
              const rect = edgeBounds(edge);
              if (!rect) continue;
              const range = gridRange(rect, step, 36);
              if (!range) {
                edgeWide.push(edge);
                continue;
              }
              for (let x = range.x0; x <= range.x1; x++)
                for (let y = range.y0; y <= range.y1; y++) {
                  const key = `${x}:${y}`;
                  if (!edgeCells.has(key)) edgeCells.set(key, []);
                  edgeCells.get(key).push(edge);
                }
            }
            edgeIndexVersion = geometryVersion;
          }
          const range = gridRange(bounds, step, 2000);
          const candidates = new Map(
            (range ? edgeWide : edges.filter((e) => edgeBounds(e))).map((e) => [e.id, e]),
          );
          if (range)
            for (let x = range.x0; x <= range.x1; x++)
              for (let y = range.y0; y <= range.y1; y++) {
                for (const edge of edgeCells.get(`${x}:${y}`) || []) candidates.set(edge.id, edge);
              }
          if (
            drag?.kind === 'node' ||
            drag?.kind === 'resize' ||
            drag?.kind === 'group' ||
            drag?.kind === 'port-position'
          ) {
            const moving = new Set([
              ...(drag.affected || [drag.id]),
              ...(drag.previewParents || []),
            ]);
            for (const edge of edges)
              if (moving.has(edge.from) || moving.has(edge.to)) candidates.set(edge.id, edge);
          }
          if (selected) {
            const edge = edges.find((e) => e.id === selected);
            if (edge) candidates.set(edge.id, edge);
          }
          return [...candidates.values()].filter(
            (e) =>
              overlaps(
                edgeBounds(e) || { x: Infinity, right: -Infinity, y: Infinity, bottom: -Infinity },
                bounds,
              ) || e.id === selected,
          );
        }

        /**
         * Reunește cererile de redesenare a conexiunilor într-un singur cadru de animație.
         */
        function drawEdgesSoon() {
          if (fastFrame) return;
          fastFrame = requestAnimationFrame(() => {
            fastFrame = 0;
            drawEdges(true);
          });
        }

        /**
         * Actualizează previzualizarea conexiunilor în timpul unui gest, apoi programează recalcularea traseelor definitive.
         */
        function redrawMovingEdges() {
          drawEdges(true);
          scheduleRoutePass();
        }

        /**
         * Amână recalcularea traseelor pentru a păstra fluiditatea interacțiunilor rapide.
         */
        function scheduleRoutePass() {
          if (routePassTimer) return;
          routePassTimer = setTimeout(() => {
            routePassTimer = 0;
            if (!drag || ['node', 'group', 'resize'].includes(drag.kind)) {
              if (overviewActive) paintOverviewSoon();
              else drawEdges();
            }
          }, 16);
        }

        /**
         * Programează cel mult o redesenare a vederii de ansamblu pentru următorul cadru.
         */
        function paintOverviewSoon() {
          if (overviewFrame) return;
          overviewFrame = requestAnimationFrame(() => {
            overviewFrame = 0;
            paintOverview();
          });
        }

        // ============================================================================
        // 05. Randare simplificată pentru zoom mic
        // ============================================================================

        /**
         * Alege eticheta scurtă explicită sau o abreviere compatibilă cu denumirile existente pentru vederea de ansamblu.
         */
        function overviewNodeLabel(node) {
          const label = String(node.label || '');
          if (typeof node.overviewLabel === 'string')
            return node.overviewLabel.trim() || label.split('\n')[0];
          if (label === 'ds-management') return 'MGMT';
          if (label === 'ds-vm') return 'VM';
          if (label.startsWith('dvSwitch ')) return label.slice(9);
          let m;
          if ((m = /^cs-vm-(.+)$/.exec(label))) return m[1].toUpperCase();
          if ((m = /^[^-]+-fw-([^-]+)-\d+$/.exec(label))) return 'FW ' + m[1].toUpperCase();
          if ((m = /^[^-]+-vm-([^-]+)-(cp|wk)-\d+$/.exec(label)))
            return (m[1] + ' ' + m[2]).toUpperCase();
          if ((m = /^dpg-[^-]+-(intranet|internet)-wan$/.exec(label))) return m[1];
          if ((m = /^dpg-[^-]+-([^-]+)-(mgm|wan|lan|interconnect)$/.exec(label)))
            return (
              m[1].toUpperCase() +
              ' ' +
              { mgm: 'MGMT', wan: 'WAN', lan: 'LAN', interconnect: 'inter.' }[m[2]]
            );
          return label.split('\n')[0];
        }

        /**
         * Desenează nodurile, conexiunile, etichetele și selecția pe canvas la zoom mic, folosind geometria modelului.
         */
        function paintOverview() {
          if (!overviewActive) return;
          const w = canvas.clientWidth,
            h = canvas.clientHeight,
            dpr = window.devicePixelRatio || 1;
          if (overview.width !== Math.round(w * dpr) || overview.height !== Math.round(h * dpr)) {
            overview.width = Math.round(w * dpr);
            overview.height = Math.round(h * dpr);
          }
          const ctx = overview.getContext('2d');
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          const ranks = nodePaintRanks();
          const syncGroups = activeSyncGroups();
          for (const node of visibleNodes(visibleBounds(0)).sort(
            (a, b) => ranks.get(a.id) - ranks.get(b.id),
          )) {
            const size = dimensions(node),
              rect = nodeVisualRect(node),
              x = pan.x + rect.x * scale,
              y = pan.y + rect.y * scale,
              nw = Math.max(2, size.w * scale),
              nh = Math.max(2, size.h * scale),
              center = nodeCenter(node),
              cx = pan.x + center.x * scale,
              cy = pan.y + center.y * scale;
            if (x > w || y > h || x + rect.w * scale < 0 || y + rect.h * scale < 0) continue;
            ctx.save();
            ctx.fillStyle = node.fill || '#ffffff';
            ctx.strokeStyle = node.stroke || '#42536f';
            ctx.lineWidth = Math.max(0.65, 2 * scale);
            ctx.translate(cx, cy);
            ctx.rotate(((Number(node.rotation) || 0) * Math.PI) / 180);
            ctx.setLineDash(
              node.borderStyle === 'dashed'
                ? [8 * scale, 6 * scale]
                : node.borderStyle === 'dotted'
                  ? [2 * scale, 5 * scale]
                  : [],
            );
            ctx.beginPath();
            ctx.roundRect(
              -nw / 2,
              -nh / 2,
              nw,
              nh,
              Math.min((isNetworkSegment(node) ? 2 : 9) * scale, nw / 2, nh / 2),
            );
            ctx.fill();
            ctx.stroke();
            if (['firewall', 'vm'].includes(node.kind) && nw > 18 && nh > 12) {
              ctx.setLineDash([]);
              ctx.lineWidth = Math.max(0.8, scale * 2);
              ctx.stroke(
                new Path2D(
                  nodeRolePath(
                    node.kind,
                    -nw / 2 + 3,
                    -Math.min(18, nh - 6) / 2,
                    Math.min(18, nh - 6),
                  ),
                ),
              );
            }
            if (node.kind === 'firewall' && nw > 12 && nh > 12)
              ctx.strokeRect(-nw / 2 + 3, -nh / 2 + 3, nw - 6, nh - 6);
            if (node.kind === 'container' && nh > 15) {
              ctx.beginPath();
              ctx.moveTo(-nw / 2, -nh / 2 + Math.max(5, 32 * scale));
              ctx.lineTo(nw / 2, -nh / 2 + Math.max(5, 32 * scale));
              ctx.stroke();
            }
            if (node.sync && syncGroups.has(node.sync.id)) {
              ctx.setLineDash(selectedNodes.has(node.id) ? [] : [4, 3]);
              ctx.strokeStyle = '#7c3aed';
              ctx.lineWidth = 1.5;
              ctx.strokeRect(-nw / 2 - 3, -nh / 2 - 3, nw + 6, nh + 6);
            }
            ctx.restore();
          }
          // Coordonatele porturilor, traseele și decuparea sunt comune cu desenarea SVG.
          // Conexiunile se desenează peste fundalurile nodurilor, inclusiv în containere.
          ctx.save();
          ctx.translate(pan.x, pan.y);
          ctx.scale(scale, scale);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          for (const { e, points, bridges, fromPort, toPort } of collectEdgePaths(false)) {
            const path = new Path2D(
              routeSvg(paintedLinkPoints(points, el(e.from), el(e.to), fromPort, toPort), bridges),
            );
            const style = e.lineStyle || (e.dashed ? 'dashed' : 'solid');
            ctx.setLineDash(style === 'dashed' ? [8, 6] : style === 'dotted' ? [2, 6] : []);
            ctx.strokeStyle = selected === e.id ? '#2f6bff' : e.color || '#52617a';
            ctx.lineWidth = Math.max(0.65 / scale, selected === e.id ? 3.2 : 2.4);
            ctx.stroke(path);
            ctx.fillStyle = e.color || '#52617a';
            for (const d of edgeArrowPaths(e, points)) ctx.fill(new Path2D(d));
          }
          ctx.restore();
          const containers = new Set(nodes.map((n) => n.parent).filter(Boolean));
          for (const node of visibleNodes(visibleBounds(0))) {
            const size = dimensions(node),
              nw = size.w * scale,
              nh = size.h * scale,
              label = overviewNodeLabel(node);
            if (!label || nw < 18 || nh < (isNetworkSegment(node) ? 5 : 8)) continue;
            const center = nodeCenter(node),
              isContainer = containers.has(node.id),
              cluster = /^cs-vm-/.test(node.label || '');
            let font = isNetworkSegment(node)
              ? Math.max(6, Math.min(9, nh - 1))
              : Math.min(cluster ? 6 : 9, nh - 2);
            ctx.save();
            ctx.translate(pan.x + center.x * scale, pan.y + center.y * scale);
            ctx.rotate(((Number(node.rotation) || 0) * Math.PI) / 180);
            ctx.font = `${font}px system-ui`;
            while (font > 6 && ctx.measureText(label).width > nw - 6) {
              font -= 0.5;
              ctx.font = `${font}px system-ui`;
            }
            ctx.textBaseline = 'middle';
            ctx.textAlign = isContainer ? 'left' : 'center';
            let text = label;
            while (text.length > 1 && ctx.measureText(text).width > nw - 6)
              text = text.slice(0, -1);
            if (text !== label) text = text.slice(0, -1) + '…';
            const tx = isContainer ? -nw / 2 + 3 : 0,
              ty = isContainer ? -nh / 2 + font / 2 + (cluster ? 0.5 : 3) : 0;
            ctx.strokeStyle = node.fill || '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeText(text, tx, ty);
            ctx.fillStyle = node.textColor || '#29354d';
            ctx.fillText(text, tx, ty);
            ctx.restore();
          }
        }
        const portNames = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'],
          portFactors = {
            nw: [0, 0],
            n: [0.5, 0],
            ne: [1, 0],
            e: [1, 0.5],
            se: [1, 1],
            s: [0.5, 1],
            sw: [0, 1],
            w: [0, 0.5],
          },
          sidePort = { top: 'n', right: 'e', bottom: 's', left: 'w' };
        const cardinalSides = ['N', 'E', 'S', 'W'],
          CARDINAL_SPACING = 18,
          CARDINAL_MARGIN = 13,
          CARDINAL_STEP_RATIO = 0.1;
        const genericPortSides = {
          nw: ['N', 'W'],
          n: ['N'],
          ne: ['N', 'E'],
          e: ['E'],
          se: ['S', 'E'],
          s: ['S'],
          sw: ['S', 'W'],
          w: ['W'],
        };

        // ============================================================================
        // 06. Porturi, puncte de conexiune și interacțiuni
        // ============================================================================

        /**
         * Citește numărul de porturi de pe o latură și îl normalizează la un întreg nenegativ.
         */
        function cardinalPortCount(n, side) {
          const value = Number(n?.ports?.[side]);
          return Number.isFinite(value) ? Math.max(0, Math.floor(value)) : 0;
        }

        /**
         * Enumeră porturile explicite în ordinea N, E, S, W și după numărul lor pe fiecare latură.
         */
        function cardinalPortNames(n) {
          return cardinalSides.flatMap((side) =>
            Array.from(
              { length: cardinalPortCount(n, side) },
              /**
               * Construiește elementul din poziția curentă a secvenței în cardinalPortNames.
               */
              (_, i) => `${side}${i + 1}`,
            ),
          );
        }

        /**
         * Stabilește dacă un nod are cel puțin un port cardinal explicit.
         */
        function hasCardinalPorts(n) {
          return cardinalSides.some((side) => cardinalPortCount(n, side) > 0);
        }

        /**
         * Calculează distanța relativă dintre porturi în funcție de spațiul disponibil pe latură.
         */
        function cardinalPitchRatio(count) {
          const limit = count > 1 ? 0.9 / (count - 1) : 0.9;
          return Math.min(limit, CARDINAL_STEP_RATIO);
        }

        /**
         * Alege lista porturilor explicite sau punctele de conexiune implicite ale nodului.
         */
        function portNamesForNode(n) {
          const configured = new Set(
            cardinalSides.filter((side) => cardinalPortCount(n, side) > 0),
          );
          return [
            ...portNames.filter(
              (name) => !(genericPortSides[name] || []).some((side) => configured.has(side)),
            ),
            ...cardinalPortNames(n),
          ];
        }

        /**
         * Verifică dacă un nume de port este disponibil pe nod.
         */
        function hasPort(n, name) {
          return portNamesForNode(n).includes(name);
        }

        /**
         * Calculează poziția unui punct de conexiune pe un dreptunghi nerotit.
         */
        function portPoint(r, name, corner = 9) {
          // Porturile de colț stau pe tangenta dreaptă a conturului, în afara arcului rotunjit.
          if (name === 'nw') return { x: r.x + corner, y: r.y };
          if (name === 'ne') return { x: r.right - corner, y: r.y };
          if (name === 'se') return { x: r.right - corner, y: r.bottom };
          if (name === 'sw') return { x: r.x + corner, y: r.bottom };
          const [fx, fy] = portFactors[name] || portFactors.e;
          return { x: r.x + r.w * fx, y: r.y + r.h * fy };
        }

        /**
         * Calculează poziția finală a unui port în planșă, inclusiv slotul pe grilă și rotația nodului.
         */
        function portPointForNode(n, name) {
          const match = /^([NESW])(\d+)$/.exec(name);
          const rect = nodeRect(n),
            center = nodeCenter(n);
          let point;
          if (match && hasCardinalPorts(n)) {
            const side = match[1];
            let offset;
            if (gridNode(n)) {
              if (!Number.isFinite(n.portSlots?.[name])) ensurePortSlots(n, dimensions(n));
              offset = n.portSlots[name] * gridSettings.step;
            } else offset = portLength(n, name) * currentPortPositionValue(n, name);
            point =
              side === 'N'
                ? { x: rect.x + offset, y: rect.y }
                : side === 'E'
                  ? { x: rect.right, y: rect.y + offset }
                  : side === 'S'
                    ? { x: rect.x + offset, y: rect.bottom }
                    : { x: rect.x, y: rect.y + offset };
          } else point = portPoint(rect, name, gridNode(n) ? gridSettings.step : 9);
          const rotated = rotatePoint(point, center, n.rotation);
          return gridNode(n) && n.x === snapGrid(n.x) && n.y === snapGrid(n.y)
            ? { x: snapGrid(rotated.x), y: snapGrid(rotated.y) }
            : rotated;
        }

        /**
         * Calculează poziția relativă implicită sau salvată a unui port pe latura sa.
         */
        function portPositionValue(n, name) {
          if (gridNode(n)) {
            const count = cardinalPortCount(n, name[0]),
              index = Number(name.slice(1)) - 1;
            return 0.5 + ((2 * index - (count - 1)) * gridSettings.step) / portLength(n, name);
          }
          const match = /^([NESW])(\d+)$/.exec(name);
          if (!match) return 0.5;
          const [, side, indexText] = match,
            index = Number(indexText) - 1,
            count = cardinalPortCount(n, side);
          return Math.max(
            0,
            Math.min(1, 0.5 + (index - (count - 1) / 2) * cardinalPitchRatio(count)),
          );
        }

        /**
         * Citește poziția efectivă a portului, convertind slotul discret în proporție când nodul folosește grila.
         */
        function currentPortPositionValue(n, name) {
          if (gridNode(n)) {
            if (!Number.isFinite(n.portSlots?.[name])) ensurePortSlots(n, dimensions(n));
            return (n.portSlots[name] * gridSettings.step) / portLength(n, name);
          }
          const stored = Number(n.portPositions?.[name]);
          return Number.isFinite(stored)
            ? Math.max(0, Math.min(1, stored))
            : portPositionValue(n, name);
        }

        /**
         * Marchează vizual proprietarul porturilor și nodurile de referință folosite la aliniere.
         */
        function refreshPortAlignmentHighlights() {
          const active = portPositionMode && selectedPorts.size > 0,
            ownerId = selectedPortNodeId;
          for (const node of world.querySelectorAll('.node')) {
            const owner = active && node.dataset.id === ownerId,
              reference = active && !owner && selectedNodes.has(node.dataset.id),
              model = el(node.dataset.id);
            node.classList.toggle('port-alignment-owner', owner);
            node.classList.toggle('port-alignment-reference', reference);
            if (owner || reference) {
              const role = owner ? 'PROPRIETAR PORT' : 'REPER · ' + (model?.label || 'nod');
              node.dataset.alignmentRole = role;
              node.title = owner
                ? `Proprietarul porturilor selectate: ${model?.label || 'nod'}`
                : `Reper pentru alinierea porturilor: ${model?.label || 'nod'}`;
            } else {
              delete node.dataset.alignmentRole;
              node.removeAttribute('title');
            }
          }
        }

        /**
         * Actualizează aspectul porturilor selectate și comenzile de aliniere disponibile.
         */
        function refreshPortSelection() {
          for (const dot of portsLayer.querySelectorAll('.port.cardinal-port')) {
            const active =
                dot.dataset.node === selectedPortNodeId && selectedPorts.has(dot.dataset.port),
              alignment = active && portPositionMode;
            dot.classList.toggle('port-selected', active);
            dot.classList.toggle('port-alignment-participant', alignment);
            dot.title = alignment
              ? `Port ${dot.dataset.port} · PARTICIPANT la aliniere`
              : `Port ${dot.dataset.port}; Shift-clic adaugă, Ctrl-clic selectează/deselectează`;
            dot.setAttribute('aria-label', dot.title);
          }
          refreshPortAlignmentHighlights();
        }

        /**
         * Restrânge punctele de conexiune la cele potrivite pentru rutarea automată.
         */
        function routablePortNames(n) {
          return portNamesForNode(n).filter((name) => !['nw', 'ne', 'sw', 'se'].includes(name));
        }

        /**
         * Alege portul aflat cel mai aproape de punctul indicat.
         */
        function nearestPortName(n, p) {
          return routablePortNames(n).reduce(
            (best, name) => {
              const q = portPointForNode(n, name),
                distance = Math.hypot(q.x - p.x, q.y - p.y);
              return distance < best.distance ? { name, distance } : best;
            },
            { name: routablePortNames(n)[0], distance: Infinity },
          ).name;
        }

        /**
         * Determină direcția fizică a unui port față de celălalt capăt, inclusiv pentru noduri rotite.
         */
        function portSide(name, a, b, node = null) {
          const side =
            /^([NESW])\d+$/.exec(name)?.[1] ||
            { nw: 'N', n: 'N', ne: 'N', e: 'E', se: 'S', s: 'S', sw: 'S', w: 'W' }[name];
          if (side) {
            const v = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] }[side],
              angle = ((Number(node?.rotation) || 0) * Math.PI) / 180,
              dx = v[0] * Math.cos(angle) - v[1] * Math.sin(angle),
              dy = v[0] * Math.sin(angle) + v[1] * Math.cos(angle);
            return Math.abs(dx) > Math.abs(dy)
              ? dx > 0
                ? 'right'
                : 'left'
              : dy > 0
                ? 'bottom'
                : 'top';
          }
          const dx = b.x - a.x,
            dy = b.y - a.y;
          return Math.abs(dx) > Math.abs(dy)
            ? dx >= 0
              ? 'right'
              : 'left'
            : dy >= 0
              ? 'bottom'
              : 'top';
        }

        /**
         * Repoziționează elementele vizuale ale porturilor și elimină metadatele de dimensionare vechi.
         */
        function updatePortPositions() {
          let migrated = false;
          for (const dot of portsLayer.querySelectorAll('.port')) {
            const n = el(dot.dataset.node);
            if (!n) continue;
            const p = portPointForNode(n, dot.dataset.port);
            for (const key of [
              'portReferenceWidth',
              'portReferenceHeight',
              'portReferenceSize',
              'portProportionX',
              'portProportionY',
              'portWidthRatio',
              'portHeightRatio',
            ])
              if (key in n) {
                delete n[key];
                migrated = true;
              }
            dot.style.left = p.x + 'px';
            dot.style.top = p.y + 'px';
            dot.style.width = '10px';
            dot.style.height = '10px';
          }
          if (migrated) scheduleSave();
        }

        /**
         * Recreează porturile vizibile și asociază evenimentele necesare conectării sau mutării lor.
         */
        function renderPorts() {
          portsLayer.replaceChildren();
          const showGeneric = connectMode || drag?.kind === 'port' || drag?.kind === 'edge-end';
          if (portPositionMode) {
            const node = selectedPortNodeId ? el(selectedPortNodeId) : null;
            if (!node || !hasCardinalPorts(node)) {
              portPositionMode = false;
              selectedPorts.clear();
              selectedPortNodeId = null;
              document.body.classList.remove('port-position-mode');
              $('#portPositionMode').classList.remove('active');
            } else
              for (const name of selectedPorts)
                if (!cardinalPortNames(node).includes(name)) selectedPorts.delete(name);
          }
          const rendered = [...world.querySelectorAll('.node')],
            hasConfigured = rendered.some((d) => hasCardinalPorts(el(d.dataset.id)));
          portsLayer.classList.toggle('active', showGeneric || hasConfigured);
          if (!showGeneric && !hasConfigured) return;
          for (const d of rendered) {
            const n = el(d.dataset.id);
            if (!n) continue;
            const configured = hasCardinalPorts(n),
              names = configured
                ? showGeneric
                  ? portNamesForNode(n)
                  : cardinalPortNames(n)
                : showGeneric
                  ? portNames
                  : [];
            for (const name of names) {
              const cardinal = /^[NESW]\d+$/.test(name),
                dot = document.createElement('span');
              dot.className = 'port' + (cardinal ? ' cardinal-port' : '');
              dot.dataset.node = n.id;
              dot.dataset.port = name;
              dot.title = cardinal
                ? portPositionMode
                  ? `Port ${name}; Shift-clic adaugă, Ctrl-clic selectează/deselectează`
                  : `Port ${name}`
                : 'Punct de contact automat';
              dot.setAttribute('aria-label', dot.title);
              dot.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                e.preventDefault();
                e.stopPropagation();
                if (cardinal && portPositionMode) {
                  if (n.id !== selectedPortNodeId) return;
                  if (e.shiftKey || e.ctrlKey || e.metaKey) {
                    if (e.shiftKey || !selectedPorts.has(name)) selectedPorts.add(name);
                    else selectedPorts.delete(name);
                    refreshPortSelection();
                    return;
                  } else if (!selectedPorts.has(name)) {
                    selectedPorts = new Set([name]);
                    refreshPortSelection();
                  }
                  beginPortPosition(e, n, name);
                  return;
                }
                selected = null;
                drag = {
                  kind: 'port',
                  from: n.id,
                  fromPort: name,
                  to: null,
                  toPort: null,
                  pointer: portPointForNode(n, name),
                };
                if (configured) {
                  canvas.setPointerCapture(e.pointerId);
                  renderPorts();
                } else dot.setPointerCapture(e.pointerId);
                drawEdges();
              });
              dot.addEventListener('click', (e) => e.stopPropagation());
              dot.addEventListener('dblclick', (e) => e.stopPropagation());
              portsLayer.appendChild(dot);
            }
          }
          updatePortPositions();
          refreshPortSelection();
        }

        /**
         * Identifică portul aflat sub un eveniment de pointer.
         */
        function portAt(e, from) {
          let best = null,
            limit = e.pointerType === 'touch' ? 28 : 18;
          for (const dot of portsLayer.querySelectorAll('.port')) {
            if (dot.dataset.node === from) continue;
            const r = dot.getBoundingClientRect(),
              distance = Math.hypot(
                e.clientX - (r.left + r.right) / 2,
                e.clientY - (r.top + r.bottom) / 2,
              );
            if (distance <= limit) {
              best = dot;
              limit = distance;
            }
          }
          return best;
        }

        /**
         * Caută nodul aflat sub pointer pentru a alege ținta unei conexiuni sau a unui gest.
         */
        function nodeAtPointer(e, from) {
          return (
            [...world.querySelectorAll('.node')].reverse().find((d) => {
              if (d.dataset.id === from) return false;
              const r = d.getBoundingClientRect();
              return (
                e.clientX >= r.left &&
                e.clientX <= r.right &&
                e.clientY >= r.top &&
                e.clientY <= r.bottom
              );
            }) || null
          );
        }

        /**
         * Determină nodul și portul țintă la conectare, excluzând cazurile care nu pot fi folosite.
         */
        function edgeTargetAt(e, from) {
          const near = portAt(e, from);
          if (near) return near;
          const target = nodeAtPointer(e, from);
          if (!target) return null;
          const p = local(e),
            node = el(target.dataset.id),
            name = nearestPortName(node, { x: (p.x - pan.x) / scale, y: (p.y - pan.y) / scale });
          return (
            [...portsLayer.querySelectorAll('.port')].find(
              (dot) => dot.dataset.node === node.id && dot.dataset.port === name,
            ) || null
          );
        }

        /**
         * Actualizează previzualizarea unei conexiuni trase dintr-un port.
         */
        function movePort(e) {
          const p = local(e),
            target = portAt(e, drag.from);
          drag.pointer = { x: (p.x - pan.x) / scale, y: (p.y - pan.y) / scale };
          drag.to = target?.dataset.node || null;
          drag.toPort = target?.dataset.port || null;
          portsLayer
            .querySelectorAll('.port.target')
            .forEach((dot) => dot.classList.remove('target'));
          if (target) target.classList.add('target');
          drawEdgesSoon();
        }

        /**
         * Finalizează sau anulează conexiunea creată prin tragerea unui port și salvează modificarea validă.
         */
        function finishPort(e) {
          const from = drag.from,
            fromPort = drag.fromPort,
            dot = portAt(e, from),
            nodeDot = dot || nodeAtPointer(e, from),
            targetId = dot?.dataset.node || nodeDot?.dataset.id,
            targetNode = targetId ? el(targetId) : null,
            point = local(e),
            toPort =
              dot?.dataset.port ||
              (targetNode
                ? nearestPortName(targetNode, {
                    x: (point.x - pan.x) / scale,
                    y: (point.y - pan.y) / scale,
                  })
                : null);
          drag = null;
          portsLayer
            .querySelectorAll('.port.target')
            .forEach((item) => item.classList.remove('target'));
          if (
            targetNode &&
            toPort &&
            !edges.some(
              (edge) =>
                edge.from === from &&
                edge.to === targetNode.id &&
                edge.fromPort === fromPort &&
                edge.toPort === toPort,
            )
          ) {
            const edge = {
              id: 'e' + Date.now() + Math.random().toString(16).slice(2, 8),
              from,
              to: targetNode.id,
              fromPort,
              toPort,
              label: '',
            };
            edges.push(edge);
            selected = edge.id;
            selectedNodes.clear();
            connectMode = false;
            connectFrom = null;
            $('#connect').classList.remove('active');
            remember();
            toast('Legătură creată');
          }
          render();
        }
        // --- Geometria conexiunilor ----------------------------------------------------------
        // Se preferă segmentul direct când nu traversează un nod. Altfel se caută
        // trasee ortogonale scurte, penalizând coturile; porturile rămân pe contur.

        // ============================================================================
        // 07. Calculul traseelor și evitarea obstacolelor
        // ============================================================================

        /**
         * Transformă direcția unui port într-un vector folosit de rutarea ortogonală.
         */
        function routeSide(a, b) {
          const ac = nodeCenter(a),
            bc = nodeCenter(b),
            ar = nodeVisualRect(a),
            br = nodeVisualRect(b);
          if (ar.bottom <= br.y) return ['bottom', 'top'];
          if (br.bottom <= ar.y) return ['top', 'bottom'];
          if (ar.right <= br.x) return ['right', 'left'];
          if (br.right <= ar.x) return ['left', 'right'];
          const dx = bc.x - ac.x,
            dy = bc.y - ac.y;
          return Math.abs(dx) > Math.abs(dy)
            ? [dx >= 0 ? 'right' : 'left', dx >= 0 ? 'left' : 'right']
            : [dy >= 0 ? 'bottom' : 'top', dy >= 0 ? 'top' : 'bottom'];
        }

        /**
         * Ajustează punctul de pornire al rutării pentru a respecta latura portului.
         */
        function routePort(r, side, index, count) {
          const t = (index + 1) / (count + 1);
          if (side === 'top') return { x: r.x + r.w * t, y: r.y };
          if (side === 'bottom') return { x: r.x + r.w * t, y: r.bottom };
          if (side === 'left') return { x: r.x, y: r.y + r.h * t };
          return { x: r.right, y: r.y + r.h * t };
        }

        /**
         * Construiește segmentul scurt de ieșire dintr-un port înainte de traseul principal.
         */
        function routeStub(p, side) {
          const d = gridSettings.snap ? gridSettings.step : 22;
          return {
            x: p.x + (side === 'left' ? -d : side === 'right' ? d : 0),
            y: p.y + (side === 'top' ? -d : side === 'bottom' ? d : 0),
          };
        }

        /**
         * Elimină punctele duplicate și coturile coliniare dintr-un traseu.
         */
        function compactRoute(points) {
          const out = [];
          for (const p of points) {
            if (
              out.length &&
              Math.abs(out.at(-1).x - p.x) < 0.01 &&
              Math.abs(out.at(-1).y - p.y) < 0.01
            )
              continue;
            out.push(p);
            while (out.length >= 3) {
              const a = out.at(-3),
                b = out.at(-2),
                c = out.at(-1);
              if (
                (Math.abs(a.x - b.x) < 0.01 && Math.abs(b.x - c.x) < 0.01) ||
                (Math.abs(a.y - b.y) < 0.01 && Math.abs(b.y - c.y) < 0.01)
              )
                out.splice(out.length - 2, 1);
              else break;
            }
          }
          return out;
        }

        /**
         * Verifică dacă segmentele unui traseu evită dreptunghiurile obstacol.
         */
        function routeClear(a, b, blocks) {
          return !blocks.some((r) => {
            if (Math.abs(a.x - b.x) < 0.01)
              return (
                a.x > r.x &&
                a.x < r.right &&
                Math.max(a.y, b.y) > r.y &&
                Math.min(a.y, b.y) < r.bottom
              );
            if (Math.abs(a.y - b.y) < 0.01)
              return (
                a.y > r.y &&
                a.y < r.bottom &&
                Math.max(a.x, b.x) > r.x &&
                Math.min(a.x, b.x) < r.right
              );
            return true;
          });
        }

        /**
         * Testează dacă un segment intersectează interiorul unui dreptunghi.
         */
        function segmentHitsRect(a, b, r) {
          let near = 0,
            far = 1;
          for (const [start, delta, min, max] of [
            [a.x, b.x - a.x, r.x, r.right],
            [a.y, b.y - a.y, r.y, r.bottom],
          ]) {
            if (Math.abs(delta) < 0.001) {
              if (start <= min || start >= max) return false;
              continue;
            }
            let t1 = (min - start) / delta,
              t2 = (max - start) / delta;
            if (t1 > t2) [t1, t2] = [t2, t1];
            near = Math.max(near, t1);
            far = Math.min(far, t2);
            if (near >= far) return false;
          }
          return near < 1 && far > 0;
        }

        /**
         * Alege perechea de porturi care produce o conexiune potrivită între două noduri, ținând cont de obstacole.
         */
        function autoPorts(a, b, rects) {
          const ra = nodeVisualRect(a),
            rb = nodeVisualRect(b),
            fromNames = routablePortNames(a),
            toNames = routablePortNames(b);
          if (!(ra.right <= rb.x || rb.right <= ra.x || ra.bottom <= rb.y || rb.bottom <= ra.y))
            return [nearestPortName(a, nodeCenter(b)), nearestPortName(b, nodeCenter(a))];
          const inside =
              /**
               * Verifică dacă punctul se află în interiorul dreptunghiului.
               */
              (r) => ({ x: r.x + 5, y: r.y + 5, right: r.right - 5, bottom: r.bottom - 5 }),
            blocks = rects
              .filter(
                (r) =>
                  r.id !== a.id &&
                  r.id !== b.id &&
                  !isDescendant(a.id, r.id) &&
                  !isDescendant(b.id, r.id),
              )
              .map((r) => ({ x: r.x - 8, y: r.y - 8, right: r.right + 8, bottom: r.bottom + 8 }));
          let best = null;
          for (const from of fromNames)
            for (const to of toNames) {
              const p = portPointForNode(a, from),
                q = portPointForNode(b, to);
              if (
                segmentHitsRect(p, q, inside(ra)) ||
                segmentHitsRect(p, q, inside(rb)) ||
                blocks.some((r) => segmentHitsRect(p, q, r))
              )
                continue;
              const score = Math.hypot(q.x - p.x, q.y - p.y);
              if (!best || score < best.score) best = { from, to, score };
            }
          return best
            ? [best.from, best.to]
            : [nearestPortName(a, nodeCenter(b)), nearestPortName(b, nodeCenter(a))];
        }
        // Caută traseul ortogonal pe coordonatele marginilor obstacolelor; coturile au cost suplimentar.

        /**
         * Generează variante simple de traseu cu segmente orizontale și verticale.
         */
        function simpleOrthogonal(start, end, blocks) {
          const round = gridSettings.snap ? snapGrid : (v) => v,
            midX = round((start.x + end.x) / 2),
            midY = round((start.y + end.y) / 2);
          const candidates = [
            [start, { x: start.x, y: end.y }, end],
            [start, { x: end.x, y: start.y }, end],
            [start, { x: midX, y: start.y }, { x: midX, y: end.y }, end],
            [start, { x: start.x, y: midY }, { x: end.x, y: midY }, end],
          ];
          let best = null;
          for (const candidate of candidates) {
            const points = compactRoute(candidate);
            let length = 0,
              hits = 0;
            for (let i = 1; i < points.length; i++) {
              const a = points[i - 1],
                b = points[i];
              length += Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
              for (const block of blocks) if (!routeClear(a, b, [block])) hits++;
            }
            const score = hits * 100000 + length + points.length * 16;
            if (!best || score < best.score) best = { points, score };
          }
          return best.points;
        }

        /**
         * Caută un traseu ortogonal între puncte, penalizând coturile și ocolind obstacolele.
         */
        function routeBetween(start, end, blocks) {
          const xs = new Set([start.x, end.x]),
            ys = new Set([start.y, end.y]);
          for (const block of blocks) {
            xs.add(gridSettings.snap ? gridFloor(block.x) : block.x);
            xs.add(gridSettings.snap ? gridCeil(block.right) : block.right);
            ys.add(gridSettings.snap ? gridFloor(block.y) : block.y);
            ys.add(gridSettings.snap ? gridCeil(block.bottom) : block.bottom);
          }
          const xx = [...xs].sort((a, b) => a - b),
            yy = [...ys].sort((a, b) => a - b);
          const width = xx.length,
            height = yy.length;
          // Numărul punctelor de căutare crește pătratic cu obstacolele; calculul unei conexiuni este limitat.
          if (!Number.isFinite(width * height) || width * height > 1024 || blocks.length > 18)
            return simpleOrthogonal(start, end, blocks);
          const startIndex = yy.indexOf(start.y) * width + xx.indexOf(start.x);
          const endIndex = yy.indexOf(end.y) * width + xx.indexOf(end.x);
          const heap = [],
            distance = new Map(),
            previous = new Map();
          const stateKey =
            /**
             * Construiește cheia unică a unei stări din căutarea traseului.
             */
            (point, direction) => point * 3 + direction;

          /**
           * Inserează o stare în coada de priorități folosită de căutarea traseului.
           */
          function push(item) {
            heap.push(item);
            let i = heap.length - 1;
            while (i > 0) {
              const parent = (i - 1) >> 1;
              if (heap[parent].cost <= item.cost) break;
              heap[i] = heap[parent];
              i = parent;
            }
            heap[i] = item;
          }

          /**
           * Extrage starea cu costul minim din coada de priorități a rutării.
           */
          function pop() {
            const first = heap[0],
              last = heap.pop();
            if (heap.length) {
              let i = 0;
              while (i * 2 + 1 < heap.length) {
                let child = i * 2 + 1;
                if (child + 1 < heap.length && heap[child + 1].cost < heap[child].cost) child++;
                if (heap[child].cost >= last.cost) break;
                heap[i] = heap[child];
                i = child;
              }
              heap[i] = last;
            }
            return first;
          }
          distance.set(stateKey(startIndex, 0), 0);
          push({ i: startIndex, d: 0, cost: 0 });
          let finish = null;
          while (heap.length) {
            const current = pop(),
              key = stateKey(current.i, current.d);
            if (current.cost !== distance.get(key)) continue;
            if (current.i === endIndex) {
              finish = key;
              break;
            }
            const x = current.i % width,
              y = Math.floor(current.i / width);
            for (const [nextX, nextY, direction] of [
              [x - 1, y, 1],
              [x + 1, y, 1],
              [x, y - 1, 2],
              [x, y + 1, 2],
            ]) {
              if (nextX < 0 || nextX >= width || nextY < 0 || nextY >= height) continue;
              const next = nextY * width + nextX,
                a = { x: xx[x], y: yy[y] },
                b = { x: xx[nextX], y: yy[nextY] };
              if (!routeClear(a, b, blocks)) continue;
              const nextKey = stateKey(next, direction);
              const cost =
                current.cost +
                Math.abs(a.x - b.x) +
                Math.abs(a.y - b.y) +
                (current.d && current.d !== direction ? 16 : 0);
              if (cost < (distance.get(nextKey) ?? Infinity)) {
                distance.set(nextKey, cost);
                previous.set(nextKey, key);
                push({ i: next, d: direction, cost });
              }
            }
          }
          if (finish === null) return compactRoute([start, { x: start.x, y: end.y }, end]);
          const result = [];
          for (let key = finish; key !== undefined; key = previous.get(key)) {
            const i = Math.floor(key / 3);
            result.push({ x: xx[i % width], y: yy[Math.floor(i / width)] });
          }
          return compactRoute(result.reverse());
        }

        /**
         * Construiește traseul complet între porturi, cu segmentele de ieșire și obstacolele relevante.
         */
        function routePath(p, q, sideA, sideB, from, to, rects) {
          const blocks = rects
            .filter(
              (r) =>
                r.id !== from &&
                r.id !== to &&
                !isDescendant(from, r.id) &&
                !isDescendant(to, r.id),
            )
            .map((r) => ({ x: r.x - 10, y: r.y - 10, right: r.right + 10, bottom: r.bottom + 10 }));
          const a = rects.find((r) => r.id === from),
            b = rects.find((r) => r.id === to);
          const separate =
            a && b && (a.right <= b.x || b.right <= a.x || a.bottom <= b.y || b.bottom <= a.y);
          const nodeBlocks = separate
            ? [
                { x: a.x + 5, y: a.y + 5, right: a.right - 5, bottom: a.bottom - 5 },
                { x: b.x + 5, y: b.y + 5, right: b.right - 5, bottom: b.bottom - 5 },
              ]
            : [];
          const allBlocks = [...blocks, ...nodeBlocks];
          // Dacă nu există obstacole între noduri, păstrează conexiunea dreaptă.
          if (
            separate &&
            (!gridSettings.snap || p.x === q.x || p.y === q.y) &&
            !allBlocks.some((r) => segmentHitsRect(p, q, r))
          )
            return [p, q];
          let neat = null;
          if (p.x === q.x || p.y === q.y) neat = [p, q];
          else if (
            (sideA === 'bottom' && sideB === 'top' && q.y - p.y >= 26) ||
            (sideA === 'top' && sideB === 'bottom' && p.y - q.y >= 26)
          ) {
            const mid = gridSettings.snap ? snapGrid((p.y + q.y) / 2) : (p.y + q.y) / 2;
            neat = [p, { x: p.x, y: mid }, { x: q.x, y: mid }, q];
          } else if (
            (sideA === 'right' && sideB === 'left' && q.x - p.x >= 26) ||
            (sideA === 'left' && sideB === 'right' && p.x - q.x >= 26)
          ) {
            const mid = gridSettings.snap ? snapGrid((p.x + q.x) / 2) : (p.x + q.x) / 2;
            neat = [p, { x: mid, y: p.y }, { x: mid, y: q.y }, q];
          }
          if (neat && neat.every((point, i) => !i || routeClear(neat[i - 1], point, allBlocks)))
            return compactRoute(neat);
          const start = routeStub(p, sideA),
            end = routeStub(q, sideB);
          return compactRoute([p, start, ...routeBetween(start, end, allBlocks), end, q]);
        }

        /**
         * Stabilește când o conexiune trebuie desenată direct între capete.
         */
        function directRoute(e, p, q) {
          return (
            e.direct &&
            (!gridSettings.snap ||
              (!gridNode(el(e.from)) && !gridNode(el(e.to))) ||
              p.x === q.x ||
              p.y === q.y)
          );
        }

        /**
         * Construiește o rută care trece prin punctul intermediar ales manual.
         */
        function waypointRoute(p, w, q) {
          if (gridSettings.snap && w.exitAxis === 'x')
            return compactRoute([p, { x: w.x, y: p.y }, { x: w.x, y: w.y }, { x: q.x, y: w.y }, q]);
          return gridSettings.snap
            ? compactRoute([p, { x: p.x, y: w.y }, w, { x: q.x, y: w.y }, q])
            : compactRoute([p, w, q]);
        }

        /**
         * Localizează jumătatea lungimii traseului pentru eticheta sau mânerul conexiunii.
         */
        function routeMidpoint(points) {
          let best = 0,
            at = points[0];
          for (let i = 1; i < points.length; i++) {
            const a = points[i - 1],
              b = points[i],
              len = Math.hypot(b.x - a.x, b.y - a.y);
            if (len > best) {
              best = len;
              at = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
            }
          }
          return at;
        }

        /**
         * Identifică intersecțiile dintre segmente pentru tratarea vizuală a traversărilor.
         */
        function routeCrossings(a, b) {
          const hits = [];
          for (let i = 1; i < a.length; i++) {
            const p = a[i - 1],
              q = a[i],
              dx = q.x - p.x,
              dy = q.y - p.y,
              len = Math.hypot(dx, dy);
            if (len < 25) continue;
            for (let j = 1; j < b.length; j++) {
              const s = b[j - 1],
                t = b[j],
                ex = t.x - s.x,
                ey = t.y - s.y,
                otherLen = Math.hypot(ex, ey),
                den = dx * ey - dy * ex;
              if (otherLen < 25 || Math.abs(den) < 0.001) continue;
              const rx = s.x - p.x,
                ry = s.y - p.y,
                u = (rx * ey - ry * ex) / den,
                v = (rx * dy - ry * dx) / den;
              if (
                u * len > 12 &&
                (1 - u) * len > 12 &&
                v * otherLen > 12 &&
                (1 - v) * otherLen > 12
              )
                hits.push({ segment: i, x: p.x + u * dx, y: p.y + u * dy, distance: u * len });
            }
          }
          return hits;
        }

        /**
         * Transformă punctele traseului în comenzi SVG, cu rotunjirea controlată a coturilor.
         */
        function routeSvg(points, bridges) {
          let d = `M ${points[0].x} ${points[0].y}`;
          for (let i = 1; i < points.length; i++) {
            const a = points[i - 1],
              b = points[i],
              dx = b.x - a.x,
              dy = b.y - a.y,
              len = Math.hypot(dx, dy);
            if (len < 0.001) continue;
            const ux = dx / len,
              uy = dy / len,
              next = points[i + 1],
              nx = next ? next.x - b.x : 0,
              ny = next ? next.y - b.y : 0,
              nextLen = Math.hypot(nx, ny),
              turn = nextLen && Math.abs(dx * ny - dy * nx) > 0.001,
              r = turn ? Math.min(8, len / 2, nextLen / 2) : 0,
              end = { x: b.x - ux * r, y: b.y - uy * r },
              hits = bridges
                .filter((h) => h.segment === i && h.distance > r + 9 && h.distance < len - r - 9)
                .sort((u, v) => u.distance - v.distance);
            let last = -Infinity;
            for (const h of hits) {
              if (h.distance - last < 17) continue;
              d += ` L ${h.x - ux * 7} ${h.y - uy * 7} Q ${h.x + uy * 9} ${h.y - ux * 9} ${h.x + ux * 7} ${h.y + uy * 7}`;
              last = h.distance;
            }
            d += ` L ${end.x} ${end.y}`;
            if (r) d += ` Q ${b.x} ${b.y} ${b.x + (nx / nextLen) * r} ${b.y + (ny / nextLen) * r}`;
          }
          return d;
        }

        /**
         * Returnează punctele efectiv folosite la desenarea unei conexiuni, reutilizând geometria calculată.
         */
        function paintedLinkPoints(points, source, target, fromPort, toPort) {
          // Capetele rămân exact în punctele de conexiune. Liniile sunt desenate peste noduri,
          // deci prelungirea spre interior ar suprapune linia peste suprafața nodului.
          return points;
        }
        // --- Desenarea zonei vizibile ------------------------------------------------------
        // Textul nodurilor din afara vederii este estimat; măsurarea se corectează când nodul devine vizibil.
        const textMeter = document.createElement('canvas').getContext('2d');
        textMeter.font = '15px system-ui';

        // ============================================================================
        // 08. Dimensiunile nodurilor și construirea elementelor vizuale
        // ============================================================================

        /**
         * Recunoaște nodurile de tip segment de rețea care pot avea un profil mai subțire.
         */
        function isNetworkSegment(n) {
          return n?.kind === 'network-segment';
        }

        /**
         * Estimează lățimea minimă necesară etichetei unui segment de rețea.
         */
        function networkSegmentTextWidth(n) {
          return Math.max(
            40,
            ...String(n.label || '')
              .split('\n')
              .map((line) => textMeter.measureText(line).width + 28),
          );
        }

        /**
         * Calculează înălțimea minimă în funcție de tipul nodului, text și capacitatea porturilor.
         */
        function minimumNodeHeight(n, width = null) {
          if (n.labelWrap)
            return Math.max(
              isNetworkSegment(n) ? 24 : 54,
              Math.max(cardinalPortCount(n, 'E'), cardinalPortCount(n, 'W')) > 1
                ? (Math.max(cardinalPortCount(n, 'E'), cardinalPortCount(n, 'W')) - 1) *
                    CARDINAL_SPACING +
                    CARDINAL_MARGIN * 2
                : 0,
            );
          const segment = isNetworkSegment(n),
            lines = String(n.label || '').split('\n'),
            widest = Math.max(0, ...lines.map((line) => textMeter.measureText(line).width)),
            targetWidth =
              width ||
              n.manualW ||
              (segment ? networkSegmentTextWidth(n) : Math.max(86, Math.min(360, widest + 38))),
            available = Math.max(1, targetWidth - (segment ? 28 : 34)),
            rows = n.labelPos
              ? 0
              : lines.reduce(
                  (sum, line) =>
                    sum + Math.max(1, Math.ceil(textMeter.measureText(line).width / available)),
                  0,
                ),
            verticalRows =
              !segment && cardinalPortCount(n, 'N') > 0 && cardinalPortCount(n, 'S') > 0 ? 42 : 0,
            requiredHeight =
              Math.max(cardinalPortCount(n, 'E'), cardinalPortCount(n, 'W')) > 1
                ? (Math.max(cardinalPortCount(n, 'E'), cardinalPortCount(n, 'W')) - 1) *
                    CARDINAL_SPACING +
                  CARDINAL_MARGIN * 2
                : 0;
          return Math.max(
            n.labelPos ? 4 : segment ? 24 : 54,
            n.labelPos ? 0 : segment ? 12 + rows * 20 : 12 + rows * 21,
            verticalRows,
            requiredHeight,
          );
        }

        /**
         * Estimează dimensiunile naturale ale nodului, respectând dimensiunile manuale și spațiul necesar porturilor.
         */
        function naturalSize(n) {
          const signature = JSON.stringify([
            n.kind,
            n.labelWrap,
            n.label,
            n.manualW,
            n.manualH,
            n.ports,
            n.portSlots,
            n.grid,
            gridSettings.step,
            !!n.labelPos,
          ]);
          const cached = naturalSizes.get(n.id);
          if (cached?.signature === signature) return cached;
          const lines = String(n.label || '').split('\n');
          const widest = Math.max(0, ...lines.map((line) => textMeter.measureText(line).width));
          const requiredWidth =
            Math.max(cardinalPortCount(n, 'N'), cardinalPortCount(n, 'S')) > 1
              ? (Math.max(cardinalPortCount(n, 'N'), cardinalPortCount(n, 'S')) - 1) *
                  CARDINAL_SPACING +
                CARDINAL_MARGIN * 2
              : 0;
          const requiredHeight =
            Math.max(cardinalPortCount(n, 'E'), cardinalPortCount(n, 'W')) > 1
              ? (Math.max(cardinalPortCount(n, 'E'), cardinalPortCount(n, 'W')) - 1) *
                  CARDINAL_SPACING +
                CARDINAL_MARGIN * 2
              : 0;
          const segment = isNetworkSegment(n),
            w = Math.max(
              segment ? 40 : 86,
              n.manualW || 0,
              n.labelWrap
                ? n.manualW || 160
                : segment
                  ? networkSegmentTextWidth(n)
                  : Math.min(360, widest + 38),
              requiredWidth,
            ),
            size = {
              signature,
              w,
              h: Math.max(minimumNodeHeight(n, w), n.manualH || 0, requiredHeight),
            };
          if (gridNode(n)) {
            size.w = gridExtent(
              Math.max(
                size.w,
                segment ? 2 * gridSettings.step : 160,
                gridPortMinimum(n, ['N', 'S']),
              ),
            );
            size.h = gridExtent(
              Math.max(
                size.h,
                segment ? 2 * gridSettings.step : 80,
                minimumNodeHeight(n, size.w),
                gridPortMinimum(n, ['E', 'W']),
              ),
            );
          }
          naturalSizes.set(n.id, size);
          return size;
        }

        /**
         * Recalculează dimensiunile nodurilor și ale containerelor când modelul geometric s-a schimbat.
         */
        function calculateNodeSizes(force = false) {
          if (!force && sizesVersion === geometryVersion) return;
          const children = new Map(nodes.map((n) => [n.id, []]));
          for (const n of nodes) if (children.has(n.parent)) children.get(n.parent).push(n);
          const done = new Set(),
            visiting = new Set();

          /**
           * Măsoară recursiv un nod și descendenții lui, păstrând rezultatele pentru a evita repetarea calculelor.
           */
          function measure(n) {
            if (done.has(n.id)) return nodeSizes.get(n.id);
            if (visiting.has(n.id)) return naturalSize(n);
            visiting.add(n.id);
            const base = naturalSize(n),
              size = { w: base.w, h: base.h };
            for (const child of children.get(n.id)) {
              const inside = measure(child);
              const bounds = nodeVisualRectForSize(child, inside);
              size.w = Math.max(size.w, bounds.right - n.x + 18);
              size.h = Math.max(size.h, bounds.bottom - n.y + 18);
            }
            if (gridNode(n)) {
              size.w = gridExtent(size.w);
              size.h = gridExtent(size.h);
            }
            ensurePortSlots(n, size);
            visiting.delete(n.id);
            done.add(n.id);
            nodeSizes.set(n.id, size);
            return size;
          }
          for (const n of nodes) measure(n);
          sizesVersion = geometryVersion;
        }

        /**
         * Construiește reprezentarea DOM a unui nod; eticheta utilizatorului este introdusă exclusiv ca text.
         */
        function createNodeElement(n, hasChildren) {
          hasChildren ||= n.kind === 'container';
          const d = document.createElement('div');
          const selectedNode = selectedNodes.has(n.id);
          d.className =
            'node' +
            (isNetworkSegment(n) ? ' network-segment' : '') +
            (selectedNode ? ' selected' : '') +
            (n.parent ? ' child' : '') +
            (hasChildren ? ' container' : '') +
            (n.labelPos || (labelPositionMode && selectedNode) ? ' label-positioned' : '') +
            (labelPositionMode && selectedNode ? ' label-position-mode' : '');
          d.dataset.id = n.id;
          d.style.left = n.x + 'px';
          d.style.top = n.y + 'px';
          d.style.zIndex = String(2 * (nodePaintRanks().get(n.id) || 1));
          d.style.transform = `rotate(${Number(n.rotation) || 0}deg)`;
          d.classList.toggle(
            'no-paint-shadow',
            n.fill === 'transparent' || n.stroke === 'transparent',
          );
          if (n.fill) d.style.backgroundColor = n.fill;
          if (n.stroke) d.style.borderColor = n.stroke;
          if (n.borderStyle) d.style.borderStyle = n.borderStyle;
          d.innerHTML =
            '<span class="label"></span><span class="resize-corner nw"></span><span class="resize-corner ne"></span><span class="resize-corner sw"></span><span class="resize-corner se"></span><span class="resize-corner n"></span><span class="resize-corner e"></span><span class="resize-corner s"></span><span class="resize-corner w"></span>';
          const label = d.querySelector('.label');
          d.dataset.kind = n.kind || 'node';
          d.dataset.wrap = n.labelWrap || 'auto';
          label.textContent = n.labelWrap
            ? nodeLabelLines(
                n,
                Math.max(20, dimensions(n).w - (['firewall', 'vm'].includes(n.kind) ? 60 : 34)),
              ).join('\n')
            : n.label || '';
          if (['firewall', 'vm'].includes(n.kind)) {
            const badge = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            badge.classList.add('node-role');
            badge.setAttribute('viewBox', '0 0 28 28');
            badge.setAttribute('aria-label', NODE_KINDS[n.kind]);
            const symbol = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            symbol.setAttribute('d', nodeRolePath(n.kind, 2, 2, 24));
            badge.append(symbol);
            d.append(badge);
          }
          if (n.sync) {
            const badge = document.createElement('span');
            badge.className = 'sync-badge';
            badge.textContent = '↔';
            badge.title = 'Grup: ' + n.sync.settings.name;
            d.append(badge);
          }
          const defaultLabelPos =
            n.labelPos ||
            (labelPositionMode && selectedNode && hasChildren
              ? { x: Math.min(0.5, 19 / dimensions(n).w), y: Math.min(0.5, 6 / dimensions(n).h) }
              : null);
          if (defaultLabelPos) {
            const labelX = Number.isFinite(defaultLabelPos.x) ? defaultLabelPos.x : 0.5,
              labelY = Number.isFinite(defaultLabelPos.y) ? defaultLabelPos.y : 0.5;
            label.style.setProperty('--label-x', `${labelX * 100}%`);
            label.style.setProperty('--label-y', `${labelY * 100}%`);
          }
          if (n.textColor) label.style.color = n.textColor;
          if (n.manualW) d.style.width = n.manualW + 'px';
          if (n.manualH) d.style.height = n.manualH + 'px';
          label.addEventListener('pointerdown', (e) => beginLabelMove(e, n));
          d.addEventListener('pointerdown', (e) => nodeDown(e, n));
          d.querySelectorAll('.resize-corner').forEach((c) =>
            c.addEventListener('pointerdown', (e) =>
              resizeDown(
                e,
                n,
                [...c.classList].find((x) =>
                  ['nw', 'ne', 'sw', 'se', 'n', 'e', 's', 'w'].includes(x),
                ),
              ),
            ),
          );
          d.addEventListener('click', (e) => {
            e.stopPropagation();
            if (connectMode) {
              if (!connectFrom) {
                connectFrom = n.id;
                d.classList.add('selected');
                toast('Alege nodul de destinație');
              } else if (connectFrom !== n.id) {
                const source = el(connectFrom),
                  edge = {
                    id: 'e' + Date.now() + Math.random().toString(16).slice(2, 5),
                    from: connectFrom,
                    to: n.id,
                    label: '',
                  };
                if (source && hasCardinalPorts(source))
                  edge.fromPort = nearestPortName(source, nodeCenter(n));
                if (hasCardinalPorts(n)) edge.toPort = nearestPortName(n, nodeCenter(source));
                edges.push(edge);
                connectMode = false;
                connectFrom = null;
                $('#connect').classList.remove('active');
                selected = null;
                remember();
                render();
              }
              return;
            }
            if (e.shiftKey || e.ctrlKey || e.metaKey || multiMode) {
              selectedNodes.has(n.id) ? selectedNodes.delete(n.id) : selectedNodes.add(n.id);
            } else if (!selectedNodes.has(n.id)) selectedNodes = new Set([n.id]);
            selected = null;
            refreshNodeSelection();
            if (multiMode) setMultiMode(false);
          });
          d.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            if (!labelPositionMode) editNode(d, n);
          });
          return d;
        }

        /**
         * Corectează coordonatele sau dimensiunile inutilizabile și semnalează repararea geometriei.
         */
        function repairInvalidGeometry() {
          const invalid = nodes.filter((node) => !usableRect(nodeRect(node)));
          if (!invalid.length) return;
          const valid = nodes.filter((node) => usableRect(nodeRect(node))),
            bounds = valid.length ? zoneBounds(valid) : null;
          const columns = Math.ceil(Math.sqrt(invalid.length)),
            cellW = 180,
            cellH = 120;
          const startX = bounds
            ? bounds.x
            : (canvas.clientWidth / 2 - pan.x) / scale - (columns * cellW) / 2;
          const startY = bounds
            ? bounds.bottom + 80
            : (canvas.clientHeight / 2 - pan.y) / scale -
              (Math.ceil(invalid.length / columns) * cellH) / 2;
          invalid.forEach((node, index) => {
            node.x = Math.round(
              Math.max(
                -MAX_WORLD_COORD / 2,
                Math.min(MAX_WORLD_COORD / 2, startX + (index % columns) * cellW),
              ),
            );
            node.y = Math.round(
              Math.max(
                -MAX_WORLD_COORD / 2,
                Math.min(MAX_WORLD_COORD / 2, startY + Math.floor(index / columns) * cellH),
              ),
            );
          });
          geometryVersion++;
          calculateNodeSizes(true);
          remember();
          render(true);
