        /**
         * Reorganizează controalele existente în grupuri conform preferințelor, fără a elimina comenzile din API.
         */
        function applyToolbarSettings() {
          const toolbar = $('#toolbarActions'),
            rightToolbar = $('#toolbarRight'),
            bar = $('#bar');
          let parking = $('#toolbarParking');
          if (!parking) {
            parking = document.createElement('div');
            parking.id = 'toolbarParking';
            parking.hidden = true;
            document.body.appendChild(parking);
          }
          toolbar.replaceChildren();
          rightToolbar.replaceChildren();
          bar.style.setProperty('--toolbar-brand-after', `${toolbarSettings.brandGap}px`);
          bar.style.setProperty('--toolbar-version-gap', `${toolbarSettings.versionGap}px`);
          for (let index = 0; index < toolbarSettings.groups.length; index++) {
            const group = toolbarSettings.groups[index],
              wrapper = document.createElement('div');
            wrapper.className = 'toolbar-subgroup';
            wrapper.dataset.groupId = group.id;
            const host = group.side === 'right' ? rightToolbar : toolbar;
            for (const id of group.items) {
              const item = TOOLBAR_ELEMENTS[id];
              if (!item) continue;
              if (id === 'nodeStyle' || id === 'edgeStyle') {
                if (!toolbarSettings.enabled[id]) {
                  item.hidden = true;
                  parking.appendChild(item);
                  continue;
                }
              } else item.hidden = !toolbarSettings.enabled[id];
              wrapper.appendChild(item);
            }
            host.appendChild(wrapper);
            const laterVisible = toolbarSettings.groups
              .slice(index + 1)
              .some(
                (next) =>
                  next.side === group.side && next.items.some((id) => toolbarSettings.enabled[id]),
              );
            const visible = group.items.some((id) => toolbarSettings.enabled[id]);
            if (visible && laterVisible) {
              const gap = document.createElement('span');
              gap.className = 'toolbar-group-gap';
              gap.style.width = Math.max(8, Number(group.gapAfter) || 0) + 'px';
              gap.title = `Spațiu după grupul „${group.name}”: ${Number(group.gapAfter) || 0}px`;
              gap.setAttribute('aria-hidden', 'true');
              host.appendChild(gap);
            }
          }
          saveToolbarSettings();
          syncEdgeStyle();
          updateToolbarLabels();
        }

        /**
         * Construiește interfața de configurare pentru grupuri, ordinea butoanelor, vizibilitate și spațiere.
         */
        function renderToolbarSettings() {
          const box = $('#toolbarSettings');
          if (!box) return;
          box.replaceChildren();
          const brandSettings = document.createElement('div');
          brandSettings.className = 'toolbar-brand-settings';
          const brandTitle = document.createElement('strong');
          brandTitle.textContent = 'ELS și versiune';
          brandSettings.appendChild(brandTitle);
          for (const [key, label, max] of [
            ['versionGap', 'Spațiu între ELS și versiune', 32],

          ]) {
            const row = document.createElement('label');
            row.className = 'toolbar-gap-setting';
            row.append(document.createTextNode(label));
            const range = document.createElement('input');
            range.type = 'range';
            range.min = '0';
            range.max = String(max);
            range.step = '2';
            range.value = String(toolbarSettings[key]);
            const output = document.createElement('output');
            output.textContent = `${toolbarSettings[key]}px`;
            range.setAttribute('aria-label', label);
            range.addEventListener('input', () => {
              toolbarSettings[key] = Number(range.value);
              output.textContent = `${toolbarSettings[key]}px`;

            row.append(range, output);
            brandSettings.appendChild(row);
          }
          box.appendChild(brandSettings);
          const note = document.createElement('p');

        // Proprietățile explicite ale nodurilor și conexiunilor sunt salvate în modelul ELS.
        const NODE_KINDS = {
          node: 'Nod',
          'network-segment': 'Segment de rețea',
          firewall: 'Firewall',
          vm: 'Mașină virtuală',
          container: 'Grup / container',
        };
        const TEXT_MOVE_GAP = 14;

        /** Măsoară textul conexiunii în coordonatele diagramei, inclusiv diferența dintre centru și linia de bază SVG. */
        function edgeTextMetrics(edge) {
          const text = [...world.querySelectorAll('text.edge-label')].find(
            (item) => item.dataset.edge === edge.id,
          );
          if (text) {
            try {
              const box = text.getBBox();
              return {
                halfW: box.width / 2,
                halfH: box.height / 2,
                offsetY: box.y + box.height / 2 - Number(text.getAttribute('y')),
              };
            } catch {}
          }
          textMeter.font = '14px system-ui';
          return {
            halfW: textMeter.measureText(edge.label || '').width / 2,
            halfH: 7,
            offsetY: -5,
          };
        }

        /** Limitează centrul etichetei la vecinătatea traseului; ține cont de lățimea textului pe segmente verticale și de înălțime pe cele orizontale. */
        function constrainEdgeText(points, desired, metrics) {
          if (points.length < 2) return desired;
          const rx = Math.max(1, metrics.halfW + TEXT_MOVE_GAP),
            ry = Math.max(1, metrics.halfH + TEXT_MOVE_GAP);
          const scaled = points.map((p) => ({ x: p.x / rx, y: p.y / ry }));
          const project = (p) =>
            nearestEdgeSegment(scaled, { x: p.x / rx, y: (p.y + metrics.offsetY) / ry });
          const nearest = project(desired),
            ratio = nearest.distance > 1 ? 1 / nearest.distance : 1;
          const bounded = {
            x: (nearest.x + (desired.x / rx - nearest.x) * ratio) * rx,
            y:
              (nearest.y + ((desired.y + metrics.offsetY) / ry - nearest.y) * ratio) * ry -
              metrics.offsetY,
          };
          if (!gridSettings.snap) return bounded;
          const base = { x: snapGrid(bounded.x), y: snapGrid(bounded.y) },
            step = gridSettings.step;
          let best = null,
            distance = Infinity;
          for (let x = -1; x <= 1; x++)
            for (let y = -1; y <= 1; y++) {
              const candidate = { x: base.x + x * step, y: base.y + y * step },
                d = Math.hypot(candidate.x - desired.x, candidate.y - desired.y);
              if (d < distance && project(candidate).distance <= 1.00001) {
                best = candidate;
                distance = d;
              }
            }
          return best || bounded;
        }

        /** Întoarce dreptunghiul vizibil al textului, fără spațiul gol al unui span întins pe lățimea nodului. */
        function textScreenRect(text) {
          const box = text.getBoundingClientRect();
          if (text.namespaceURI === 'http://www.w3.org/2000/svg') return box;
          const range = document.createRange();
          range.selectNodeContents(text);
          const ink = range.getBoundingClientRect();
          const left = Math.max(box.left, ink.left),
            right = Math.min(box.right, ink.right),
            top = Math.max(box.top, ink.top),
            bottom = Math.min(box.bottom, ink.bottom);
          return right > left && bottom > top
            ? { left, right, top, bottom, width: right - left, height: bottom - top }
            : box;
        }

        /** Desenează același mâner pentru ambele tipuri de text, cu dimensiune constantă pe ecran; nu modifică modelul sau exportul. */
        function renderTextMoveHandles() {
          let layer = $('#textMoveHandles');
          if (!layer) {
            layer = document.createElement('div');
            layer.id = 'textMoveHandles';
            layer.className = 'text-move-layer';
            canvas.append(layer);
          }
          if (overviewActive || connectMode || portPositionMode || multiMode) {
            layer.hidden = true;
            return;
          }
          let kind, id, text;
          if (selectedNodes.size === 1) {
            id = [...selectedNodes][0];
            const node = el(id),
              element = [...world.querySelectorAll('.node')].find((item) => item.dataset.id === id);
            if (node?.label && element && !element.classList.contains('editing')) {
              kind = 'node';
              text = element.querySelector('.label');
            }
          } else if (selected) {
            const edge = edges.find((item) => item.id === selected);
            if (edge?.label) {
              kind = 'edge';
              id = edge.id;
              text = [...world.querySelectorAll('text.edge-label')].find(
                (item) => item.dataset.edge === id,
              );
            }
          }
          if (!text) {
            layer.hidden = true;
            return;
          }
          const rect = textScreenRect(text),
            origin = canvas.getBoundingClientRect();
          if (!rect.width || !rect.height) {
            layer.hidden = true;
            return;
          }
          layer.hidden = false;
          let handle = layer.firstElementChild;
          if (!handle || handle.dataset.kind !== kind || handle.dataset.owner !== id) {
            handle = document.createElement('span');
            handle.className = 'text-move-handle';
            handle.dataset.kind = kind;
            handle.dataset.owner = id;
            const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            icon.setAttribute('viewBox', '0 0 16 16');
            icon.setAttribute('aria-hidden', 'true');
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute(
              'd',
              'M8 1v14 M1 8h14 M5.5 3.5 8 1l2.5 2.5 M12.5 5.5 15 8l-2.5 2.5 M10.5 12.5 8 15l-2.5-2.5 M3.5 10.5 1 8l2.5-2.5',
            );
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', 'currentColor');
            path.setAttribute('stroke-width', '1.4');
            icon.append(path);
            handle.append(icon);
            handle.title = kind === 'node' ? 'Mută textul nodului' : 'Mută textul conexiunii';
            handle.setAttribute('aria-label', handle.title);
            handle.addEventListener('pointerdown', (event) => {
              if (kind === 'node') {
                const node = el(id);
                if (node) beginLabelMove(event, node, true);
              } else {
                const edge = edges.find((item) => item.id === id),
                  route = collectEdgePaths(false).find((item) => item.e.id === id);
                if (edge && route) beginEdgeLabel(event, edge, route.points);
              }
            });
            handle.addEventListener('click', (event) => {
              event.preventDefault();
              event.stopPropagation();
            });
            layer.replaceChildren(handle);
          }
          handle.style.left = rect.left - origin.left - 13 + 'px';
          handle.style.top = rect.top - origin.top + rect.height / 2 + 'px';
          handle.classList.toggle(
            'active',
            ((kind === 'node' && drag?.kind === 'label-position') ||
              (kind === 'edge' && drag?.kind === 'edge-label')) &&
              drag.id === id,
          );
        }
        const SYNC_PROPERTIES = {
          label: 'Nume',
          fill: 'Fundal',
          stroke: 'Contur',
          textColor: 'Culoare text',
          manualW: 'Lățime',
          manualH: 'Înălțime',
        };
        let selectedEdgePoint = null,
          selectedEdgeEnd = null,
          propertiesCollapsed = false,
          syncHighlight = null,
          syncHighlightTimer = 0;
        const toolbarHomes = new Map();

        /** Enumeră grupurile sincronizate ale nodurilor selectate, plus grupul cerut temporar prin comandă. */
        function activeSyncGroups() {
          const groups = new Set();
          for (const node of nodes)
            if (selectedNodes.has(node.id) && node.sync) groups.add(node.sync.id);
          if (syncHighlight) groups.add(syncHighlight);
          return groups;
        }

        /** Marchează toți membrii vizibili cât timp un membru al grupului rămâne selectat; nu schimbă modelul sau culorile salvate. */
        function refreshSyncHighlights() {
          const groups = activeSyncGroups();
          for (const element of world.querySelectorAll('.node')) {
            const node = el(element.dataset.id),
              active = !!node?.sync && groups.has(node.sync.id);
            element.classList.toggle('sync-peer', active);
            const badge = element.querySelector('.sync-badge');
            if (badge) {
              badge.classList.toggle('active', active);
              badge.textContent = active ? node.sync.settings.name || 'Grup sincronizat' : '↔';
            }
          }
        }

        /** Actualizează marcajul punctului selectat fără a înlocui elementul apăsat sau a modifica traseul. */
        function refreshSelectedEdgePoint() {
          for (const handle of edgeHandles.querySelectorAll('.edge-handle')) {
            const active =
              handle.dataset.edge === selected &&
              (handle.dataset.point !== undefined
                ? Number(handle.dataset.point) === selectedEdgePoint
                : handle.dataset.end === selectedEdgeEnd);
            handle.classList.toggle('active', active);
            handle.setAttribute('aria-pressed', String(active));
          }
        }

        /** Selectează un cot automat sau manual după index; selecția rămâne o stare a interfeței. */
        function selectEdgePoint(index, edgeId = selected) {
          const route = collectEdgePaths(false).find((item) => item.e.id === edgeId);
          if (
            !route ||
            (index !== null &&
              (!Number.isInteger(index) || index < 0 || index >= route.points.length - 2))
          )
            return false;
          if (selected !== edgeId) selectEdge(edgeId);
          selected = edgeId;
          selectedNodes.clear();
          selectedEdgePoint = index;
          selectedEdgeEnd = null;
          refreshSelectedEdgePoint();
          renderProperties();
          return true;
        }

        /** Selectează capătul de început sau sfârșit fără a muta, deconecta ori reruta legătura. */
        function selectEdgeEnd(end, edgeId = selected) {
          if (!['from', 'to'].includes(end) || !edges.some((edge) => edge.id === edgeId))
            return false;
          if (selected !== edgeId) selectEdge(edgeId);
          selected = edgeId;
          selectedNodes.clear();
          selectedEdgePoint = null;
          selectedEdgeEnd = end;
          refreshSelectedEdgePoint();
          renderProperties();
          return true;
        }

        /** Întoarce punctele manuale în ordinea sursă–destinație; acceptă și vechiul câmp cu un singur punct. */
        function edgeWaypoints(edge) {
          return edge.waypoints || (edge.waypoint ? [edge.waypoint] : []);
        }

        /** Calculează punctul de pe un segment cel mai apropiat de poziția dată; t este fracția între cele două capete. */
        function projectToSegment(point, a, b) {
          const dx = b.x - a.x,
            dy = b.y - a.y,
            length = dx * dx + dy * dy;
          const t = length
            ? Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / length))
            : 0;
          const x = a.x + t * dx,
            y = a.y + t * dy;
          return { x, y, t, distance: Math.hypot(point.x - x, point.y - y) };
        }

        /** Identifică segmentul cel mai apropiat dintr-un traseu, păstrând indexul necesar inserării unui punct. */
        function nearestEdgeSegment(points, position) {
          let best = {
            segment: 0,
            t: 0,
            x: points[0]?.x || 0,
            y: points[0]?.y || 0,
            distance: Infinity,
          };
          for (let i = 0; i < points.length - 1; i++) {
            const candidate = projectToSegment(position, points[i], points[i + 1]);
            if (candidate.distance < best.distance) best = { ...candidate, segment: i };
          }
          return best;
        }

        /** Reconstituie poziția textului din segment, fracția t și decalaj; pentru un text nemutat folosește mijlocul traseului. */
        function edgeLabelPoint(edge, points) {
          const anchor = edge.labelAnchor;
          if (!anchor || points.length < 2) {
            const p = routeMidpoint(points);
            return { x: p.x, y: p.y - 8 };
          }
          const i = Math.min(anchor.segment, points.length - 2),
            a = points[i],
            b = points[i + 1];
          return {
            x: a.x + (b.x - a.x) * anchor.t + anchor.dx,
            y: a.y + (b.y - a.y) * anchor.t + anchor.dy,
          };
        }

        /** Transformă poziția pointerului în coordonate de diagramă, independent de zoom. */
        function pointerWorld(event) {
          const p = local(event);
          return { x: (p.x - pan.x) / scale, y: (p.y - pan.y) / scale };
        }

        /** Reancorează textul după inserarea sau ștergerea unui segment, păstrând poziția lui pe planșă. */
        function preserveEdgeLabel(edge, previousPoints, nextPoints) {
          if (!edge.labelAnchor) return;
          const position = edgeLabelPoint(edge, previousPoints),
            nearest = nearestEdgeSegment(nextPoints, position);
          edge.labelAnchor = {
            segment: nearest.segment,
            t: nearest.t,
            dx: position.x - nearest.x,
            dy: position.y - nearest.y,
          };
        }

        /** Fixează traseul vizibil și inserează un punct pe segmentul indicat; celelalte vârfuri nu sunt rerutate. */
        function addEdgePoint(edgeId, position, segmentIndex = null) {
          const edge = edges.find((item) => item.id === edgeId),
            route = collectEdgePaths(false).find((item) => item.e.id === edgeId);
          if (
            !edge ||
            !route ||
            edgeWaypoints(edge).length >= 64 ||
            !Number.isFinite(position?.x) ||
            !Number.isFinite(position?.y)
          )
            return false;
          if (
            segmentIndex !== null &&
            (!Number.isInteger(segmentIndex) ||
              segmentIndex < 0 ||
              segmentIndex >= route.points.length - 1)
          )
            return false;
          const near =
              segmentIndex === null
                ? nearestEdgeSegment(route.points, position)
                : { segment: segmentIndex },
            round = gridSettings.snap ? snapGrid : Math.round;
          if (route.points.length - 2 >= 64) return false;
          edge.waypoints = route.points.slice(1, -1).map((p) => ({ ...p }));
          edge.waypoints.splice(near.segment, 0, { x: round(position.x), y: round(position.y) });
          preserveEdgeLabel(edge, route.points, [
            route.points[0],
            ...edge.waypoints,
            route.points.at(-1),
          ]);
          delete edge.waypoint;
          delete edge.direct;
          selected = edge.id;
          selectedNodes.clear();
          selectedEdgePoint = near.segment;
          selectedEdgeEnd = null;
          remember();
          render();
          return true;
        }

        /** Inserează din panou la mijlocul segmentului de după punctul selectat sau al celui mai lung segment. */
        function addEdgePointFromPanel(edgeId = selected) {
          const route = collectEdgePaths(false).find((item) => item.e.id === edgeId);
          if (!route || route.points.length < 2) return false;
          let segment =
            selectedEdgeEnd === 'from'
              ? 0
              : selectedEdgeEnd === 'to'
                ? route.points.length - 2
                : selectedEdgePoint === null
                  ? 0
                  : Math.min(selectedEdgePoint + 1, route.points.length - 2);
          if (selectedEdgePoint === null && selectedEdgeEnd === null) {
            let longest = -1;
            for (let i = 0; i < route.points.length - 1; i++) {
              const a = route.points[i],
                b = route.points[i + 1],
                length = Math.hypot(b.x - a.x, b.y - a.y);
              if (length > longest) {
                longest = length;
                segment = i;
              }
            }
          }
          const a = route.points[segment],
            b = route.points[segment + 1],
            round = gridSettings.snap ? snapGrid : Math.round;
          const position = { x: round((a.x + b.x) / 2), y: round((a.y + b.y) / 2) };
          if (
            (position.x === a.x && position.y === a.y) ||
            (position.x === b.x && position.y === b.y)
          ) {
            toast('Segmentul este prea scurt pentru un punct nou pe grilă.');
            return false;
          }
          return addEdgePoint(edgeId, position, segment);
        }

        /** Elimină numai punctul selectat; identitatea și capetele conexiunii rămân neschimbate. */
        function removeEdgePoint(edgeId = selected, index = selectedEdgePoint) {
          const edge = edges.find((item) => item.id === edgeId);
          if (!edge || !Number.isInteger(index)) return false;
          const route = collectEdgePaths(false).find((item) => item.e.id === edgeId);
          if (!route || route.points.length - 2 > 64) return false;
          const points = route.points.slice(1, -1).map((p) => ({ ...p }));
          if (!points[index]) return false;
          points.splice(index, 1);
          if (route)
            preserveEdgeLabel(edge, route.points, [
              route.points[0],
              ...points,
              route.points.at(-1),
            ]);
          edge.waypoints = points;
          delete edge.waypoint;
          selectedEdgePoint = null;
          remember();
          render();
          return true;
        }

        /** Elimină traseul manual doar la comanda explicită de revenire la rutare automată. */
        function resetEdgeRoute(edgeId = selected) {
          const edge = edges.find((item) => item.id === edgeId);
          if (!edge) return;
          delete edge.waypoints;
          delete edge.waypoint;
          delete edge.direct;
          selectedEdgePoint = null;
          remember();
          render();
        }

        /** Inițiază tragerea textului și păstrează ancora anterioară pentru anularea gestului. */
        function beginEdgeLabel(event, edge, points) {
          if (event.button !== 0) return;
          if (selected !== edge.id) {
            beginPan(event, { edgeId: edge.id });
            return;
          }
          event.preventDefault();
          event.stopPropagation();
          selected = edge.id;
          selectedNodes.clear();
          selectedEdgePoint = null;
          selectedEdgeEnd = null;
          const start = edgeLabelPoint(edge, points);
          drag = {
            kind: 'edge-label',
            id: edge.id,
            points,
            start,
            original: edge.labelAnchor ? { ...edge.labelAnchor } : null,
            startClientX: event.clientX,
            startClientY: event.clientY,
            moved: false,
            metrics: edgeTextMetrics(edge),
          };
          event.target.setPointerCapture?.(event.pointerId);
          renderTextMoveHandles();
        }

        /** Mută textul pe grilă și înregistrează ancora pe segmentul cel mai apropiat, fără a schimba traseul. */
        function moveEdgeLabel(event) {
          const edge = edges.find((item) => item.id === drag.id);
          if (!edge) return;
          const dx = (event.clientX - drag.startClientX) / scale,
            dy = (event.clientY - drag.startClientY) / scale;
          if (!drag.moved && Math.hypot(dx, dy) < 3 / scale) return;
          if (!drag.moved) canvas.setPointerCapture(event.pointerId);
          drag.moved = true;
          const round = gridSettings.snap ? snapGrid : Math.round,
            p = constrainEdgeText(
              drag.points,
              { x: round(drag.start.x + dx), y: round(drag.start.y + dy) },
              drag.metrics,
            );
          const nearest = nearestEdgeSegment(drag.points, p);
          edge.labelAnchor = {
            segment: nearest.segment,
            t: nearest.t,
            dx: p.x - nearest.x,
            dy: p.y - nearest.y,
          };
          drawEdges(true);
        }

        /** Construiește triunghiul unei săgeți folosind primul segment nenul de la capătul ales. */
        function edgeArrowPath(points, start = false) {
          const sequence = start ? points : [...points].reverse(),
            tip = sequence[0],
            other = sequence.find((p) => p.x !== tip.x || p.y !== tip.y);
          if (!other) return '';
          const distance = Math.hypot(other.x - tip.x, other.y - tip.y),
            ux = (other.x - tip.x) / distance,
            uy = (other.y - tip.y) / distance;
          const length = Math.min(14, distance),
            width = length * 0.45,
            bx = tip.x + ux * length,
            by = tip.y + uy * length;
          return `M ${tip.x} ${tip.y} L ${bx - uy * width} ${by + ux * width} L ${bx + uy * width} ${by - ux * width} Z`;
        }

        /** Întoarce formele săgeților cerute explicit pentru conexiune, utilizabile în SVG, canvas și export. */
        function edgeArrowPaths(edge, points) {
          const paths = [];
          if (['start', 'both'].includes(edge.arrows)) paths.push(edgeArrowPath(points, true));
          if (['end', 'both'].includes(edge.arrows)) paths.push(edgeArrowPath(points, false));
          return paths.filter(Boolean);
        }

        /** Împarte eticheta pentru afișare, păstrând textul original în model; modul manual respectă exclusiv rândurile introduse. */
        function nodeLabelLines(node, width) {
          const text = String(node.label || '');
          if (node.labelWrap === 'single') return [text.replace(/\n/g, ' ')];
          if (node.labelWrap === 'manual') return text.split('\n');
          const result = [];
          textMeter.font = '15px system-ui';
          for (const paragraph of text.split('\n')) {
            let line = '';
            for (const part of paragraph.match(/[^\s_-]+[_-]?|\s+|[_-]/g) || ['']) {
              if (line && textMeter.measureText(line + part).width > width) {
                result.push(line.trimEnd());
                line = '';
              }
              for (const char of part) {
                if (line && textMeter.measureText(line + char).width > width) {
                  result.push(line.trimEnd());
                  line = '';
                }
                line += char;
              }
            }
            result.push(line.trimEnd());
          }
          return result.length ? result : [''];
        }

        /** Generează simbolul geometric al rolului în coordonate locale, fără imagini sau resurse externe. */
        function nodeRolePath(kind, x, y, size = 24) {
          const s = size / 24;
          if (kind === 'firewall')
            return `M${x} ${y}h${24 * s}v${24 * s}H${x}Z M${x} ${y + 8 * s}h${24 * s} M${x} ${y + 16 * s}h${24 * s} M${x + 12 * s} ${y}v${8 * s} M${x + 6 * s} ${y + 8 * s}v${8 * s} M${x + 18 * s} ${y + 8 * s}v${8 * s} M${x + 12 * s} ${y + 16 * s}v${8 * s}`;
          if (kind === 'vm')
            return `M${x} ${y}h${24 * s}v${17 * s}H${x}Z M${x + 12 * s} ${y + 17 * s}v${6 * s} M${x + 5 * s} ${y + 23 * s}h${14 * s}`;
          return '';
        }

        /** Aplică rolul vizual fără a schimba ID-ul, părintele sau conexiunile; dimensiunile sunt aliniate la grilă. */
        function setNodeKind(kind, ids = [...selectedNodes]) {
          if (!Object.hasOwn(NODE_KINDS, kind)) return false;
          for (const id of ids) {
            const n = el(id);
            if (!n) continue;
            n.kind = kind;
            if (kind === 'network-segment' && !nodes.some((child) => child.parent === id)) {
              n.manualW = gridExtent(n.manualW || 200);
              n.manualH = gridExtent(Math.max(40, gridPortMinimum(n, ['E', 'W'])));
            } else if (['firewall', 'vm'].includes(kind)) {
              n.manualW = gridExtent(Math.max(160, n.manualW || 160));
              n.manualH = gridExtent(Math.max(80, n.manualH || 80));
            }
          }
          naturalSizes.clear();
          remember();
          render();
          return true;
        }

        /** Fixează modul textului și păstrează dimensiunea curentă, astfel schimbarea afișării nu mută porturile. */
        function setNodeWrap(mode, ids = [...selectedNodes]) {
          if (!['auto', 'manual', 'single'].includes(mode)) return false;
          for (const id of ids) {
            const n = el(id);
            if (!n) continue;
            const size = dimensions(n);
            n.manualW = size.w;
            n.manualH = size.h;
            n.labelWrap = mode;
          }
          naturalSizes.clear();
          remember();
          render();
          return true;
        }

        /** Validează configurația grupului sincronizat; șablonul numelui este formatat din câmpuri, niciodată executat drept cod. */
        function validSyncSettings(settings) {
          return (
            settings &&
            typeof settings === 'object' &&
            ['same', 'numbered'].includes(settings.mode) &&
            typeof settings.name === 'string' &&
            settings.name.length <= 100 &&
            typeof settings.prefix === 'string' &&
            settings.prefix.length <= 200 &&
            typeof settings.suffix === 'string' &&
            settings.suffix.length <= 200 &&
            Number.isSafeInteger(settings.start) &&
            settings.start >= 0 &&
            settings.start <= 999999 &&
            Number.isInteger(settings.digits) &&
            settings.digits >= 1 &&
            settings.digits <= 6 &&
            Array.isArray(settings.properties) &&
            settings.properties.length <= 7 &&
            settings.properties.every((key) => Object.hasOwn(SYNC_PROPERTIES, key))
          );
        }

        /** Formatează numele unui membru fără să renumeroteze celelalte noduri ale grupului. */
        function syncedNodeName(sync) {
          return (
            sync.settings.prefix +
            String(sync.number).padStart(sync.settings.digits, '0') +
            sync.settings.suffix
          );
        }

        /** Creează un grup explicit din selecție; nu reunește grupuri existente fără o desprindere prealabilă. */
        function createSyncGroup(settings, ids = [...selectedNodes]) {
          const members = [...new Set(ids)].map(el).filter(Boolean);
          if (!validSyncSettings(settings) || members.length < 2 || members.some((n) => n.sync)) {
            toast('Selectează cel puțin două noduri fără grup sincronizat.');
            return false;
          }
          if (settings.start + members.length - 1 > 999999) {
            toast('Seria depășește numărul maxim 999999.');
            return false;
          }
          const id = 'sync-' + crypto.randomUUID(),
            leader = members[0];
          if (settings.properties.includes('manualW')) leader.manualW = dimensions(leader).w;
          if (settings.properties.includes('manualH')) leader.manualH = dimensions(leader).h;
          members.forEach((node, index) => {
            node.sync = { id, number: settings.start + index, settings: structuredClone(settings) };
            for (const key of settings.properties) {
              if (key === 'label' && settings.mode === 'numbered')
                node.label = syncedNodeName(node.sync);
              else if (leader[key] === undefined) delete node[key];
              else node[key] = leader[key];
            }
          });
          remember();
          render();
          return true;
        }

        /** Modifică regulile unui grup, păstrând numărul fiecărui membru; renumerotarea se efectuează numai când este cerută explicit. */
        function updateSyncGroup(groupId, settings, renumber = false) {
          if (!validSyncSettings(settings)) return false;
          const members = nodes.filter((n) => n.sync?.id === groupId);
          if (!members.length || settings.start + members.length > 1000000) return false;
          const leader = members.find((n) => selectedNodes.has(n.id)) || members[0];
          if (settings.properties.includes('manualW')) leader.manualW = dimensions(leader).w;
          if (settings.properties.includes('manualH')) leader.manualH = dimensions(leader).h;
          members.forEach((n, index) => {
            n.sync.settings = structuredClone(settings);
            if (renumber) n.sync.number = settings.start + index;
            for (const key of settings.properties) {
              if (key === 'label' && settings.mode === 'numbered') n.label = syncedNodeName(n.sync);
              else if (leader[key] === undefined) delete n[key];
              else n[key] = leader[key];
            }
          });
          remember();
          render();
          return true;
        }

        /** Propagă numai proprietățile bifate și schimbate față de ultima stare Undo; toate schimbările intră în aceeași tranzacție. */
        function propagateSyncedNodes() {
          let previous = [];
          try {
            previous = JSON.parse(history.at(-1) || '{}').nodes || [];
          } catch {}
          const before = new Map(previous.map((n) => [n.id, n])),
            groups = new Map();
          for (const n of nodes)
            if (n.sync) {
              if (!groups.has(n.sync.id)) groups.set(n.sync.id, []);
              groups.get(n.sync.id).push(n);
            }
          for (const members of groups.values()) {
            const settings = members[0].sync.settings;
            for (const key of settings.properties) {
              if (key === 'label' && settings.mode === 'numbered') {
                for (const n of members) n.label = syncedNodeName(n.sync);
                continue;
              }
              const changed = members.find(
                (n) =>
                  before.has(n.id) &&
                  JSON.stringify(before.get(n.id)[key]) !== JSON.stringify(n[key]),
              );
              if (changed)
                for (const n of members) {
                  if (changed[key] === undefined) delete n[key];
                  else n[key] = changed[key];
                }
            }
          }
        }

        /** Desprinde nodurile indicate din sincronizare, păstrând valorile și numerele celorlalți membri. */
        function detachSyncedNodes(ids = [...selectedNodes]) {
          for (const id of ids) {
            const n = el(id);
            if (n) delete n.sync;
          }
          syncHighlight = null;
          remember();
          render();
        }

        /** Evidențiază temporar membrii unui grup fără să adauge linii sau obiecte în diagramă. */
        function highlightSyncGroup(id) {
          syncHighlight = id;
          clearTimeout(syncHighlightTimer);
          refreshSyncHighlights();
          if (overviewActive) paintOverviewSoon();
          syncHighlightTimer = setTimeout(() => {
            syncHighlight = null;
            refreshSyncHighlights();
            if (overviewActive) paintOverviewSoon();
          }, 2500);
        }

        /** Schimbă afișarea uneltelor, nu comenzile asociate; preferința este păstrată în browser. */
        function setToolbarDisplay(mode) {
          document.body.classList.toggle('tools-text', mode === 'text');
          storageSet('els:toolbar-display', mode === 'text' ? 'text' : 'compact');
          const control = $('#toolbarDisplayMode');
          if (control) control.value = mode === 'text' ? 'text' : 'compact';
          updateToolbarLabels();
        }

        /** Așază proprietățile pe rândul contextual în modul cu text; păstrează locurile configurate pentru revenirea la pictograme. */
        function layoutToolbar() {
          const bar = $('#bar'),
            textMode = document.body.classList.contains('tools-text');
          let context = $('#toolbarContext');
          if (!context) {
            context = document.createElement('div');
            context.id = 'toolbarContext';
            context.hidden = true;
            bar.append(context);
          }
          for (const [id, title] of [
            ['nodeStyle', 'Aspect'],
            ['edgeStyle', 'Aspect'],
            ['portCounts', 'Porturi'],
          ]) {
            const item = TOOLBAR_ELEMENTS[id];
            if (!item) continue;
            if (textMode) {
              if (!context.contains(item)) {
                const placeholder = document.createComment('Locul controlului ' + id);
                item.before(placeholder);
                toolbarHomes.set(id, placeholder);
                const section = document.createElement('div');
                section.className = 'toolbar-context-section';
                const caption = document.createElement('span');
                caption.className = 'toolbar-context-title';
                caption.textContent = title;
                section.append(caption, item);
                context.append(section);
              }
              item.parentElement.hidden = item.hidden || toolbarSettings.enabled[id] === false;
            } else {
              const home = toolbarHomes.get(id);
              if (home?.isConnected) home.replaceWith(item);
              toolbarHomes.delete(id);
            }
          }
          // La reconstruirea grupurilor se elimină secțiunile rămase fără controale.
          for (const section of [...context.children])
            if (!section.querySelector('.edge-style,.toolbar-ports')) section.remove();
          context.hidden = !textMode || ![...context.children].some((section) => !section.hidden);
          for (const host of [$('#toolbarActions'), $('#toolbarRight')]) {
            for (const group of host.querySelectorAll(':scope > .toolbar-subgroup'))
              group.hidden = ![...group.children].some((item) => !item.hidden);
            for (const gap of host.querySelectorAll(':scope > .toolbar-group-gap')) {
              const later = [...host.children].slice([...host.children].indexOf(gap) + 1);
              gap.hidden =
                !!gap.previousElementSibling?.hidden ||
                !later.some((item) => item.classList.contains('toolbar-subgroup') && !item.hidden);
            }
          }
        }

        /** Atribuie denumiri scurte butoanelor existente și adaptează înălțimea planșei la bara de unelte. */
        function updateToolbarLabels() {
          const names = {
            undo: 'Anulează',
            redo: 'Refă',
            add: 'Nod',
            addFrame: 'Grup',
            multiSelect: 'Selecție',
            selectAll: 'Tot',
            copy: 'Copiază',
            paste: 'Lipește',
            editLabel: 'Text',
            connect: 'Conectează',
            arrange: 'Aliniază',
            delete: 'Șterge',
            native: 'ELS',
            mermaid: 'Mermaid',
            importButton: 'Importă',
            present: 'Prezintă',
            zoomOut: '−',
            zoomIn: '+',
            zoomReset: $('#zoomLevel')?.textContent || '100%',
            fit: 'Încadrează',
            nodeFillBtn: 'Fundal',
            nodeStrokeBtn: 'Contur',
            nodeTextBtn: 'Text',
            edgeColorBtn: 'Linie',
            edgeLabelColorBtn: 'Text',
            editOverviewLabel: 'Text redus',
            labelMoveMode: 'Mută text',
            resetLabelPosition: 'Reset text',
            rotateNodeBack: '−15°',
            rotateNode: '+15°',
            resetNodePose: '0°',
            portPositionMode: 'Mută porturi',
          };
          for (const [id, label] of Object.entries(names)) {
            const element = $('#' + id);
            if (element) element.dataset.shortLabel = label;
          }
          layoutToolbar();
          const height = $('#bar').getBoundingClientRect().height;
          const previous = Number(canvas.dataset.toolbarHeight);
          if (previous && previous !== height) {
            // Compensează schimbarea barei în coordonatele vederii, nu în modelul diagramei.
            pan.y += previous - height;
            world.style.transform = `translate(${pan.x}px,${pan.y}px) scale(${scale})`;
            applyGridAppearance();
            renderResizeHandles();
            if (overviewActive) paintOverviewSoon();
          }
          canvas.dataset.toolbarHeight = String(height);
          canvas.style.height = `calc(100vh - ${height}px)`;
          document.documentElement.style.setProperty('--bar-height', height + 'px');
        }

        /** Creează un control etichetat în panoul contextual; valoarea este introdusă prin proprietăți DOM, fără interpretare HTML. */
        function propertyControl(parent, title, type, value, options = null) {
          const label = document.createElement('label');
          label.className = 'property-field';
          const caption = document.createElement('span');
          caption.textContent = title;
          label.append(caption);
          const input = document.createElement(type === 'select' ? 'select' : 'input');
          input.setAttribute('aria-label', title);
          if (type !== 'select') input.type = type;
          if (options)
            for (const [key, text] of Object.entries(options)) {
              const option = document.createElement('option');
              option.value = key;
              option.textContent = text;
              input.append(option);
            }
          if (type === 'checkbox') input.checked = !!value;
          else input.value = value ?? '';
          label.append(input);
          parent.append(label);
          return input;
        }

        /** Adaugă o comandă textuală în panoul contextual, conectată la registrul comun de acțiuni. */
        function propertyButton(parent, label, action) {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = label;
          button.addEventListener('click', action);
          parent.append(button);
          return button;
        }

        /** Construiește configurația și previzualizarea grupului; valorile nu sunt aplicate până la comanda explicită. */
        function renderSyncEditor(parent, members) {
          const group = members[0]?.sync,
            existing = group && members.every((n) => n.sync?.id === group.id);
          if (existing) {
            const banner = document.createElement('p');
            banner.className = 'sync-group-summary';
            banner.textContent = `Grup: ${group.settings.name || 'Grup sincronizat'} · ${nodes.filter((n) => n.sync?.id === group.id).length} membri`;
            parent.append(banner);
          }
          const section = document.createElement('details');
          section.className = 'sync-editor';
          section.open = !!existing;
          const summary = document.createElement('summary');
          summary.textContent = 'Noduri sincronizate';
          section.append(summary);
          parent.append(section);
          if (!existing && members.length < 2) {
            const help = document.createElement('p');
            help.textContent = 'Selectează două sau mai multe noduri pentru un grup nou.';
            section.append(help);
            return;
          }
          const settings = existing
            ? group.settings
            : {
                name: 'Grup sincronizat',
                mode: 'same',
                prefix: 'esxi-',
                suffix: '',
                start: 1,
                digits: 3,
                properties: ['label'],
              };
          const name = propertyControl(section, 'Nume grup', 'text', settings.name);
          name.maxLength = 100;
          const mode = propertyControl(section, 'Numele membrilor', 'select', settings.mode, {
            same: 'Același nume',
            numbered: 'Serie numerotată',
          });
          const fields = document.createElement('div');
          fields.className = 'series-fields';
          section.append(fields);
          const prefix = propertyControl(fields, 'Prefix', 'text', settings.prefix),
            suffix = propertyControl(fields, 'Sufix', 'text', settings.suffix);
          prefix.maxLength = suffix.maxLength = 200;
          const start = propertyControl(fields, 'Primul număr', 'number', settings.start),
            digits = propertyControl(fields, 'Număr de cifre', 'number', settings.digits);
          start.min = 0;
          start.max = 999999;
          digits.min = 1;
          digits.max = 6;
          const choices = {};
          for (const [key, title] of Object.entries(SYNC_PROPERTIES))
            choices[key] = propertyControl(
              section,
              title,
              'checkbox',
              settings.properties.includes(key),
            );
          const preview = document.createElement('p');
          preview.className = 'series-preview';
          section.append(preview);
          const read = () => ({
            name: name.value.trim(),
            mode: mode.value,
            prefix: prefix.value,
            suffix: suffix.value,
            start: Number(start.value),
            digits: Number(digits.value),
            properties: Object.keys(choices).filter((key) => choices[key].checked),
          });
          const allMembers = existing ? nodes.filter((n) => n.sync?.id === group.id) : members;
          const updatePreview = () => {
            fields.hidden = mode.value !== 'numbered';
            const s = read();
            preview.textContent = !validSyncSettings(s)
              ? 'Configurație invalidă.'
              : s.mode === 'same'
                ? `Nume comun: ${members[0].label || '(fără nume)'}`
                : allMembers
                    .slice(0, 4)
                    .map((n, i) =>
                      syncedNodeName({
                        number: existing ? n.sync.number : s.start + i,
                        settings: s,
                      }),
                    )
                    .join(' · ');
          };
          section.addEventListener('input', updatePreview);
          updatePreview();
          propertyButton(section, existing ? 'Aplică regulile' : 'Creează grup', () => {
            const s = read();
            if (!validSyncSettings(s)) {
              toast('Verifică numerele și proprietățile grupului.');
              return;
            }
            runAction(
              existing ? 'updateSyncGroup' : 'createSyncGroup',
              ...(existing ? [group.id, s] : [s, members.map((n) => n.id)]),
            );
          });
          if (existing) {
            const list = document.createElement('ul');
            list.className = 'sync-members';
            for (const n of allMembers) {
              const li = document.createElement('li');
              li.textContent = `${n.label || 'Fără nume'} · ${n.id}`;
              list.append(li);
            }
            section.append(list);
            propertyButton(section, 'Arată membrii', () =>
              runAction('highlightSyncGroup', group.id),
            );
            propertyButton(section, 'Desprinde selecția', () => runAction('detachSyncedNodes'));
            const renumberPreview = document.createElement('p');
            renumberPreview.className = 'hint';
            section.append(renumberPreview);
            propertyButton(section, 'Previzualizează renumerotarea', () => {
              const s = read();
              if (!validSyncSettings(s)) return;
              renumberPreview.textContent = allMembers
                .slice(0, 6)
                .map(
                  (n, i) => `${n.label} → ${syncedNodeName({ number: s.start + i, settings: s })}`,
                )
                .join(' · ');
              const apply = propertyButton(section, 'Confirmă renumerotarea', () =>
                runAction('updateSyncGroup', group.id, s, true),
              );
              apply.disabled = s.start + allMembers.length > 1000000;
            });
          }
        }

        /** Reface numai panoul contextual când selecția sau proprietățile se schimbă; nu întrerupe tastarea într-un câmp activ. */
        function renderProperties() {
          refreshSyncHighlights();
          const panel = $('#propertiesPanel');
          if (!panel) return;
          const members = [...selectedNodes].map(el).filter(Boolean),
            edge = edges.find((e) => e.id === selected);
          panel.hidden = !members.length && !edge;
          if (panel.hidden) return;
          const selectionKey = edge
            ? edge.id + ':' + selectedEdgePoint + ':' + selectedEdgeEnd
            : members.map((n) => n.id).join(',');
          if (
            panel.dataset.selection === selectionKey &&
            panel.contains(document.activeElement) &&
            !document.activeElement.matches('button')
          )
            return;
          panel.dataset.selection = selectionKey;
          panel.replaceChildren();
          panel.classList.toggle('collapsed', propertiesCollapsed);
          const header = document.createElement('div');
          header.className = 'properties-header';
          panel.append(header);
          propertyButton(header, propertiesCollapsed ? 'Proprietăți' : 'Restrânge', () => {
            propertiesCollapsed = !propertiesCollapsed;
            renderProperties();
          });
          if (propertiesCollapsed) return;
          const heading = document.createElement('h3');
          heading.textContent = edge
            ? 'Conexiune'
            : members.length === 1
              ? members[0].label || 'Nod fără nume'
              : `${members.length} noduri`;
          header.prepend(heading);
          if (edge) {
            const text = propertyControl(panel, 'Text', 'text', edge.label || '');
            text.maxLength = 10000;
            text.addEventListener('change', () => {
              edge.label = text.value;
              remember();
              render();
            });
            const tips = propertyControl(panel, 'Săgeți', 'select', edge.arrows || 'none', {
              none: 'Fără săgeți',
              start: 'La început',
              end: 'La sfârșit',
              both: 'La ambele capete',
            });
            tips.addEventListener('change', () => runAction('setEdgeArrows', tips.value, edge.id));
            const ends = document.createElement('p');
            ends.className = 'hint';
            ends.textContent = `Început: ${el(edge.from)?.label || 'Punct liber'} · Sfârșit: ${el(edge.to)?.label || 'Punct liber'}`;
            panel.append(ends);
            const note = document.createElement('p');
            const route = collectEdgePaths(false).find((item) => item.e.id === edge.id),
              points = route?.points.slice(1, -1) || [];
            note.textContent = `${points.length} puncte intermediare · ${Array.isArray(edge.waypoints) || edge.waypoint ? 'traseu manual' : 'traseu automat'}.`;
            panel.append(note);
            const choices = { none: 'Niciun punct', from: 'Început', to: 'Sfârșit' };
            points.forEach((point, index) => {
              choices[index] = `${index + 1} · ${Math.round(point.x)}, ${Math.round(point.y)}`;
            });
            const pointChoice = propertyControl(
              panel,
              'Punct selectat',
              'select',
              selectedEdgeEnd ?? selectedEdgePoint ?? 'none',
              choices,
            );
            pointChoice.prepend(
              [...pointChoice.options].find((option) => option.value === 'none'),
              [...pointChoice.options].find((option) => option.value === 'from'),
            );
            pointChoice.append([...pointChoice.options].find((option) => option.value === 'to'));
            pointChoice.value = String(selectedEdgeEnd ?? selectedEdgePoint ?? 'none');
            pointChoice.addEventListener('change', () => {
              if (['from', 'to'].includes(pointChoice.value))
                runAction('selectEdgeEnd', pointChoice.value, edge.id);
              else
                runAction(
                  'selectEdgePoint',
                  pointChoice.value === 'none' ? null : Number(pointChoice.value),
                  edge.id,
                );
            });
            const pointStatus = document.createElement('p');
            pointStatus.className = 'hint';
            pointStatus.textContent =
              selectedEdgeEnd !== null
                ? `Capătul de ${selectedEdgeEnd === 'from' ? 'început' : 'sfârșit'} este marcat cu portocaliu.`
                : selectedEdgePoint === null
                  ? 'Apasă un punct sau alege-l din listă.'
                  : `Punctul ${selectedEdgePoint + 1} este marcat cu portocaliu.`;
            panel.append(pointStatus);
            propertyButton(panel, 'Adaugă punct', () =>
              runAction('addEdgePointFromPanel', edge.id),
            ).disabled = points.length >= 64;
            propertyButton(panel, 'Elimină punctul selectat', () =>
              runAction('removeEdgePoint'),
            ).disabled = selectedEdgePoint === null;
            propertyButton(panel, 'Traseu automat', () => runAction('resetEdgeRoute', edge.id));
            propertyButton(panel, 'Resetează poziția textului', () =>
              runAction('resetEdgeLabel', edge.id),
            );
          } else {
            const n = members[0],
              kind = propertyControl(panel, 'Tip element', 'select', n.kind || 'node', NODE_KINDS);
            kind.addEventListener('change', () => runAction('setNodeKind', kind.value));
            const wrap = propertyControl(
              panel,
              'Text pe rânduri',
              'select',
              n.labelWrap || 'auto',
              { auto: 'Automat', manual: 'Manual', single: 'Un singur rând' },
            );
            wrap.addEventListener('change', () => runAction('setNodeWrap', wrap.value));
            renderSyncEditor(panel, members);
          }
        }

        /**
         * Construiește un exemplu exclusiv fictiv: o bibliotecă digitală cu producție,
         * recuperare, administrare și un atelier de editare. Nu citește biblioteca locală,
         * diagrama deschisă, clipboardul sau fișierele utilizatorului. Toate coordonatele,
         * porturile și punctele manuale sunt multipli ai celulei de 20 px.
         * Grupele funcționale de porturi sunt segmente numite; seriile sunt grupuri
         * sincronizate de noduri. Exemplul nu presupune existența unor aliasuri de port.
         */
        function buildDemoDiagram() {
          const diagram = {
            format: 'els',
            version: 1,
            geometry: { version: 1, cell: 20 },
            nodes: [],
            edges: [],
          };
          const colors = {
            public: '#4472C4',
            services: '#70AD47',
            data: '#7030A0',
            backup: '#ED7D31',
            admin: '#44546A',
          };
          /** Adaugă o componentă fictivă cu dimensiuni explicite și stiluri din paleta editorului. */
          function node(id, label, x, y, w, h, options = {}) {
            const result = {
              id,
              label,
              x,
              y,
              manualW: w,
              manualH: h,
              grid: true,
              kind: 'node',
              labelWrap: 'auto',
              fill: '#FFFFFF',
              stroke: colors.admin,
              textColor: '#000000',
              ...options,
            };
            diagram.nodes.push(result);
            return result;
          }
          /** Creează un container colorat discret; copiii rămân obiecte independente. */
          function frame(id, label, x, y, w, h, color, parent) {
            return node(id, label, x, y, w, h, {
              kind: 'container',
              fill: mixOfficeColor(color, 0.94),
              stroke: color,
              ...(parent ? { parent } : {}),
            });
          }
          /** Creează un segment subțire cu porturi numerotate și sloturi explicite, grupate după rolul rețelei. */
          function segment(id, label, x, y, w, color, parent, north = [], south = []) {
            const slots = {};
            north.forEach((offset, index) => {
              slots['N' + (index + 1)] = offset / 20;
            });
            south.forEach((offset, index) => {
              slots['S' + (index + 1)] = offset / 20;
            });
            return node(id, label, x, y, w, 40, {
              kind: 'network-segment',
              fill: mixOfficeColor(color, 0.8),
              stroke: color,
              parent,
              ports: { N: north.length, S: south.length },
              portSlots: slots,
            });
          }
          /** Folosește un port din mijlocul laturii unei componente, fără puncte pe colțuri. */
          function component(id, label, x, y, color, parent, kind = 'vm', ports = { N: 1, S: 1 }) {
            const portSlots = {};
            for (const [side, count] of Object.entries(ports)) {
              const length = 'NS'.includes(side) ? 240 : 120;
              for (let index = 0; index < count; index++)
                portSlots[side + (index + 1)] = length / 40 + 2 * index - (count - 1);
            }
            return node(id, label, x, y, 240, 120, {
              kind,
              parent,
              ports,
              portSlots,
              fill: mixOfficeColor(color, 0.9),
              stroke: color,
            });
          }
          /** Adaugă o legătură cu sens și stil explicite; punctele date sunt păstrate ca traseu editabil. */
          function link(
            id,
            from,
            fromPort,
            to,
            toPort,
            color,
            label = '',
            style = 'solid',
            arrows = 'end',
            points,
          ) {
            diagram.edges.push({
              id,
              from,
              fromPort,
              to,
              toPort,
              color,
              label,
              labelColor: colors.admin,
              lineStyle: style,
              arrows,
              ...(points ? { waypoints: points.map(([x, y]) => ({ x, y })) } : {}),
            });
          }
          /** Creează aceeași configurație de sincronizare pentru membrii unei serii sau ai unui grup cu nume comun. */
          function sync(ids, id, name, mode, prefix = '') {
            const settings = {
              name,
              mode,
              prefix,
              suffix: '',
              start: 1,
              digits: 3,
              properties: ['label', 'fill', 'stroke', 'manualW', 'manualH'],
            };
            ids.forEach((nodeId, index) => {
              const member = diagram.nodes.find((item) => item.id === nodeId);
              member.sync = { id, number: index + 1, settings: structuredClone(settings) };
              if (mode === 'numbered') member.label = prefix + String(index + 1).padStart(3, '0');
            });
          }
          /** Adaugă o instrucțiune pe planșă, fără a introduce o componentă în topologia rețelei. */
          function note(id, label, x, y, w, h, options = {}) {
            return node(id, label, x, y, w, h, {
              fill: 'transparent',
              stroke: 'transparent',
              borderStyle: 'none',
              labelWrap: 'manual',
              ...options,
            });
          }

          note(
            'demo-title',
            'INFRASTRUCTURĂ DEMONSTRATIVĂ\nArhitectură demonstrativă. Toate datele sunt fictive.',
            80,
            20,
            2000,
            100,
          );
          component(
            'readers',
            'Cititori\nAcces public',
            160,
            200,
            colors.public,
            undefined,
            'node',
            { E: 1 },
          );
          component(
            'gateway',
            'Gateway public\nFiltrare HTTPS',
            480,
            200,
            colors.public,
            undefined,
            'firewall',
            { N: 1, W: 1, E: 1, S: 1 },
          );
          link('public-access', 'readers', 'E1', 'gateway', 'W1', colors.public, 'HTTPS');
          note(
            'traffic-guide',
            'Albastru: acces public\nVerde: servicii · Mov: date\nPortocaliu punctat: rezervă / copie\nGri întrerupt: administrare',
            800,
            160,
            380,
            220,
          );

          frame('operations', 'ADMINISTRARE ȘI SUPRAVEGHERE', 1280, 120, 800, 280, colors.admin);
          component(
            'operator',
            'Post administrare',
            1320,
            180,
            colors.admin,
            'operations',
            'node',
            { S: 1 },
          );
          component(
            'monitor',
            'Supraveghere\nMetrici și alerte',
            1760,
            180,
            colors.admin,
            'operations',
            'vm',
            { S: 1 },
          );
          segment(
            'admin-network',
            'Grup porturi: administrare · N1-N2 / S1-S2',
            1320,
            340,
            680,
            colors.admin,
            'operations',
            [120, 560],
            [80, 640],
          );
          link(
            'operator-admin',
            'operator',
            'S1',
            'admin-network',
            'N1',
            colors.admin,
            '',
            'dashed',
            'both',
          );
          link(
            'monitor-admin',
            'monitor',
            'S1',
            'admin-network',
            'N2',
            colors.admin,
            '',
            'dashed',
            'both',
          );

          frame(
            'production',
            'PRODUCȚIE · flux principal de sus în jos',
            80,
            440,
            1040,
            1120,
            colors.public,
          );
          frame(
            'presentation',
            '1. PREZENTARE · trei instanțe sincronizate',
            120,
            500,
            960,
            280,
            colors.public,
            'production',
          );
          segment(
            'public-network',
            'Acces aplicație · N1 intrare / S1-S3 instanțe',
            160,
            560,
            880,
            colors.public,
            'presentation',
            [440],
            [120, 440, 760],
          );
          const web = ['catalog-001', 'catalog-002', 'catalog-003'];
          web.forEach((id, index) => {
            component(id, id, 160 + index * 320, 640, colors.public, 'presentation');
            link('web-in-' + index, 'public-network', 'S' + (index + 1), id, 'N1', colors.public);
          });
          sync(web, 'demo-web-series', 'Instanțe catalog', 'numbered', 'catalog-');
          link(
            'gateway-production',
            'gateway',
            'S1',
            'public-network',
            'N1',
            colors.public,
            '443 / TLS',
          );

          frame(
            'processing',
            '2. PROCESARE · rețea separată de accesul public',
            120,
            840,
            960,
            280,
            colors.services,
            'production',
          );

        /** Deschide exemplul în propria intrare cu nume dată-oră; salvează întâi diagrama activă și nu o înlocuiește. */
        function openDemoDiagram() {
          const diagram = validateDiagramData(buildDemoDiagram());
          createDiagram();
          if (!loadState(JSON.stringify(diagram))) return false;
          history = [snapshot()];
          future = [];
          runAction('fitDiagram');
          saveActiveDiagram();
          menuPanel.hidden = true;
          toast('Exemplu deschis ca diagramă nouă');
          return true;
        }
        defineAction('openDemoDiagram', openDemoDiagram);

        /** Generează Despre, lista de funcționalități și indiciile aplicației exclusiv din comentariul funcțional comun. */
        function renderApplicationHelp() {
          menuPanel.querySelector('.menu-brand').textContent = APP_HELP.name;
          menuPanel.querySelector('.menu-brand').title = APP_HELP.description;
          $('.brand').title = APP_HELP.description;
          let section = menuPanel.querySelector('#aboutEls');
          if (!section) {
            section = document.createElement('details');
            section.id = 'aboutEls';
            section.className = 'menu-category';
            menuPanel.append(section);
          }
          const summary = document.createElement('summary');
          summary.textContent = APP_HELP.aboutTitle;
          const body = document.createElement('div');
          body.className = 'menu-category-body app-help';
          const description = document.createElement('p');
          description.dataset.helpDescription = '';
          description.textContent = APP_HELP.description;
          const demoNote = document.createElement('p');
          demoNote.textContent = APP_HELP.demo.note;
          const demoButton = document.createElement('button');
          demoButton.type = 'button';
          demoButton.textContent = APP_HELP.demo.button;
          demoButton.addEventListener('click', () => runAction('openDemoDiagram'));
          const storage = document.createElement('p');
          storage.textContent = APP_HELP.storageNote;
          const heading = document.createElement('h3');
          heading.textContent = APP_HELP.featuresTitle;
          const list = document.createElement('ul');
          list.className = 'app-help-list';
          for (const feature of APP_HELP.features) {
            const item = document.createElement('li');
            item.dataset.feature = feature.id;
            const title = document.createElement('h4');
            title.textContent = feature.title;
            const purpose = document.createElement('p');
            purpose.textContent = feature.purpose;
            const usage = document.createElement('p');
            usage.className = 'app-help-use';
            usage.textContent = feature.usage;
            item.append(title, purpose, usage);
            list.append(item);
          }
          body.append(description, demoNote, demoButton, storage, heading, list);
          section.replaceChildren(summary, body);
        }

        /** Instalează panoul contextual și alegerea Iconițe/Text în categoria Bara de unelte, apoi construiește documentația aplicației. */
        function initExtendedEditor() {
          const panel = document.createElement('aside');
          panel.id = 'propertiesPanel';
          panel.hidden = true;
          panel.setAttribute('aria-label', 'Proprietăți selecție');
          document.body.append(panel);
          panel.addEventListener('pointerdown', (event) => event.stopPropagation());
          panel.addEventListener('keydown', (event) => event.stopPropagation());
          const mode = propertyControl(
            $('#toolbarDisplay'),
            APP_HELP.toolbar.label,
            'select',
            storageGet('els:toolbar-display') || 'compact',
            APP_HELP.toolbar.modes,
          );
          mode.id = 'toolbarDisplayMode';
          mode.parentElement.classList.add('toolbar-display-field');
          mode.addEventListener('change', () => runAction('setToolbarDisplay', mode.value));
          setToolbarDisplay(mode.value);
          renderApplicationHelp();
          const emptyDemo = document.createElement('button');
          emptyDemo.type = 'button';
          emptyDemo.className = 'empty-demo';
          emptyDemo.textContent = APP_HELP.demo.button;
          emptyDemo.addEventListener('pointerdown', (event) => event.stopPropagation());
          emptyDemo.addEventListener('dblclick', (event) => event.stopPropagation());
          emptyDemo.addEventListener('click', () => runAction('openDemoDiagram'));
          $('#empty').append(emptyDemo);
          new ResizeObserver(updateToolbarLabels).observe($('#bar'));
        }

          const e = edges.find((e) => e.id === id);
          if (!e || !['none', 'start', 'end', 'both'].includes(value)) return false;
          e.arrows = value;
          remember();
          render();
          return true;
        });
        defineAction('resetEdgeLabel', (id = selected) => {
          const e = edges.find((e) => e.id === id);

        });
