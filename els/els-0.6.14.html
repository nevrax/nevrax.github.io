    <title>ELS</title>
    <!--
  ELS 0.6.14 — aplicație autonomă într-un singur fișier.
  Ghid de lectură: CSS → structura interfeței → comenzi și model → geometrie
  → interacțiuni → import/export → bibliotecă locală → inițializare.
  Model: nodes și edges sunt datele diagramei; pan și scale descriu numai vederea.
  Datele utilizatorului rămân în browser și în fișierele exportate voluntar.
  Nu există conturi, backend de colaborare, telemetrie sau biblioteci încărcate de pe CDN.
  Fișierul livrat nu conține diagrame personale.
  Documentația funcțională este comentariul ELS_HELP_START din scriptul aplicației.
  Interfața Despre ELS și indiciul aplicației citesc direct acel comentariu JSON.
  Nu elimina blocul și nu copia descrierea în alte șabloane ale interfeței.
-->
    <style>
      /*
       * CUPRINS CSS - caută marcajul CSS-XX pentru a ajunge la secțiune.
       *
       * CSS-01  Fundamente, tipografie și controale comune
       * CSS-02  Planșă, grilă, panoramare și conexiuni
       * CSS-03  Noduri, selecție și editarea etichetelor
       * CSS-04  Mânerele de redimensionare
       * CSS-05  Mesaje, prezentare și completări geometrice
       * CSS-06  Așezarea de bază a barei și straturilor planșei
       * CSS-07  Porturi, numărătoare și controale de stil
       * CSS-08  Mânerele punctelor unei conexiuni
       * CSS-09  Paleta și alegerea culorilor
       * CSS-10  Meniu, dialoguri, fișiere și vederea de ansamblu
       * CSS-11  Bara compactă, alinierea și comenzile de formatare
       * CSS-12  Categorii de meniu și configurarea barei
       * CSS-13  Panoul proprietăților și câmpurile de editare
       * CSS-14  Despre ELS și documentația funcțională
       * CSS-15  Grupuri sincronizate și marcajele membrilor
       * CSS-16  Tipuri de nod și moduri de afișare a textului
       * CSS-17  Mutarea textelor, punctul activ și săgețile
       * CSS-18  Bara cu text și adaptarea la ecrane înguste
       *
       * ORDINE ȘI GEOMETRIE
       * Regulile comune preced completările componentelor și ale modurilor de lucru.
       * Selectori precum .bar sau .node apar în mai multe secțiuni: regulile ulterioare
       * le completează ori le suprascriu. Păstrează această ordine la modificare.
       * Variabilele --bar-height, --grid-screen-step și --grid-shift-* sunt actualizate
       * de editor; ele leagă afișarea de geometrie, zoom și panoramare.
       * CSS-ul rămâne în head, înainte ca inițializarea să măsoare interfața.
       */

      /* CSS-01 | Fundamente, tipografie și controale comune
       * Definește fontul, modelul de dimensionare și aspectul implicit al comenzilor.
       */
      :root {
        font:
          15px/1.4 system-ui,
          Segoe UI,
          Arial,
          sans-serif;
        color: #172033;
        background: #f4f6fa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
      }
      .bar {
        height: 56px;
        background: #fff;
        border-bottom: 1px solid #dce1ea;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        box-shadow: 0 2px 8px #18243a0b;
      }
      .brand {
        font-weight: 700;
        margin-right: 10px;
      }
      .spacer {
        flex: 1;
      }
      button,
      .filebtn {
        border: 1px solid #cfd6e2;
        background: #fff;
        border-radius: 7px;
        padding: 7px 11px;
        font: inherit;
        cursor: pointer;
        color: #172033;
      }
      button:hover,
      .filebtn:hover {
        background: #eef3ff;
        border-color: #9aafe5;
      }
      button.active {
        background: #e4ecff;
        border-color: #5577ce;
        color: #214da8;
      }
      .hint {
        color: #707a8b;
        font-size: 12px;
      }
      /* CSS-02 | Planșă, grilă, panoramare și conexiuni
       * Grila desenată urmează variabilele vederii; pasul de fixare este calculat în JavaScript.
       * Straturile și pointer-events separă navigarea de selectarea liniilor.
       */
      .canvas {
        position: relative;
        isolation: isolate;
        height: calc(100vh - 56px);
        overflow: hidden;
        background-color: #f8f9fc;
        background-image: radial-gradient(
          rgba(93, 110, 139, var(--grid-opacity, 0.58)) 1px,
          transparent 1px
        );
        background-size: var(--grid-screen-step, 22px) var(--grid-screen-step, 22px);
        background-position: var(--grid-shift-x, 0px) var(--grid-shift-y, 0px);
        touch-action: none;
        cursor: grab;
      }
      .canvas.grid-hidden {
        background-image: none;
      }
      body.panning .canvas,
      body.panning .canvas * {
        cursor: grabbing !important;
      }
      body.multi-select-mode .canvas,
      body.multi-select-mode .canvas * {
        cursor: crosshair !important;
      }
      .world {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
      }
      .edges {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .edge {
        fill: none;
        stroke: #52617a;
        stroke-width: 2.4;
        stroke-linecap: round;
        pointer-events: stroke;
        cursor: pointer;
      }
      .edge.selected {
        stroke: #4169d8;
        stroke-width: 3.2;
      }
      .edge-label {
        font: 14px system-ui;
        fill: #29354d;
        paint-order: stroke;
        stroke: #f8f9fc;
        stroke-width: 6px;
        stroke-linejoin: round;
        cursor: pointer;
        pointer-events: all;
      }
      /* CSS-03 | Noduri, selecție și editarea etichetelor
       * Stilurile de bază diferențiază corpul, segmentul subțire și stările selecției.
       * Etichetele mutate au poziție proprie; corpul nodului rămâne reperul porturilor.
       */
      .node {
        position: absolute;
        z-index: 1;
        min-width: 86px;
        min-height: 54px;
        width: max-content;
        max-width: 360px;
        padding: 12px 17px;
        border: 2px solid #42536f;
        border-radius: 9px;
        background: #fff;
        box-shadow: 0 3px 12px #23324c18;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        cursor: grab;
        user-select: none;
        transform-origin: center;
      }
      .node.label-positioned {
        min-height: 4px;
        padding-top: 0;
        padding-bottom: 0;
      }
      .node.network-segment {
        min-width: 40px;
        min-height: 24px;
        padding: 4px 12px;
        border-radius: 2px;
        box-shadow: none;
        line-height: 20px;
      }
      .node.no-paint-shadow:not(.selected) {
        box-shadow: none;
      }
      .color-trigger.no-color::after {
        content: '';
        position: absolute;
        width: 22px;
        height: 2px;
        background: #a83232;
        transform: rotate(-45deg);
        pointer-events: none;
      }
      .node:active {
        cursor: grabbing;
      }
      .node.selected {
        cursor: move;
        outline: var(--selection-ring-width, 2px) solid #2563eb;
        outline-offset: var(--selection-ring-offset, 2px);
        border-color: #4169d8;
        box-shadow:
          0 0 0 3px #4169d82b,
          0 4px 14px #23324c20;
      }
      .node.port-alignment-owner {
        outline: 2px dashed #7e22ce;
        outline-offset: 5px;
      }
      .node.port-alignment-reference {
        outline: 3px solid #0f766e;
        outline-offset: 5px;
      }
      .node.port-alignment-owner::after,
      .node.port-alignment-reference::after {
        position: absolute;
        top: -25px;
        left: 8px;
        z-index: 20;
        padding: 3px 6px;
        border-radius: 4px;
        color: #fff;
        font:
          700 10px/14px Arial,
          sans-serif;
        white-space: nowrap;
        pointer-events: none;
        content: attr(data-alignment-role);
      }
      .node.port-alignment-owner::after {
        background: #7e22ce;
      }
      .node.port-alignment-reference::after {
        background: #0f766e;
      }
      .node.editing {
        user-select: text;
        cursor: text;
        outline: none;
      }
      .node .label {
        pointer-events: none;
      }
      .node.editing .label {
        pointer-events: auto;
      }
      .node.label-positioned .label {
        position: absolute;
        left: var(--label-x, 50%);
        top: var(--label-y, 50%);
        transform: translate(-50%, -50%);
        width: max-content;
        max-width: 360px;
        white-space: pre-wrap;
        overflow-wrap: normal;
        pointer-events: none;
      }
      .node.label-position-mode .label {
        pointer-events: auto;
        cursor: move;
        touch-action: none;
      }
      .node.selected .resize-corner {
        display: none;
      }
      /* CSS-04 | Mânerele de redimensionare
       * Stratul separat păstrează mânerele accesibile deasupra nodurilor înglobate.
       * Mânerele de colț și de latură au forme și direcții de tragere distincte.
       */
      .resize-handles {
        position: absolute;
        inset: 0;
        z-index: 100000;
        pointer-events: none;
      }
      .node-resize-handle {
        position: absolute;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        touch-action: none;
        display: grid;
        place-items: center;
      }
      .node-resize-handle::after {
        content: '';
        box-sizing: border-box;
        width: 10px;
        height: 10px;
        border: 0 solid #3266b3;
        filter: drop-shadow(0 0 1px #fff);
      }
      .node-resize-handle[data-corner='nw']::after {
        border-top-width: 2px;
        border-left-width: 2px;
      }
      .node-resize-handle[data-corner='ne']::after {
        border-top-width: 2px;
        border-right-width: 2px;
      }
      .node-resize-handle[data-corner='sw']::after {
        border-bottom-width: 2px;
        border-left-width: 2px;
      }
      .node-resize-handle[data-corner='se']::after {
        border-bottom-width: 2px;
        border-right-width: 2px;
      }
      .node-resize-handle[data-corner='n']::after,
      .node-resize-handle[data-corner='s']::after {
        width: 12px;
        height: 3px;
        background: #3266b3;
        border-radius: 2px;
      }
      .node-resize-handle[data-corner='e']::after,
      .node-resize-handle[data-corner='w']::after {
        width: 3px;
        height: 12px;
        background: #3266b3;
        border-radius: 2px;
      }
      .node-resize-handle:hover::after {
        border-color: #174a9b;
        filter: drop-shadow(0 0 2px #fff);
      }
      .presentation .resize-handles {
        display: none;
      }
      /* CSS-05 | Mesaje, prezentare și completări geometrice
       * Acoperă planșa goală, notificările și ascunderea comenzilor în prezentare.
       * Urmează adaptările inițiale pentru containere, colțuri și marca aplicației.
       */
      .empty-demo {
        display: block;
        margin: 14px auto 0;
        pointer-events: auto;
      }
      .empty {
        color: #788397;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
      }
      .toast {
        position: absolute;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: #202b40;
        color: white;
        padding: 9px 14px;
        border-radius: 8px;
        opacity: 0;
        transition: opacity 0.18s;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
      }
      .file {
        display: none;
      }
      .presentation .bar {
        display: none;
      }
      .presentation .canvas {
        height: 100vh;
      }
      .small {
        font-size: 12px;
        color: #657085;
      }
      @media (max-width: 700px) {
        .bar {
          gap: 5px;
          padding: 6px;
          height: auto;
          min-height: 56px;
          flex-wrap: wrap;
        }
        .brand {
          display: none;
        }
        .hint {
          display: none;
        }
        .canvas {
          height: calc(100vh - 56px);
        }
      }
      .edge.preview {
        stroke-dasharray: 7 6;
        pointer-events: none;
        opacity: 0.8;
      }
      .node.container {
        align-items: flex-start;
        justify-content: flex-start;
        text-align: left;
      }
      .node {
        touch-action: none;
      }
      .resize-corner {
        position: absolute;
        width: 22px;
        height: 22px;
        touch-action: none;
        display: none;
        z-index: 3;
      }
      .resize-corner.nw {
        left: -8px;
        top: -8px;
        cursor: nwse-resize;
      }
      .resize-corner.ne {
        right: -8px;
        top: -8px;
        cursor: nesw-resize;
      }
      .resize-corner.sw {
        left: -8px;
        bottom: -8px;
        cursor: nesw-resize;
      }
      .resize-corner.se {
        right: -8px;
        bottom: -8px;
        cursor: nwse-resize;
      }
      .resize-corner.n,
      .resize-corner.s {
        left: 50%;
        width: 28px;
        height: 12px;
        transform: translateX(-50%);
        cursor: ns-resize;
      }
      .resize-corner.n {
        top: -6px;
      }
      .resize-corner.s {
        bottom: -6px;
      }
      .resize-corner.e,
      .resize-corner.w {
        top: 50%;
        width: 12px;
        height: 28px;
        transform: translateY(-50%);
        cursor: ew-resize;
      }
      .resize-corner.e {
        right: -6px;
      }
      .resize-corner.w {
        left: -6px;
      }
      .brand {
        line-height: 1.05;
        white-space: nowrap;
      }
      .brand small {
        font-size: 11px;
        font-weight: 500;
        color: #657085;
      }
      @media (max-width: 700px) {
        .brand {
          display: block;
        }
      }
      .marquee {
        position: absolute;
        display: none;
        border: 1px dashed #4169d8;
        background: #4169d824;
        pointer-events: none;
        z-index: 20;
      }
      /* CSS-06 | Așezarea de bază a barei și straturilor planșei
       * Ajustează contracția comenzilor și înălțimea planșei după bara măsurată de editor.
       */
      body {
        display: flex;
        flex-direction: column;
      }
      .bar {
        height: auto;
        min-height: 56px;
        flex: none;
        flex-wrap: wrap;
        overflow: visible;
        gap: 6px;
        padding: 6px 10px;
      }
      .bar > * {
        flex-shrink: 0;
      }
      .bar .spacer {
        display: none;
      }
      .bar button,
      .bar .filebtn {
        padding: 6px 9px;
      }
      .canvas {
        height: auto;
        flex: 1;
        min-height: 0;
        min-width: 0;
      }
      .edges {
        z-index: 0;
      }
      /* CSS-07 | Porturi, numărătoare și controale de stil
       * Separă zonele interactive ale porturilor de desen și marchează selecția/alinierea.
       * Comenzile N/E/S/W își păstrează dimensiunea independent de zoom-ul diagramei.
       */
      .edge-style {
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        color: #42536f;
        font-size: 13px;
      }
      .edge-style[hidden] {
        display: none;
      }
      .edge-style input[type='color'] {
        width: 34px;
        height: 30px;
        padding: 2px;
        border: 1px solid #cfd6e2;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      .edge-style input[type='checkbox'] {
        accent-color: #4169d8;
      }
      .ports-layer {
        position: absolute;
        inset: 0;
        z-index: 10001;
        pointer-events: none;
        display: none;
      }
      .ports-layer.active {
        display: block;
      }
      .port {
        position: absolute;
        width: 10px;
        height: 10px;
        border: 1.5px solid #4169d8;
        border-radius: 50%;
        background: #fff;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        cursor: crosshair;
        touch-action: none;
        box-shadow: 0 0 0 2px #ffffffcc;
      }
      .port.cardinal-port {
        width: 10px;
        height: 10px;
        aspect-ratio: 1/1;
        flex: none;
        border: 1.5px solid #334155;
        border-radius: 2px;
        background: #fff;
        box-shadow: none;
        z-index: 2;
        position: absolute;
      }
      .port.cardinal-port::before {
        content: '';
        position: absolute;
        inset: -5px;
      }
      body.port-position-mode .port.cardinal-port {
        cursor: move;
      }
      .port.cardinal-port:hover,
      .port.cardinal-port.target {
        background: #e2e8f0;
        border-color: #334155;
        box-shadow: 0 0 0 2px #fff;
      }
      .port.cardinal-port.port-selected {
        background: #dbeafe;
        border-color: #1d4ed8;
        outline: 2px solid #4169d8;
        outline-offset: 2px;
      }
      .port.cardinal-port.port-alignment-participant {
        z-index: 2;
        background: #f59e0b;
        border-color: #92400e;
        outline: 3px solid #fbbf24;
        outline-offset: 2px;
        box-shadow: 0 0 0 5px #fbbf2433;
      }
      .port-counts {
        display: flex;
        align-items: center;
        gap: 1px;
        white-space: nowrap;
        font-size: 11px;
        color: #42536f;
      }
      .port-counts[hidden] {
        display: none;
      }
      .port-count {
        display: inline-flex;
        align-items: center;
        gap: 0;
        padding: 0;
      }
      .port-count b {
        font-size: 10px;
        min-width: 8px;
        text-align: center;
      }
      .port-count button {
        min-width: 18px;
        height: 23px;
        padding: 0;
        font-size: 12px;
        line-height: 1;
      }
      .port:hover,
      .port.target {
        width: 14px;
        height: 14px;
        background: #4169d8;
        border-color: #fff;
        box-shadow: 0 0 0 3px #4169d866;
      }
      .presentation .ports-layer {
        display: none;
      }
      .edge.selected {
        stroke: #2f6bff !important;
        stroke-width: 3.2;
      }
      /* CSS-08 | Mânerele punctelor unei conexiuni
       * Definește suprafața de prindere și marcajele coturilor și capetelor editabile.
       */
      .edge-handles {
        position: absolute;
        inset: 0;
        z-index: 10002;
        pointer-events: none;
      }
      .edge-handle {
        position: absolute;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        border: 0;
        background: transparent;
        border-radius: 50%;
        cursor: grab;
        pointer-events: auto;
        touch-action: none;
      }
      .edge-handle::after {
        content: '';
        display: block;
        width: 45%;
        height: 45%;
        border: 2px solid #2f6bff;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 2px #fff;
      }
      .edge-handle.mid::after {
        background: #2f6bff;
      }
      .edge-handle:hover::after {
        box-shadow: 0 0 0 4px #8cb4ff99;
      }
      /* CSS-09 | Paleta și alegerea culorilor
       * Prezintă culoarea activă, paleta și câmpurile pentru valori personalizate.
       */
      .color-trigger {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .color-chip {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 1px solid #8c97aa;
        border-radius: 4px;
        background: var(--chip, #fff);
      }
      .color-popover {
        position: fixed;
        z-index: 20000;
        width: min(320px, calc(100vw - 16px));
        padding: 12px;
        background: #fff;
        border: 1px solid #cfd6e2;
        border-radius: 10px;
        box-shadow: 0 12px 32px #18243a33;
      }
      .color-popover[hidden] {
        display: none;
      }
      .port-count button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        background: #f2f4f7;
        border-color: #d9dee7;
      }
      .color-grid {
        display: grid;
        grid-template-columns: repeat(10, minmax(0, 1fr));
        gap: 3px;
        margin: 0;
      }
      .color-grid + .color-grid {
        margin-top: 8px;
      }
      .color-grid button {
        width: 100%;
        height: 23px;
        padding: 0;
        border: 1px solid #aab2bf;
        background: var(--swatch);
        border-radius: 3px;
      }
      .color-grid button[aria-label='#FFFFFF'],
      .color-grid button[aria-label='#E7E6E6'] {
        border-color: #778397;
      }
      .color-grid button:hover,
      .color-grid button:focus-visible {
        outline: 2px solid #244f9e;
        outline-offset: 1px;
        z-index: 1;
      }
      .color-custom {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .color-custom input[type='color'] {
        width: 38px;
        height: 32px;
        padding: 2px;
      }
      .color-custom input[type='text'] {
        width: 82px;
        min-width: 0;
        padding: 5px;
        border: 1px solid #cfd6e2;
        border-radius: 5px;
        font: inherit;
      }
      .color-popover .reset-color {
        width: 100%;
        margin-top: 8px;
      }
      .edge-style select {
        border: 1px solid #cfd6e2;
        border-radius: 6px;
        background: #fff;
        color: #172033;
        padding: 6px;
        font: inherit;
        cursor: pointer;
      }
      /* CSS-10 | Meniu, dialoguri, fișiere și vederea de ansamblu
       * Meniul și dialogurile stau deasupra planșei, fără să intre în geometria diagramei.
       * Blocul include grila, importul/exportul, biblioteca locală și avertizările de afișare.
       */
      .app-menu {
        position: fixed;
        z-index: 30000;
        top: 54px;
        left: 10px;
        width: min(380px, calc(100vw - 20px));
        max-height: calc(100vh - 64px);
        overflow: auto;
        padding: 12px;
        background: #fff;
        border: 1px solid #cfd6e2;
        border-radius: 10px;
        box-shadow: 0 16px 40px #18243a38;
        font:
          13px/1.4 system-ui,
          Segoe UI,
          Arial,
          sans-serif;
        color: #172033;
      }
      .app-menu * {
        font-family: inherit;
      }
      .app-menu button,
      .app-menu input,
      .app-menu select {
        font: inherit;
        font-size: 13px;
      }
      .app-menu[hidden] {
        display: none;
      }
      .zoom-controls {
        position: static;
        z-index: auto;
        display: flex;
        align-items: center;
        gap: 3px;
        margin-left: auto;
        padding: 0;
        background: transparent;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .zoom-controls button {
        min-width: 32px;
        text-align: center;
        padding: 6px 8px;
      }
      #zoomReset {
        min-width: 48px;
        font-variant-numeric: tabular-nums;
        font-weight: 650;
      }
      .app-dialog {
        width: min(380px, calc(100vw - 32px));
        padding: 0;
        border: 1px solid #cfd6e2;
        border-radius: 12px;
        box-shadow: 0 18px 50px #18243a44;
        color: #172033;
      }
      .app-dialog::backdrop {
        background: #10182766;
      }
      .app-dialog form {
        padding: 18px;
      }
      .app-dialog h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .app-dialog p {
        margin: 0 0 14px;
        color: #596579;
      }
      .app-dialog input {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid #cfd6e2;
        border-radius: 7px;
        font: inherit;
      }
      .app-dialog .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }
      .app-dialog .dialog-confirm {
        background: #4169d8;
        color: #fff;
        border-color: #4169d8;
      }
      .app-dialog .dialog-danger {
        background: #b42318;
        color: #fff;
        border-color: #b42318;
      }
      .grid-options {
        display: grid;
        gap: 7px;
        padding: 3px 5px 6px;
        font-size: 13px;
      }
      .export-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        padding: 4px;
      }
      .export-options label {
        grid-column: 1/-1;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .export-options select {
        min-width: 0;
        width: 100%;
        height: 30px;
        padding: 3px 6px;
        border: 1px solid #cfd6e2;
        border-radius: 5px;
        background: #fff;
        color: #172033;
      }
      .export-options button {
        min-width: 0;
        min-height: 30px;
        padding: 4px 6px;
      }
      .grid-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .grid-option.check {
        justify-content: flex-start;
      }
      .grid-option input[type='range'] {
        width: 130px;
        accent-color: #4169d8;
      }
      .grid-option output {
        min-width: 38px;
        text-align: right;
        color: #657085;
      }
      .menu-section {
        font-size: 12px;
        font-weight: 700;
        color: #64748b;
        margin: 10px 5px 5px;
      }
      .menu-row {
        display: flex;
        gap: 5px;
        margin: 4px 0;
      }
      .menu-row button {
        flex: 1;
        text-align: left;
      }
      .saved-diagram {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 3px 0;
      }
      .saved-diagram button:first-child {
        flex: 1;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .saved-diagram.active button:first-child {
        font-weight: 700;
        border-color: #4169d8;
        background: #eef3ff;
      }
      .menu-danger {
        color: #b42318;
        border-color: #efb4ae;
      }
      .overview {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
        pointer-events: none;
      }
      .geometry-warning {
        position: absolute;
        left: 14px;
        bottom: 14px;
        z-index: 30000;
        max-width: min(520px, calc(100% - 28px));
        padding: 8px 11px;
        border: 1px solid #efb4ae;
        border-radius: 7px;
        background: #fff6f5;
        color: #8a261e;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .geometry-warning button {
        flex: none;
        padding: 5px 8px;
        border-color: #d87b70;
        color: #8a261e;
        background: #fff;
      }
      .geometry-warning[hidden] {
        display: none;
      }
      /* CSS-11 | Bara compactă, alinierea și comenzile de formatare
       * Completează baza CSS-06 cu grupurile configurabile, porturile și zoom-ul compact.
       * Selectoarele restrânse la .bar nu schimbă aspectul controalelor din meniuri sau panouri.
       */
      .bar {
        height: 48px;
        min-height: 48px;
        flex-wrap: nowrap;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        gap: 0;
        padding: 4px 8px;
      }
      .bar::-webkit-scrollbar {
        display: none;
      }
      .bar [hidden] {
        display: none !important;
      }
      .bar .brand {
        display: flex;
        align-items: baseline;
        gap: var(--toolbar-version-gap, 5px);
        margin: 0 0 0 4px;
        font-size: 14px;
        width: auto;
        min-width: max-content;
      }
      .brand small {
        font-size: 10px;
        font-weight: 500;
        color: #657085;
      }
      .bar button,
      .bar .filebtn {
        flex: none;
        width: 34px;
        height: 34px;
        min-width: 34px;
        padding: 0;
        display: inline-grid;
        place-items: center;
        border-radius: 6px;
        font-size: 18px;
        line-height: 1;
      }
      .bar .toolbar-gap {
        display: block;
        flex: 1 1 20px;
        min-width: 12px;
      }
      .bar .toolbar-gap-brand {
        flex: none;
        width: var(--toolbar-brand-after, 22px);
        min-width: var(--toolbar-brand-after, 22px);
      }
      .bar .toolbar-group {
        display: flex;
        align-items: center;
        gap: 5px;
        flex: none;
      }
      .bar .toolbar-actions {
        gap: 0;
      }
      .bar .toolbar-subgroup {
        display: flex;
        align-items: center;
        gap: 5px;
        flex: none;
      }
      .bar .toolbar-right {
        gap: 0;
        flex: none;
      }
      .bar .toolbar-group-gap {
        height: 22px;
        flex: none;
        border-left: 1px dotted #aeb9ca;
        opacity: 0.85;
      }
      .bar .toolbar-ports {
        gap: 7px;
      }
      .bar .port-counts {
        gap: 7px;
      }
      .bar .port-count {
        gap: 2px;
      }
      .bar .port-count button {
        width: 24px;
        min-width: 24px;
        height: 30px;
        font-size: 14px;
      }
      .bar .port-count b {
        font-size: 11px;
        min-width: 10px;
      }
      .bar #zoomReset {
        width: 46px;
        min-width: 46px;
        font-size: 12px;
      }
      .bar #rotateNodeBack,
      .bar #rotateNode,
      .bar #resetNodePose {
        font-size: 11px;
        letter-spacing: -0.35px;
      }
      .bar #multiSelect {
        font-size: 16px;
      }
      .bar #fit {
        font-size: 16px;
      }
      /* Aliniere: grupează separat marginile, distribuirea, dimensiunile și porturile. */
      .align-popup {
        position: fixed;
        z-index: 20010;
        display: grid;
        grid-template-columns: repeat(3, 36px);
        gap: 6px 4px;
        width: max-content;
        padding: 8px;
        border: 1px solid #cfd6e2;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 8px 24px #18243a33;
      }
      .align-popup[hidden] {
        display: none;
      }
      .align-popup .align-axis-group {
        grid-column: 1/-1;
        display: grid;
        grid-template-columns: repeat(3, 36px);
        gap: 4px;
      }
      .align-popup .node-align-options {
        display: grid;
        grid-template-columns: repeat(3, 36px);
        gap: 6px 4px;
      }
      .align-popup .node-align-options.port-selection .align-size-group,
      .align-popup .node-align-options.port-selection .align-grid {
        display: none;
      }
      .align-popup .align-distribute-group {
        grid-column: 1/-1;
        display: grid;
        grid-template-columns: repeat(2, 36px);
        justify-content: center;
        gap: 4px;
        padding-top: 6px;
        border-top: 1px solid #e5e9f0;
      }
      .align-popup .align-size-group {
        grid-column: 1/-1;
        display: grid;
        grid-template-columns: repeat(3, 36px);
        gap: 4px;
        padding-top: 6px;
        border-top: 1px solid #e5e9f0;
      }
      .align-popup .node-align-options[hidden] {
        display: none;
      }
      .align-popup button {
        width: 36px;
        min-width: 36px;
        height: 36px;
        padding: 0;
        font-size: 19px;
      }
      .align-popup .align-grid {
        grid-column: 2;
      }
      .bar .edge-style {
        gap: 4px;
      }
      .bar .edge-style .color-trigger {
        position: relative;
        width: 34px;
        min-width: 34px;
        height: 34px;
        padding: 0;
        font-size: 0;
      }
      .bar .edge-style .color-trigger::before {
        font-size: 18px;
        line-height: 1;
        color: var(--glyph-color, #172033);
        text-shadow: 0 0 1px #53627a;
      }
      .bar #nodeFillBtn::before {
        content: '▰';
      }
      .bar #nodeStrokeBtn::before {
        content: '▱';
      }
      .bar #nodeTextBtn::before,
      .bar #edgeLabelColorBtn::before {
        content: 'A';
      }
      .bar #edgeColorBtn::before {
        content: '╱';
      }
      .bar .edge-style select {
        appearance: none;
        width: 34px;
        min-width: 34px;
        height: 34px;
        padding: 0;
        color: transparent;
        border-radius: 6px;
        background-color: #fff;
        background-position: center;
        background-repeat: no-repeat;
      }
      .bar .edge-style select option {
        color: #172033;
        font-size: 13px;
      }
      .bar .edge-style select[data-style='solid'] {
        background-image: linear-gradient(#172033, #172033);
        background-size: 18px 2px;
      }
      .bar .edge-style select[data-style='dashed'] {
        background-image: repeating-linear-gradient(90deg, #172033 0 4px, transparent 4px 7px);
        background-size: 18px 2px;
      }
      .bar .edge-style select[data-style='dotted'] {
        background-image: radial-gradient(circle, #172033 1px, transparent 1.5px);
        background-size: 5px 3px;
      }
      /* CSS-12 | Categorii de meniu și configurarea barei
       * Categoriile pot fi restrânse; câmpurile de configurare permit grupare, ordine și spațiere.
       * Completările pentru fișiere și ecrane înguste păstrează comenzile în lățimea meniului.
       */
      .menu-category {
        margin: 8px 0;
        border: 1px solid #e1e6ef;
        border-radius: 8px;
        background: #fff;
      }
      .menu-category > summary {
        padding: 9px 10px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 650;
        color: #25334a;
        list-style-position: inside;
      }
      .menu-category[open] > summary {
        border-bottom: 1px solid #e8ecf2;
        background: #f8faff;
        border-radius: 8px 8px 0 0;
      }
      .menu-category-body {
        padding: 9px;
      }
      .toolbar-settings {
        display: grid;
        gap: 9px;
        padding: 3px 0;
      }
      .toolbar-settings-note {
        margin: 0 0 4px;
        color: #657085;
        font-size: 13px;
      }
      .toolbar-brand-settings {
        display: grid;
        gap: 4px;
        padding: 8px;
        margin-bottom: 8px;
        border: 1px solid #e1e6ef;
        border-radius: 7px;
        background: #f8faff;
      }
      .toolbar-brand-settings strong {
        font-size: 13px;
        font-weight: 650;
      }
      .toolbar-setting {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }
      .toolbar-setting label {
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 28px;
      }
      .toolbar-setting input {
        margin: 0;
        accent-color: #4169d8;
      }
      .toolbar-group-card {
        padding: 8px;
        border: 1px solid #dfe5ee;
        border-radius: 8px;
        background: #fbfcfe;
      }
      .toolbar-group-head {
        display: grid;
        grid-template-columns: minmax(80px, 1fr) auto auto auto;
        align-items: center;
        gap: 5px;
      }
      .toolbar-group-head input {
        min-width: 0;
        width: 100%;
        height: 30px;
        padding: 4px 7px;
        border: 1px solid #cfd6e2;
        border-radius: 5px;
        background: #fff;
      }
      .toolbar-side-setting {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 7px 0;
        color: #46546b;
        font-size: 13px;
      }
      .toolbar-side-setting select {
        height: 27px;
        padding: 2px 6px;
        border: 1px solid #d5dbe5;
        border-radius: 5px;
        background: #fff;
        color: #25334a;
      }
      .toolbar-group-head button,
      .toolbar-tool button {
        width: 30px;
        height: 30px;
        min-width: 30px;
        padding: 0;
        font-size: 13px;
      }
      .toolbar-group-head button:disabled,
      .toolbar-tool button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .toolbar-gap-setting {
        display: grid;
        grid-template-columns: auto 1fr 36px;
        align-items: center;
        gap: 8px;
        margin: 7px 0;
        color: #46546b;
        font-size: 13px;
      }
      .toolbar-gap-setting input {
        width: 100%;
        margin: 0;
        accent-color: #4169d8;
      }
      .toolbar-gap-setting output {
        padding: 2px 4px;
        border-radius: 4px;
        background: #edf1f7;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .toolbar-group-tools {
        display: grid;
        gap: 3px;
      }
      .toolbar-tool {
        display: grid;
        grid-template-columns: minmax(95px, 1fr) minmax(105px, auto) auto auto;
        align-items: center;
        gap: 5px;
        min-height: 30px;
        padding: 2px 0;
        border-top: 1px solid #edf0f5;
      }
      .toolbar-tool > label {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .toolbar-tool select,
      .toolbar-group-add select {
        width: 100%;
        min-width: 0;
        height: 27px;
        padding: 2px 5px;
        border: 1px solid #d5dbe5;
        border-radius: 5px;
        background: #fff;
        color: #25334a;
      }
      .toolbar-group-add {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
        margin-top: 7px;
      }
      .toolbar-group-add button,
      .toolbar-group-add select {
        height: 30px;
        padding: 3px 6px;
      }
      .toolbar-group-add button {
        white-space: nowrap;
      }
      .toolbar-group-new {
        width: 100%;
        height: 31px;
        margin: 5px 0;
        padding: 4px 8px;
        text-align: left;
      }
      .menu-brand {
        font-size: 13px;
        font-weight: 650;
        padding: 5px 4px 9px;
        margin: 0 2px 8px;
        border-bottom: 1px solid #e2e8f0;
      }
      .menu-section {
        font-size: 13px;
        font-weight: 650;
        color: #46546b;
        margin: 8px 2px 5px;
      }
      .menu-row {
        gap: 6px;
        margin: 6px 0;
        flex-wrap: wrap;
      }
      .menu-row button {
        min-width: 0;
        min-height: 30px;
        padding: 4px;
        text-align: center;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .menu-file-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid-options {
        font-size: 13px;
        padding: 4px;
      }
      .saved-diagram {
        padding: 3px 0;
      }
      .zoom-controls {
        gap: 2px;
      }
      .zoom-controls button {
        width: 31px;
        min-width: 31px;
        padding: 0;
        font-size: 15px;
      }
      #zoomReset {
        width: 45px;
        min-width: 45px;
        font-size: 12px;
      }
      .menu-brand {
        font-weight: 650;
        font-size: 13px;
        padding: 5px 4px 9px;
        margin: 0 2px 8px;
        border-bottom: 1px solid #e2e8f0;
      }
      @media (max-width: 540px) {
        .bar .brand {
          font-size: 13px;
        }
        .bar .toolbar-ports {
          margin-left: 6px;
          padding-left: 6px;
        }
        .bar .toolbar-group {
          gap: 3px;
        }
      }
      @media (max-width: 410px) {
        .bar {
          padding: 4px 5px;
        }
        .bar button,
        .bar .filebtn {
          width: 32px;
          min-width: 32px;
        }
        .bar .toolbar-ports {
          gap: 3px;
        }
        .bar .port-counts {
          gap: 3px;
        }
        .bar .port-count button {
          width: 22px;
          min-width: 22px;
        }
      }

      /* CSS-13 | Panoul proprietăților și câmpurile de editare
       * Panoul urmărește înălțimea barei și permite restrângerea sau derularea proprietăților.
       * Câmpurile comune sunt completate de selectorul Iconițe/Text din meniu.
       */
      #propertiesPanel {
        position: fixed;
        right: 12px;
        top: calc(var(--bar-height, 56px) + 12px);
        width: 290px;
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - var(--bar-height, 56px) - 36px);
        overflow: auto;
        z-index: 1100;
        background: #fff;
        border: 1px solid #cfd6e2;
        border-radius: 10px;
        padding: 14px;
        box-shadow: 0 4px 20px #17203320;
        font-size: 13px;
      }
      #propertiesPanel[hidden] {
        display: none;
      }
      #propertiesPanel.collapsed {
        width: auto;
        padding: 6px;
      }
      #propertiesPanel h3 {
        font-size: 15px;
        margin: 10px 0;
        overflow-wrap: anywhere;
      }
      #propertiesPanel p {
        line-height: 1.5;
      }
      #propertiesPanel button {
        margin: 4px 4px 4px 0;
        padding: 6px 9px;
        font-size: 12px;
      }
      .property-field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 9px 0;
        font-size: 13px;
      }
      .property-field input:not([type='checkbox']),
      .property-field select {
        min-width: 0;
        width: 148px;
        max-width: 58%;
        border: 1px solid #cfd6e2;
        border-radius: 5px;
        padding: 6px;
        color: #172033;
        background: #fff;
        font: inherit;
      }
      .property-field input[type='checkbox'] {
        width: 16px;
        height: 16px;
      }
      .toolbar-display-field {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 100px;
        gap: 10px;
        margin: 0 0 14px;
      }
      .toolbar-display-field select {
        width: 100%;
        max-width: none;
        min-width: 0;
      }
      /* CSS-14 | Despre ELS și documentația funcțională
       * Separă scopul și modul de utilizare, cu texte care se încadrează și în meniul îngust.
       */
      .app-help p {
        margin: 8px 0;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .app-help h3 {
        margin: 16px 0 8px;
        font-size: 14px;
      }
      .app-help-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .app-help-list li {
        padding: 12px 0;
        border-top: 1px solid #e5e9f0;
      }
      .app-help-list h4 {
        font-size: 13px;
        margin: 0 0 6px;
      }
      .app-help-use {
        color: #4f5e76;
      }
      /* CSS-15 | Grupuri sincronizate și marcajele membrilor
       * Afișează regulile, previzualizarea seriei și apartenența vizuală a nodurilor la grup.
       */
      .sync-editor {
        border-top: 1px solid #dce1ea;
        margin-top: 14px;
        padding-top: 12px;
      }
      .sync-editor summary {
        font-weight: 600;
        cursor: pointer;
      }
      .sync-members {
        max-height: 130px;
        overflow: auto;

      /* CSS-16 | Tipuri de nod și moduri de afișare a textului

       */
      .node-role {
        position: absolute;
        left: 8px;
        top: 50%;

       * Punctul activ are un marcaj persistent; săgețile nu interceptează selectarea liniei.
       */
      .edge-label {
        pointer-events: all;

    <script>
      /** Activează reîncărcarea automată exclusiv pe serverul local de dezvoltare ELS. */

      /**
       * Deschide fluxul de hot reload numai pe localhost:8765; nu inițiază conexiuni când HTML-ul este deschis din fișier sau găzduit în altă parte.
       */
      function enableLocalDevelopmentReload() {
        if (
          location.protocol !== 'http:' ||
          !['127.0.0.1', 'localhost'].includes(location.hostname) ||
          location.port !== '8765'
        )
          return;
        const stream = new EventSource('/__reload');
        stream.addEventListener('reload', () => location.replace('/'));
        window.addEventListener('pagehide', () => stream.close(), { once: true });
      }
      enableLocalDevelopmentReload();
    </script>

              data.serial > Number.MAX_SAFE_INTEGER - IMPORT_LIMITS.nodes)
          )
            throw Error('Contor de identificatori invalid');
          if (
            !Array.isArray(data.nodes) ||
            !Array.isArray(data.edges) ||
            data.nodes.length > IMPORT_LIMITS.nodes ||
            data.edges.length > IMPORT_LIMITS.edges
          )
            throw Error('Diagrama depășește limitele de import');
          // Metadatele sunt păstrate; cheile care pot afecta prototipurile și imbricarea excesivă sunt respinse.
          const pendingObjects = [{ value: data, depth: 0 }];
          let visitedProperties = 0;
          while (pendingObjects.length) {
            const { value, depth } = pendingObjects.pop();
            if (depth > 32) throw Error('Metadate prea adânc imbricate');
            for (const [key, child] of Object.entries(value)) {
              if (++visitedProperties > 500000) throw Error('Prea multe proprietăți');
              if (['__proto__', 'constructor', 'prototype'].includes(key))
                throw Error('Cheie de metadate nepermisă');
              if (child !== null && typeof child === 'object')
                pendingObjects.push({ value: child, depth: depth + 1 });
            }
          }
          const nodeIds = new Set(),
            edgeIds = new Set();
          let totalPorts = 0;
          const validId =
            /**
             * Validează identificatorul înainte de folosirea lui în model și în selectori DOM.
             */
            (value) =>
              typeof value === 'string' &&
              /^[A-Za-z0-9_.:-]{1,160}$/.test(value) &&
              !['__proto__', 'prototype', 'constructor'].includes(value);
          const finite =
            /**
             * Verifică tipul numeric, finitudinea și limita absolută a unei coordonate.
             */
            (value, bound = MAX_WORLD_COORD) =>
              typeof value === 'number' && Number.isFinite(value) && Math.abs(value) < bound;
          const text =
            /**
             * Acceptă numai texte cu lungime limitată sau câmpuri opționale absente.
             */
            (value) =>
              value === undefined ||
              (typeof value === 'string' && value.length <= IMPORT_LIMITS.text);
          const point =
            /**
             * Verifică existența unui punct cu două coordonate numerice valide.
             */
            (value) =>
              value &&
              typeof value === 'object' &&
              !Array.isArray(value) &&
              finite(value.x) &&
              finite(value.y);
          const colors =
            /**
             * Respinge culorile nepermise pentru câmpurile de stil indicate.
             */
            (value, keys) => {
              for (const key of keys)
                if (value[key] !== undefined && !isSafeDiagramColor(value[key]))
                  throw Error('Culoare invalidă');
            };
          for (const node of data.nodes) {
            if (
              !node ||
              typeof node !== 'object' ||
              Array.isArray(node) ||
              !validId(node.id) ||
              nodeIds.has(node.id)
            )
              throw Error('Identificator de nod invalid sau duplicat');
            nodeIds.add(node.id);
            if (node.kind !== undefined && !Object.hasOwn(NODE_KINDS, node.kind))
              throw Error('Tip de nod invalid');
            if (
              node.labelWrap !== undefined &&
              !['auto', 'manual', 'single'].includes(node.labelWrap)
            )
              throw Error('Mod de text invalid');
            if (
              node.sync &&
              (!validId(node.sync.id) ||
                !Number.isSafeInteger(node.sync.number) ||
                node.sync.number < 0 ||
                node.sync.number > 999999 ||
                !validSyncSettings(node.sync.settings))
            )
              throw Error('Grup sincronizat invalid');
            // ID-urile numerice avansează contorul local. Se resping valorile care nu pot fi
            // incrementate exact și se rezervă capacitate pentru toate nodurile importate.
            if (/^n\d+$/.test(node.id)) {
              const numericId = Number(node.id.slice(1));
              if (
                !Number.isSafeInteger(numericId) ||
                numericId > Number.MAX_SAFE_INTEGER - IMPORT_LIMITS.nodes - 1
              )
                throw Error('Identificator numeric prea mare');
            }
            if (
              !finite(node.x) ||
              !finite(node.y) ||
              !text(node.label) ||
              !text(node.overviewLabel)
            )
              throw Error('Poziție sau etichetă invalidă');
            for (const key of ['manualW', 'manualH'])
              if (
                node[key] !== undefined &&
                (!finite(node[key], IMPORT_LIMITS.dimension) || node[key] <= 0)
              )
                throw Error('Dimensiune invalidă');
            if (node.rotation !== undefined && !finite(node.rotation, 1000000))
              throw Error('Rotație invalidă');
            if (node.parent !== undefined && node.parent !== null && !validId(node.parent))
              throw Error('Părinte invalid');
            if (node.labelPos !== undefined && !point(node.labelPos))
              throw Error('Poziție de etichetă invalidă');
            if (node.ports !== undefined) {
              if (!node.ports || typeof node.ports !== 'object' || Array.isArray(node.ports))
                throw Error('Porturi invalide');
              for (const [side, count] of Object.entries(node.ports)) {
                if (
                  !['N', 'E', 'S', 'W'].includes(side) ||
                  !Number.isInteger(count) ||
                  count < 0 ||
                  count > IMPORT_LIMITS.portsPerSide
                )
                  throw Error('Număr de porturi invalid');
                totalPorts += count;
              }
            }
            for (const key of ['wanPorts', 'lanPorts'])
              if (node[key] !== undefined) {
                if (
                  !Number.isInteger(node[key]) ||
                  node[key] < 0 ||
                  node[key] > IMPORT_LIMITS.portsPerSide
                )
                  throw Error('Porturi legacy invalide');
                totalPorts += node[key];
              }
            for (const key of ['portSlots', 'portPositions'])
              if (node[key] !== undefined) {
                if (!node[key] || typeof node[key] !== 'object' || Array.isArray(node[key]))
                  throw Error('Poziții de port invalide');
                for (const [name, value] of Object.entries(node[key]))
                  if (!/^[NESW][1-9]\d{0,2}$/.test(name) || !finite(value) || value < 0)
                    throw Error('Poziție de port invalidă');
              }
            colors(node, ['fill', 'stroke', 'textColor']);
            if (
              node.borderStyle !== undefined &&
              !['solid', 'dashed', 'dotted', 'none'].includes(node.borderStyle)
            )
              throw Error('Contur invalid');
          }
          if (totalPorts > IMPORT_LIMITS.totalPorts) throw Error('Prea multe porturi');
          for (const edge of data.edges) {
            if (
              !edge ||
              typeof edge !== 'object' ||
              Array.isArray(edge) ||
              !validId(edge.id) ||
              edgeIds.has(edge.id) ||
              !text(edge.label)
            )
              throw Error('Legătură invalidă');
            edgeIds.add(edge.id);
            if (
              edge.waypoints !== undefined &&
              (!Array.isArray(edge.waypoints) ||
                edge.waypoints.length > 64 ||
                !edge.waypoints.every(point))
            )
              throw Error('Puncte intermediare invalide');
            if (
              edge.arrows !== undefined &&
              !['none', 'start', 'end', 'both'].includes(edge.arrows)
            )
              throw Error('Capete de linie invalide');
            if (edge.labelAnchor !== undefined) {
              const a = edge.labelAnchor;
              if (
                !a ||
                !Number.isInteger(a.segment) ||
                a.segment < 0 ||
                a.segment > 256 ||
                !finite(a.t) ||
                a.t < 0 ||
                a.t > 1 ||
                !finite(a.dx) ||
                !finite(a.dy)
              )
                throw Error('Poziție de text invalidă');
            }
            for (const end of ['from', 'to']) {
              if (
                edge[end] !== undefined &&
                edge[end] !== null &&
                (!validId(edge[end]) || !nodeIds.has(edge[end]))
              )
                throw Error('Nod de conexiune inexistent');
              if (!edge[end] && !point(edge[end + 'Point'])) throw Error('Capăt liber invalid');
              if (
                edge[end + 'Port'] !== undefined &&
                edge[end + 'Port'] !== null &&
                (typeof edge[end + 'Port'] !== 'string' ||
                  edge[end + 'Port'].length > 32 ||
                  !/^[A-Za-z0-9]+$/.test(edge[end + 'Port']))
              )
                throw Error('Port de conexiune invalid');
            }
            for (const key of ['waypoint', 'fromPoint', 'toPoint'])
              if (edge[key] !== undefined && !point(edge[key]))
                throw Error('Punct de conexiune invalid');
            colors(edge, ['color', 'labelColor']);
            if (
              edge.lineStyle !== undefined &&
              !['solid', 'dashed', 'dotted'].includes(edge.lineStyle)
            )
              throw Error('Stil de linie invalid');
          }
          validateHierarchyDepth(data.nodes);
          const syncGroups = new Map();
          for (const n of data.nodes)
            if (n.sync) {
              const entry = syncGroups.get(n.sync.id);
              if (entry) {
                if (
                  entry.settings !== JSON.stringify(n.sync.settings) ||
                  entry.numbers.has(n.sync.number)
                )
                  throw Error('Membri sincronizați incompatibili');
                entry.numbers.add(n.sync.number);
              } else
                syncGroups.set(n.sync.id, {
                  settings: JSON.stringify(n.sync.settings),
                  numbers: new Set([n.sync.number]),
                });
            }
          return data;
        }

        /**
         * Limitează la 64 de noduri lanțul de părinți înainte de orice mutație, inclusiv la lipire
         * și restaurare din bibliotecă. Traversarea iterativă nu consumă stiva JavaScript.
         * Ciclurile scurte și părinții inexistenți rămân în sarcina normalizării existente.
         */
        function validateHierarchyDepth(candidateNodes) {
          const byId = new Map(candidateNodes.map((node) => [node.id, node]));
          for (const node of candidateNodes) {
            const seen = new Set();
            let current = node;
            while (current && !seen.has(current.id)) {
              seen.add(current.id);
              if (seen.size > IMPORT_LIMITS.hierarchyDepth)
                throw Error('Ierarhia depășește limita de 64 de niveluri');
              current = byId.get(current.parent);
            }
          }
        }

        // Indexul spațial al vederii este separat de grila geometrică. Containerele mari au o listă auxiliară.
        const viewCells = new Map();
        let viewWide = [],
          viewIndexVersion = -1;
        const edgeCells = new Map();
        let edgeWide = [],
          edgeIndexVersion = -1;
        let overviewActive = false,
          overviewFrame = 0;
        let renderedSelectedEdge = null;
        const uid =
          /**
           * Generează următorul identificator de nod din contorul local.
           */
          () => `n${serial++}`;

        // ============================================================================
        // 02. Modelul diagramei, Undo/Redo și actualizarea vederii
        // ============================================================================

        /**
         * Serializează nodurile, conexiunile, contorul de ID-uri și grila pentru istoricul Undo; vederea utilizatorului nu intră în acest instantaneu.
         */
        function snapshot() {
          return JSON.stringify({ nodes, edges, serial, geometry: gridMetadata() });
        }

        /**
         * Normalizează geometria, reține o stare distinctă în istoricul limitat la 80 de intrări, invalidează Redo și programează salvarea locală.
         */
        function remember() {
          propagateSyncedNodes();
          geometryVersion++;
          if (gridSettings.snap) normalizeGridGeometry();
          calculateNodeSizes(true);
          const s = snapshot();
          if (history.at(-1) !== s) {
            history.push(s);
            if (history.length > 80) history.shift();
          }
          future = [];
          scheduleSave();
        }

        /**
         * Decodează și validează importul, apoi migrează și randează noul model. Dacă o etapă
         * ulterioară validării eșuează, restaurează modelul, grila, vederea și selecția anterioare.
         * Salvarea noului model este programată numai după randarea reușită.
         */
        function loadState(json) {
          let previous;
          try {
            if (typeof json !== 'string' || json.length > IMPORT_LIMITS.bytes) return false;
            const data = decodeCellDiagram(JSON.parse(json));
            if (!Array.isArray(data.nodes) || !Array.isArray(data.edges)) return false;
            previous = {
              nodes,
              edges,
              serial,
              scale,
              pan,
              selected,
              selectedNodes: new Set(selectedNodes),
              selectedPorts: new Set(selectedPorts),
              selectedPortNodeId,
              selectedEdgePoint,
              selectedEdgeEnd,
              step: gridSettings.step,
            };
            if (data.geometry) {
              gridSettings.step = data.geometry.cell;
              if (menuPanel) {
                menuPanel.querySelector('#gridStep').value = String(gridSettings.step);
                menuPanel.querySelector('#gridStepValue').textContent = gridSettings.step + 'px';
              }
            }
            nodes = data.nodes;
            const legacyFirewalls = new Map(
              nodes.filter((n) => n.type === 'firewall').map((n) => [n.id, n]),
            );
            edges = data.edges.filter((edge) => !edge.automatic);
            for (const edge of edges)
              for (const end of ['from', 'to']) {
                const legacy = legacyFirewalls.get(edge[end]),
                  key = end + 'Port',
                  port = edge[key];
                if (legacy && port) {
                  const match = /^(wan|lan)(\d+)$/.exec(port);
                  if (match) edge[key] = `${match[1] === 'wan' ? 'N' : 'S'}${match[2]}`;
                }
              }
            for (const n of legacyFirewalls.values()) {
              n.ports = {
                N: Math.max(0, Number(n.wanPorts) || 0),
                E: 0,
                S: Math.max(0, Number(n.lanPorts) || 0),
                W: 0,
              };
              delete n.type;
              delete n.wanPorts;
              delete n.lanPorts;
            }
            const nodesById = new Map(nodes.map((n) => [n.id, n]));
            for (const edge of edges)
              for (const end of ['from', 'to']) {
                const node = nodesById.get(edge[end]),
                  port = edge[end + 'Port'];
                if (!hasCardinalPorts(node) || port == null) continue;
                const names = portNamesForNode(node);
                if (!names.includes(port)) edge[end + 'Port'] = cardinalPortNames(node)[0];
              }
            serial = Math.max(Number(data.serial) || 1, 1);
            for (const node of nodes)
              if (/^n\d+$/.test(node.id)) serial = Math.max(serial, Number(node.id.slice(1)) + 1);
            if (Number.isFinite(data.scale) && data.scale > 0)
              scale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, data.scale));
            if (Number.isFinite(data.pan?.x) && Number.isFinite(data.pan?.y))
              pan =
                Math.abs(data.pan.x) < MAX_WORLD_COORD && Math.abs(data.pan.y) < MAX_WORLD_COORD
                  ? { x: data.pan.x, y: data.pan.y }
                  : { x: 0, y: 0 };
            selected = null;
            selectedNodes.clear();
            updateZoomReadout();
            selectedEdgePoint = null;
            selectedEdgeEnd = null;
            geometryVersion++;
            routeCache.clear();
            naturalSizes.clear();
            nodeSizes.clear();
            normalizeHierarchy();
            world.style.transform = `translate(${pan.x}px,${pan.y}px) scale(${scale})`;
            clearTimeout(viewportTimer);
            render();
            scheduleSave();
            return true;
          } catch {
            if (previous) {
              nodes = previous.nodes;
              edges = previous.edges;
              serial = previous.serial;
              scale = previous.scale;
              pan = previous.pan;
              selected = previous.selected;
              selectedNodes = previous.selectedNodes;
              selectedPorts = previous.selectedPorts;
              selectedPortNodeId = previous.selectedPortNodeId;
              selectedEdgePoint = previous.selectedEdgePoint;
              selectedEdgeEnd = previous.selectedEdgeEnd;
              gridSettings.step = previous.step;
              geometryVersion++;
              routeCache.clear();
              naturalSizes.clear();
              nodeSizes.clear();
              world.style.transform = `translate(${pan.x}px,${pan.y}px) scale(${scale})`;
              updateZoomReadout();
              if (menuPanel) {
                menuPanel.querySelector('#gridStep').value = String(gridSettings.step);
                menuPanel.querySelector('#gridStepValue').textContent = gridSettings.step + 'px';
              }
              // Un refuz permanent al DOM-ului nu trebuie să împiedice restaurarea datelor.
              try {
                render();
              } catch {}
            }
            return false;
          }
        }

        /**
         * Mută starea curentă în istoricul Redo și restaurează instantaneul anterior, dacă există.
         */
        function undo() {
          if (history.length < 2) return;
          future.push(history.pop());
          loadState(history.at(-1));
        }

        /**
         * Reaplică ultimul instantaneu anulat și îl adaugă înapoi în istoricul Undo.
         */
        function redo() {
          if (!future.length) return;
          const s = future.pop();
          history.push(s);
          loadState(s);
        }

        /**
         * Amână salvarea cu 180 ms și anulează cererea precedentă pentru a reuni modificările succesive.
         */
        function scheduleSave() {
          clearTimeout(saveTimer);
          saveTimer = setTimeout(saveActiveDiagram, 180);
        }

        /**
         * Rarefiază și estompează numai punctele desenate la zoom mic; pasul geometric folosit pentru snap rămâne neschimbat.
         */
        function applyGridAppearance() {
          // Se răresc numai punctele desenate; fixarea pe grilă și geometria folosesc mereu gridSettings.step.
          const basePeriod = gridSettings.step * scale,
            stride = 2 ** Math.max(0, Math.ceil(Math.log2(12 / basePeriod))),
            period = basePeriod * stride;
          const fade = Math.max(0, Math.min(1, (scale - 0.06) / 0.44)),
            offset =
              /**
               * Normalizează decalajul grilei în intervalul unei perioade vizuale.
               */
              (value) => ((value % period) + period) % period;
          canvas.style.setProperty('--grid-screen-step', `${period}px`);
          canvas.style.setProperty('--grid-shift-x', `${offset(pan.x - period / 2)}px`);
          canvas.style.setProperty('--grid-shift-y', `${offset(pan.y - period / 2)}px`);
          canvas.style.setProperty('--grid-opacity', String((gridSettings.opacity / 100) * fade));
          canvas.classList.toggle(
            'grid-hidden',
            !gridSettings.visible || gridSettings.opacity === 0 || fade === 0,
          );
        }

        /**
         * Afișează factorul de zoom curent ca procent în bara de unelte.
         */
        function updateZoomReadout() {
          const level = $('#zoomLevel');
          if (level) level.textContent = `${Math.round(scale * 100)}%`;
          if ($('#zoomReset')) $('#zoomReset').dataset.shortLabel = level?.textContent || '100%';
        }

        /**
         * Aplică translația și zoomul planșei, actualizează grila și mânerele și alege randarea DOM sau vederea de ansamblu.
         */
        function applyView() {
          world.style.transform = `translate(${pan.x}px,${pan.y}px) scale(${scale})`;
          applyGridAppearance();
          updateZoomReadout();
          renderResizeHandles();
          for (const handle of edgeHandles.children) {
            const size = (handle.classList.contains('mid') ? 30 : 38) / scale;
            handle.style.width = size + 'px';
            handle.style.height = size + 'px';
          }
          clearTimeout(viewportTimer);
          if (activeDiagramId) scheduleSave();
          if (scale < 0.22 !== overviewActive) {
            render();
            return;
          }
          if (overviewActive) paintOverviewSoon();
          else if (!drag || drag.kind === 'pan') viewportTimer = setTimeout(render, 80);
        }

        /**
         * Afișează temporar un mesaj text în planșă, fără a interpreta mesajul ca HTML.
         */
        function toast(t) {
          const e = $('#toast');
          e.textContent = t;
          e.classList.add('show');
          setTimeout(() => e.classList.remove('show'), 1800);
        }

        /**
         * Construiește un dialog modal din elemente DOM și textContent; rezolvă promisiunea cu răspunsul sau valoarea introdusă.
         */
        function appDialog({ title, message, value, confirmLabel = 'OK', danger = false }) {
          return new Promise(
            /**
             * Leagă evenimentele și rezolvarea rezultatului asincron pentru appDialog.
             */
            (resolve) => {
              const dialog = document.createElement('dialog');
              dialog.className = 'app-dialog';
              const form = document.createElement('form');
              const heading = document.createElement('h2');
              heading.textContent = title;
              const body = document.createElement('p');
              body.textContent = message;
              form.append(heading, body);
              let input = null;
              if (value !== undefined) {
                input = document.createElement('input');
                input.value = value;
                input.setAttribute('aria-label', title);
                form.appendChild(input);
              }
              const actions = document.createElement('div');
              actions.className = 'dialog-actions';
              const cancel = document.createElement('button');
              cancel.type = 'button';
              cancel.textContent = 'Anulează';
              cancel.onclick =
                /**
                 * Gestionează „onclick” în appDialog; efectele sunt limitate la acțiunea controlului respectiv.
                 */
                () => dialog.close('cancel');
              const ok = document.createElement('button');
              ok.type = 'submit';
              ok.className = 'dialog-confirm' + (danger ? ' dialog-danger' : '');
              ok.textContent = confirmLabel;
              actions.append(cancel, ok);
              form.appendChild(actions);
              form.addEventListener('submit', (event) => {
                event.preventDefault();
                dialog.close('confirm');
              });
              dialog.appendChild(form);
              dialog.addEventListener(
                'close',
                () => {
                  const accepted = dialog.returnValue === 'confirm';
                  resolve(value === undefined ? accepted : accepted ? input.value : null);
                  dialog.remove();
                },
                { once: true },
              );
              document.body.appendChild(dialog);
              dialog.showModal();
              if (input) {
                input.focus();
                input.select();
              }
            },
          );
        }

        // ============================================================================
        // 03. Ierarhia nodurilor, selecția și clipboard-ul
        // ============================================================================

        /**
         * Caută un nod după ID în indexul modelului și reconstruiește indexul numai când geometria s-a schimbat.
         */
        function el(id) {
          if (nodeIndexVersion !== geometryVersion) {
            nodeIndex = new Map(nodes.map((n) => [n.id, n]));
            nodeIndexVersion = geometryVersion;
          }
          return nodeIndex.get(id);
        }

        /**
         * Actualizează marcajele vizuale ale selecției, mânerele și comenzile disponibile fără să schimbe nodurile selectate.
         */
        function refreshNodeSelection() {
          world.querySelectorAll('.node').forEach((d) => {
            const active = selectedNodes.has(d.dataset.id),
              node = el(d.dataset.id);
            d.classList.toggle('selected', active);
            d.classList.toggle('label-position-mode', labelPositionMode && active);
            d.classList.toggle(
              'label-positioned',
              !!node?.labelPos || (labelPositionMode && active),
            );
          });
          renderResizeHandles();
          refreshPortAlignmentHighlights();
          syncEdgeStyle();
          if (renderedSelectedEdge !== selected) drawEdgesSoon();
        }

        /**
         * Urmărește lanțul de părinți pentru a stabili apartenența la un container; oprește căutarea dacă întâlnește un ciclu.
         */
        function isDescendant(id, ancestor) {
          const seen = new Set();
          let n = el(id);
          while (n?.parent && !seen.has(n.id)) {
            if (n.parent === ancestor) return true;
            seen.add(n.id);
            n = el(n.parent);
          }
          return false;
        }

        /**
         * Calculează adâncimea unui nod în ierarhie, cu protecție împotriva ciclurilor.
         */
        function nodeDepth(n) {
          let depth = 0,
            p = n.parent;
          const seen = new Set([n.id]);
          while (p && !seen.has(p)) {
            seen.add(p);
            depth++;
            p = el(p)?.parent;
          }
          return depth;
        }
        // Părintele se desenează înaintea descendenților. Subarborii fraților desenați ulterior
        // rămân integral deasupra celor precedenți, indiferent de adâncimea ierarhiei.

        /**
         * Construiește ordinea de desenare în care un container este pictat înaintea descendenților săi și memorează rezultatul.
         */
        function nodePaintRanks() {
          if (paintOrderVersion === geometryVersion) return paintRanks;
          const children = new Map(),
            known = new Set(nodes.map((n) => n.id));
          for (const node of nodes) {
            const parent = known.has(node.parent) ? node.parent : null;
            if (!children.has(parent)) children.set(parent, []);
            children.get(parent).push(node);
          }
          const ranks = new Map(),
            seen = new Set();

          /**
           * Parcurge recursiv copiii unui nod și le atribuie poziții în ordinea de desenare, fără a vizita același nod de două ori.
           */
          function visit(node) {
            if (seen.has(node.id)) return;
            seen.add(node.id);
            ranks.set(node.id, ranks.size + 1);
            for (const child of children.get(node.id) || []) visit(child);
          }
          for (const root of children.get(null) || []) visit(root);
          for (const node of nodes) visit(node);
          paintRanks = ranks;
          paintOrderVersion = geometryVersion;
          return ranks;
        }

        /**
         * Caută primul strămoș comun potrivit pentru două noduri conectate.
         */
        function sharedContainer(a, b) {
          if (!a || !b) return null;
          let parent = a.parent ? el(a.parent) : null;
          while (parent) {
            if (parent.id !== b.id && isDescendant(b.id, parent.id)) return parent;
            parent = parent.parent ? el(parent.parent) : null;
          }
          return null;
        }

        /**
         * Alege containerul relevant pentru o conexiune din ierarhia nodurilor de la capete.
         */
        function edgeContainer(a, b) {
          const shared = sharedContainer(a, b);
          if (shared) return shared;
          if (a?.parent && b?.parent) {
            const da = nodeDepth(a),
              db = nodeDepth(b);
            return el(da > db ? a.parent : b.parent);
          }
          return a?.parent ? el(a.parent) : b?.parent ? el(b.parent) : null;
        }

        /**
         * Creează sau reutilizează stratul SVG al conexiunilor asociate unui container.
         */
        function innerEdgeLayer(container) {
          let layer = innerEdgeLayers.get(container.id);
          if (!layer) {
            layer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            layer.classList.add('edges', 'internal-edges');
            layer.setAttribute('aria-hidden', 'true');
            innerEdgeLayers.set(container.id, layer);
            world.appendChild(layer);
          }
          // drawEdges golește fiecare strat o singură dată, apoi îi desenează toate conexiunile.
          layer.style.display = 'block';
          const parentElement = world.querySelector(`[data-id="${container.id}"]`),
            rank = nodePaintRanks().get(container.id) || 1,
            parentZ = Number(parentElement?.style.zIndex) || rank * 2;
          layer.style.zIndex = String((nodes.length + 1) * 8 + 100);
          return layer;
        }

        /**
         * Ridică temporar nodurile mutate deasupra celorlalte elemente pentru ca gestul de tragere să rămână vizibil.
         */
        function raiseDraggedNodes(ids) {
          const ranks = nodePaintRanks(),
            base = (nodes.length + 1) * 4;
          for (const id of ids) {
            const element = world.querySelector(`[data-id="${id}"]`);
            if (element) element.style.zIndex = String(base + 2 * (ranks.get(id) || 0));
          }
        }

        /**
         * Mută nodurile indicate la finalul ordinii modelului pentru a le aduce în față la randare.
         */
        function bringNodesToFront(ids) {
          const chosen = new Set(ids),
            moving = nodes.filter((n) => chosen.has(n.id));
          nodes = [...nodes.filter((n) => !chosen.has(n.id)), ...moving];
          paintOrderVersion = -1;
        }

        /**
         * Deplasează descendenții unui container cu același vector și folosește indexul ierarhiei pentru a evita căutări repetate.
         */
        function shiftDescendants(id, dx, dy) {
          if (!dx && !dy) return;
          if (childrenIndexVersion !== geometryVersion) {
            childrenIndex = new Map();
            for (const node of nodes)
              if (node.parent) {
                if (!childrenIndex.has(node.parent)) childrenIndex.set(node.parent, []);
                childrenIndex.get(node.parent).push(node);
              }
            childrenIndexVersion = geometryVersion;
          }
          const seen = new Set([id]);

          /**
           * Aplică deplasarea unui nod și continuă recursiv cu descendenții săi.
           */
          function shift(parent) {
            for (const child of childrenIndex.get(parent) || []) {
              if (seen.has(child.id)) continue;
              seen.add(child.id);
              child.x += dx;
              child.y += dy;
              shift(child.id);
            }
          }
          shift(id);
        }

        /**
         * Elimină relațiile de părinte inexistente sau ciclice înainte de folosirea ierarhiei.
         */
        function normalizeHierarchy() {
          for (const n of nodes) {
            const seen = new Set([n.id]);
            let p = n.parent;
            while (p) {
              if (seen.has(p) || !el(p)) {
                delete n.parent;
                break;
              }
              seen.add(p);
              p = el(p).parent;
            }
          }
        }

        /**
         * Returnează numai nodurile selectate care nu au deja un strămoș selectat, evitând mutarea dublă a copiilor.
         */
        function selectedRoots() {
          return [...selectedNodes].filter(
            (id) =>
              el(id) &&
              ![...selectedNodes].some((other) => other !== id && isDescendant(id, other)),
          );
        }

        /**
         * Construiește o copie exportabilă a selecției, cu descendenții și legăturile interne, fără părinți aflați în afara selecției.
         */
        function selectedDiagramData() {
          if (!selectedNodes.size) return null;
          const roots = selectedRoots(),
            ids = new Set(
              nodes
                .filter((n) => roots.some((id) => n.id === id || isDescendant(n.id, id)))
                .map((n) => n.id),
            ),
            picked = nodes.filter((n) => ids.has(n.id)).map((n) => structuredClone(n));
          for (const n of picked) if (n.parent && !ids.has(n.parent)) delete n.parent;
          return {
            format: 'els',
            version: 1,
            geometry: gridMetadata(),
            nodes: picked,
            edges: edges.filter((e) => ids.has(e.from) && ids.has(e.to)).map((e) => ({ ...e })),
          };
        }

        /**
         * Copiază selecția ca JSON ELS în clipboard-ul intern și, când browserul permite, în clipboard-ul sistemului.
         */
        function copySelection() {
          const data = selectedDiagramData();
          if (!data) {
            toast('Selectează un nod sau un grup');
            return;
          }
          clipboard = { nodes: data.nodes, edges: data.edges, geometry: data.geometry };
          pasteCount = 0;
          const text = JSON.stringify(data, null, 2);
          if (navigator.clipboard?.writeText)
            navigator.clipboard
              .writeText(text)
              .then(
