<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 710" role="img" aria-labelledby="title desc">
<title id="title">Arborele din I'm My Own Grandpa</title><desc id="desc">Father este tatăl lui Narrator. Widow este mama lui Daughter. Father se căsătorește cu Daughter și au un fiu. Narrator se căsătorește cu Widow și au un fiu. Este aceeași structură familială din monologul românesc.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#187d75"/></marker></defs>
<rect width="600" height="710" rx="18" fill="white"/>
<g fill="none" stroke-width="3"><path d="M250 105H350M250 410H350" stroke="#a65e27" stroke-dasharray="8 5"/><g stroke="#187d75" marker-end="url(#arrow)"><path d="M300 105V205M300 410V510"/><path d="M55 105H22V410H55M545 410H578V105H545"/></g></g>
<g fill="#f0f7f4" stroke="#8cadab" stroke-width="1.5"><rect x="55" y="65" width="195" height="80" rx="14"/><rect x="350" y="65" width="195" height="80" rx="14"/><rect x="140" y="205" width="320" height="90" rx="14"/><rect x="55" y="370" width="195" height="80" rx="14"/><rect x="350" y="370" width="195" height="80" rx="14"/><rect x="140" y="510" width="320" height="90" rx="14"/></g>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#20343d"><g font-size="23" font-weight="700"><text x="152" y="101">Father</text><text x="447" y="101">Daughter</text><text x="300" y="239">Father's son</text><text x="152" y="406">Narrator</text><text x="447" y="406">Widow</text><text x="300" y="544">Narrator's son</text></g><g font-size="17"><text x="152" y="126">Tatăl povestitorului</text><text x="447" y="126">Fiica văduvei</text><text x="300" y="267">Fiul tatălui și al fiicei văduvei</text><text x="152" y="431">Povestitorul</text><text x="447" y="431">Văduva</text><text x="300" y="572">Fiul povestitorului și al văduvei</text></g><g font-size="17" fill="#a65e27"><text x="300" y="43">Căsătoria tatălui</text><text x="300" y="348">Căsătoria povestitorului</text></g><g font-size="16"><text x="300" y="184">copilul lor</text><text x="300" y="489">copilul lor</text></g></g>
