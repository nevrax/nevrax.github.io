<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nevrax</title>
    <link rel="stylesheet" href="assets/css/cutedog.css">
</head>
<body>
    <div class="husky" aria-hidden="true">
        <div class="mane">
            <div class="coat"></div>
        </div>
        <div class="body">
            <div class="head">
                <div class="ear"></div>
                <div class="ear"></div>
                <div class="face">
                    <div class="eye"></div>
                    <div class="eye"></div>
                    <div class="nose"></div>
                    <div class="mouth">
                        <div class="lips"></div>
                        <div class="tongue"></div>
                    </div>
                </div>
            </div>
            <div class="torso"></div>
        </div>
        <div class="legs">
            <div class="front-legs">
                <div class="leg"></div>
                <div class="leg"></div>
            </div>
            <div class="hind-leg"></div>
        </div>
        <div class="tail">
            <div class="tail">
                <div class="tail">
                    <div class="tail">
                        <div class="tail">
                            <div class="tail">
                                <div class="tail"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <svg aria-hidden="true" focusable="false" style="display: none">
        <defs>
            <filter id="squiggly-0">
                <feTurbulence baseFrequency="0.02" numOctaves="3" result="noise" seed="0"/>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
            </filter>
            <filter id="squiggly-1">
                <feTurbulence baseFrequency="0.02" numOctaves="3" result="noise" seed="1"/>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
            </filter>
            <filter id="squiggly-2">
                <feTurbulence baseFrequency="0.02" numOctaves="3" result="noise" seed="2"/>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
            </filter>
            <filter id="squiggly-3">
                <feTurbulence baseFrequency="0.02" numOctaves="3" result="noise" seed="3"/>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
            </filter>
            <filter id="squiggly-4">
                <feTurbulence baseFrequency="0.02" numOctaves="3" result="noise" seed="4"/>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="1"/>
            </filter>
        </defs>
    </svg>
</body>
</html>
